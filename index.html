      const d = JSON.parse(raw);
      const merged = {...defaultSave(), ...d, stats:{...defaultSave().stats,...(d.stats||{})}, settings:{...defaultSave().settings,...(d.settings||{})}};
      if(!Array.isArray(merged.collection)) merged.collection=[...START_DECK];
      if(!Array.isArray(merged.deck) || merged.deck.length!==5) merged.deck=[...START_DECK];
      if(!merged.clientId) merged.clientId='P'+Math.random().toString(36).slice(2)+Date.now().toString(36);

  function weightedRarity(rates){
    const total=Object.values(rates).reduce((a,b)=>a+b,0); let x=Math.random()*total;
    for(const [r,v] of Object.entries(rates)){ x-=v; if(x<=0) return r; }
    return 'C';
  }
  function pickCard(pack, minRarity){
    let rarity = weightedRarity(pack.rates);
    if(minRarity && RARITIES[rarity].order < RARITIES[minRarity].order){
      const choices = Object.keys(RARITIES).filter(r=>RARITIES[r].order>=RARITIES[minRarity].order && (pack.rates[r]||0)>0);
      rarity = choices[Math.floor(Math.random()*choices.length)] || minRarity;
    }
    let pool = CARDS.filter(c=>c.rarity===rarity);
    if(pack.only==='monster') pool=pool.filter(c=>c.type==='monster');
    if(pack.only==='energy') pool=pool.filter(c=>c.type==='energy');
    if(pack.only==='special') pool=pool.filter(c=>c.specialSet);
    if(pack.only==='support') pool=pool.filter(c=>c.type==='support');
    if(!pool.length) pool=CARDS.filter(c=>c.type===pack.only || !pack.only);
    return pool[Math.floor(Math.random()*pool.length)].id;
  }
  function buyPack(id){
    const p=packById(id);
    if(saveData.gems<p.cost){ toast('ジェムが足りません'); return; }
    if(saveData.settings.confirmPack && !confirm(`${p.name}を${p.cost}ジェムで開封しますか？`)) return;
    saveData.gems-=p.cost;
    const drawCount = p.draws || 5;
    const cards=[]; for(let i=0;i<drawCount;i++) cards.push(pickCard(p, p.guarantee && i===drawCount-1 ? p.guarantee : null));
    saveData.collection.push(...cards); saveData.stats.packs++; save();
    ui.view='opening'; ui.packId=id; ui.openingStage='ready'; ui.openingCards=cards; ui.revealed=0; render();
  }

  function onlineReady(){ return !!(ONLINE_CONFIG.apiKey && ONLINE_CONFIG.projectId && ONLINE_CONFIG.appId); }
  async function initOnline(){
    if(onlineApi) return true;
    if(!onlineReady()){ toast('Firebase設定が必要です'); return false; }
    try{
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js');
      const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js');
      const fbApp = appMod.initializeApp(ONLINE_CONFIG);
      const db = fsMod.getFirestore(fbApp);
      onlineApi = {db, ...fsMod};
      return true;
    }catch(err){ console.error(err); toast('オンライン初期化に失敗しました'); return false; }
  }
  function onlineRole(st){ if(!st) return 'p1'; return st.p1?.id===saveData.clientId ? 'p1' : 'p2'; }

  async function startOnlineSearch(){
    const code = String(ui.online.code||'').replace(/\D/g,'').slice(0,3);
    if(code.length!==3){ toast('3桁の数字を入力してください'); return; }
    if(!(await initOnline())) return;
    const {db,collection,query,where,getDocs,addDoc,doc,updateDoc,onSnapshot} = onlineApi;
    ui.online.status='searching'; ui.online.message='15秒以内に同じコードを入力した相手を探しています...'; render();
    const now = Date.now(); const hp = onlineHp();
    try{
      const q = query(collection(db, ONLINE_COLLECTION), where('passcode','==',code), where('status','==','waiting'));
      const snap = await getDocs(q);
      let found = null;
      snap.forEach(d=>{ const m={id:d.id,...d.data()}; if(!found && m.p1?.id!==saveData.clientId && now-(m.createdAtMs||0)<=15000) found=m; });
      if(found){
        await updateDoc(doc(db, ONLINE_COLLECTION, found.id), {status:'playing',p2:{id:saveData.clientId,nickname:saveData.nickname},p2Hp:hp,p2MaxHp:hp,p2Energy:0,turn:'p1',lastLog:`${saveData.nickname} が入室しました`,updatedAtMs:now});
        listenOnlineMatch(found.id); ui.online.matchId=found.id; ui.online.message='マッチしました';
      }else{
        const ref = await addDoc(collection(db, ONLINE_COLLECTION), {passcode:code,status:'waiting',createdAtMs:now,updatedAtMs:now,p1:{id:saveData.clientId,nickname:saveData.nickname},p1Hp:hp,p1MaxHp:hp,p1Energy:0,turn:'p1',lastLog:'対戦相手を待っています'});
        listenOnlineMatch(ref.id); ui.online.matchId=ref.id; ui.online.message='部屋を作成しました。相手を待っています...';
      }
    }catch(err){ console.error(err); ui.online.status='idle'; ui.online.message='オンライン接続に失敗しました。Firebase設定とルールを確認してください。'; toast('接続に失敗しました'); }
    render();
  }
  function listenOnlineMatch(id){
    if(onlineUnsub) onlineUnsub();

      if(!snap.exists()){ ui.online={code:'',status:'idle',selected:null,matchId:null,state:null,message:'部屋が終了しました'}; render(); return; }
      const data={id:snap.id,...snap.data()}; ui.online.state=data; ui.online.status=data.status; ui.online.message=data.lastLog||'';
      if(data.status==='finished' && data.winnerId===saveData.clientId && !onlineRewardedMatches.has(data.id)){ onlineRewardedMatches.add(data.id); saveData.gems+=300; save(); }
      render();
    }, err=>{ console.error(err); toast('オンライン監視エラー'); });
  }

      dmg=Math.floor((card.atk||10)+myEnergy*8+RARITIES[card.rarity].order*7+Math.random()*16); myEnergy=Math.max(0,myEnergy-1); otherHp=Math.max(0,otherHp-dmg); patch[myEnergyKey]=myEnergy; patch[otherHpKey]=otherHp; log=`${saveData.nickname} の ${card.name}！ ${dmg}ダメージ`; attackEffect(card.element,dmg);

  function addSlash(color,rot){ const s=document.createElement('i'); s.className='slash'; s.style.setProperty('--pc',color); s.style.setProperty('--rot',rot+'deg'); fx.appendChild(s); setTimeout(()=>s.remove(),520); }
  function addBeam(color,rot){ const s=document.createElement('i'); s.className='effectBeam'; s.style.setProperty('--pc',color); s.style.setProperty('--rot',rot+'deg'); fx.appendChild(s); setTimeout(()=>s.remove(),650); }
  function addImpact(color){ const s=document.createElement('i'); s.className='impactRing'; s.style.setProperty('--pc',color); fx.appendChild(s); setTimeout(()=>s.remove(),700); }
  function screenFlash(color){ const f=document.createElement('i'); f.className='screenFlash'; f.style.setProperty('--fc',color); fx.appendChild(f); setTimeout(()=>f.remove(),420); }
  function addDamage(n){ const d=document.createElement('div'); d.className='damageNum'; d.textContent='-'+n; fx.appendChild(d); setTimeout(()=>d.remove(),900); }
  function rareEffect(r){ const e=document.createElement('i'); e.className='rareFull'; fx.appendChild(e); setTimeout(()=>e.remove(),800); if(r==='EX') screenFlash('#ffffff99'); }

  document.addEventListener('input',e=>{
    if(e.target.id==='nickInput'){ saveData.nickname=e.target.value.slice(0,12)||'Player'; save(); }
    if(e.target.id==='adminCodeInput'){ ui.adminCode=e.target.value.replace(/\D/g,'').slice(0,7); e.target.value=ui.adminCode; }
    if(e.target.id==='onlineCodeInput'){ ui.online.code=e.target.value.replace(/\D/g,'').slice(0,3); e.target.value=ui.online.code; }
  });
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]'); if(!el) return; const a=el.dataset.action;
    if(a==='start'){ save(); ui.view='home'; render(); }
    if(a==='goto'){ ui.view=el.dataset.view; render(); }
    if(a==='quickBattle'){ const b=BOSSES[Math.min(saveData.storyProgress, BOSSES.length-1)]; startBattle(b.id); }
    if(a==='buyPack') buyPack(el.dataset.pack);
    if(a==='tearPack' && ui.openingStage==='ready'){ ui.openingStage='shaking'; render(); setTimeout(()=>{ui.openingStage='tearing'; render();},650); setTimeout(()=>{ui.openingStage='opened'; rareEffect('R'); render();},1280); }
    if(a==='revealCard') revealCard(Number(el.dataset.index));
    if(a==='finishOpening'){ ui.view='home'; render(); }
    if(a==='addDeck') addDeck(el.dataset.cardid);
    if(a==='removeDeck') removeDeck(el.dataset.index);
    if(a==='saveDeck') saveDeck();
    if(a==='filter'){ ui.filter=el.dataset.filter; render(); }
    if(a==='startBattle') startBattle(el.dataset.boss);
    if(a==='selectBattleCard'){ if(ui.battle&&!ui.battle.locked&&!ui.battle.result){ui.battle.selected=Number(el.dataset.index); render();} }
    if(a==='battleAction') battleAction();
    if(a==='autoSelect') autoSelect();
    if(a==='endBattle'){ ui.battle=null; ui.view='home'; render(); }
    if(a==='finishBattle'){ ui.battle=null; ui.view='home'; render(); }
    if(a==='toggleSetting'){ const k=el.dataset.key; saveData.settings[k]=!saveData.settings[k]; save(); render(); }
    if(a==='copyExport'){ navigator.clipboard?.writeText(exportCode()); toast('コピーしました'); }
    if(a==='importSave'){ try{importCode(document.getElementById('importBox').value);}catch(err){toast('セーブコードが正しくありません');} }
    if(a==='dailyBonus') dailyBonus();
    if(a==='runAdminCode') runAdminCode();
    if(a==='clearAdminCode'){ ui.adminCode=''; render(); }
    if(a==='startOnlineSearch') startOnlineSearch();
    if(a==='cancelOnlineSearch') cancelOnlineSearch();
    if(a==='leaveOnline') leaveOnline();
    if(a==='selectOnlineCard'){ ui.online.selected=Number(el.dataset.index); render(); }
    if(a==='onlineAction') onlineAction();
    if(a==='onlineAutoSelect') onlineAutoSelect();
    if(a==='finishOnlineBattle'){ leaveOnline(); }
    if(a==='softReset'){ if(confirm('本当に最初からやり直しますか？')){ saveData=defaultSave(); save(); ui.view='title'; render(); } }
  });
  save(); render();
  </script>
</body>
</html>
