const generateId = () => {
  try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Math.random().toString(36).substring(2, 15);
};

// 星の数で強さを表現
const getStars = (power) => {
  if (power >= 11) return '⭐⭐⭐⭐⭐';
  if (power >= 8) return '⭐⭐⭐⭐';
  if (power >= 6) return '⭐⭐⭐';
  if (power >= 4) return '⭐⭐';
  return '⭐';
};

const generateRandomCard = (packId) => {
  const pack = PACKS.find(p => p.id === packId) || PACKS[0];
  const rand = Math.random();
  let rarity = 'N';
  let cumulative = 0;
  for (const [r, chance] of Object.entries(pack.chances)) {
    cumulative += chance;
    if (rand <= cumulative) { rarity = r; break; }
  }
  
  let pool = CARD_CATALOG.filter(c => c.rarity === rarity);
  if (pack.pickups) {
    const pickups = pool.filter(c => pack.pickups.includes(c.element));
    pool = [...pool, ...pickups, ...pickups];
  }
  
  const baseCard = pool[Math.floor(Math.random() * pool.length)];
  return JSON.parse(JSON.stringify({ ...baseCard, instanceId: generateId() })); // 安全なディープコピー
};

const calculateDamage = (card1, card2) => {
  if (!card1 || !card2) return { p1: 0, p2: 0 };
  let p1Power = card1.power || 0;
  let p2Power = card2.power || 0;
  if (ELEMENTS[card1.element]?.strongAgainst === card2.element) p1Power += 3;
  if (ELEMENTS[card2.element]?.strongAgainst === card1.element) p2Power += 3;
  if (p1Power > p2Power) return { p1: 1, p2: 0 };
  if (p2Power > p1Power) return { p1: 0, p2: 1 };
  return { p1: 0, p2: 0 };
};

const copyToClipboard = (text) => {
  try {
    const el = document.createElement('textarea'); el.value = text;
    el.style.position = 'absolute'; el.style.left = '-9999px';
    document.body.appendChild(el); el.select();
    const res = document.execCommand('copy');
    document.body.removeChild(el); return res;
  } catch (e) { return false; }
};

const HpBar = ({ hp, maxHp }) => {

  if (percent <= 25) color = 'from-red-400 via-red-500 to-red-600';
  
  return (
    <div className="w-28 md:w-40 h-3.5 md:h-4 bg-slate-950 rounded-full overflow-hidden border border-slate-700 shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] relative flex items-center">
      <div className={`h-full bg-gradient-to-r ${color} transition-all duration-500 ease-out`} style={{ width: `${percent}%` }}></div>
      <div className="absolute inset-0 flex items-center justify-center text-[10px] md:text-[11px] font-black text-white drop-shadow-[0_1px_1px_rgba(0,0,0,1)] tracking-widest">
        {hp} / {maxHp}
      </div>
    </div>
  );
};

// ==========================================
// 5. Main Application Component
// ==========================================
function App() {
  const [user, setUser] = useState(null);
  const [gameState, setGameState] = useState('title');
  const [saveData, setSaveData] = useState({ nickname: '', crystals: 1000, cards: [], deck: [], pveStage: 1, storyCleared: false });
  
  const [nicknameInput, setNicknameInput] = useState('');
  const [saveCodeInput, setSaveCodeInput] = useState('');
  const [roomCodeInput, setRoomCodeInput] = useState('');
  const [notification, setNotification] = useState('');

  const [selectedPack, setSelectedPack] = useState(null);
  const [gachaCards, setGachaCards] = useState([]);
  const [gachaStep, setGachaStep] = useState('idle');
  const [revealedCount, setRevealedCount] = useState(0);

  const [deckBuilder, setDeckBuilder] = useState([]);
  const [storyIndex, setStoryIndex] = useState(0);

  const [battleData, setBattleData] = useState(null);
  const [matchId, setMatchId] = useState(null);

  useEffect(() => {
    try {
      const localSave = localStorage.getItem('tcg_save_v4');
      if (localSave && localSave !== "undefined") {
        const parsed = JSON.parse(localSave);
        if (parsed?.nickname) {
          setSaveData({
            nickname: parsed.nickname,
            crystals: typeof parsed.crystals === 'number' ? parsed.crystals : 1000,
            cards: Array.isArray(parsed.cards) ? parsed.cards.filter(Boolean) : [],
            deck: Array.isArray(parsed.deck) ? parsed.deck.filter(Boolean) : [],
            pveStage: typeof parsed.pveStage === 'number' ? parsed.pveStage : 1,
            storyCleared: !!parsed.storyCleared
          });
        }
      }
    } catch(e) {}

    if (!auth) return;
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
        else await signInAnonymously(auth);
      } catch (e) {}
    };
    initAuth();
    const unsubscribe = onAuthStateChanged(auth, setUser);
    return () => unsubscribe();
  }, []);

  useEffect(() => {
    if (saveData?.nickname) {
      try { localStorage.setItem('tcg_save_v4', JSON.stringify(saveData)); } catch(e) {}
      if (user && db) {
        try {
          const sRef = doc(db, 'artifacts', appId, 'users', user.uid, 'saveDataV4');
          setDoc(sRef, {
            nickname: saveData.nickname, crystals: saveData.crystals, pveStage: saveData.pveStage, storyCleared: saveData.storyCleared,
            cards: JSON.parse(JSON.stringify(saveData.cards || [])), deck: JSON.parse(JSON.stringify(saveData.deck || []))
          }).catch(()=>{});
        } catch(e) {}
      }
    }
  }, [saveData, user]);

  const showNotification = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };

  const startGame = () => {
    if (!nicknameInput.trim() && !saveData?.nickname) return showNotification("ニックネームを入力してください");
    if (!saveData?.nickname) setSaveData(p => ({ ...(p||{}), nickname: nicknameInput.trim() }));
    setGameState('menu');
  };

  const generateSaveCode = () => {
    try {
      const code = btoa(encodeURIComponent(JSON.stringify(saveData || {})));
      copyToClipboard(code);
      showNotification("セーブコードをコピーしました！");
    } catch(e) { showNotification("生成失敗"); }
  };

  const loadSaveCode = () => {
    try {
      if (!saveCodeInput) return;
      const data = JSON.parse(decodeURIComponent(atob(saveCodeInput)));
      if (data && typeof data === 'object' && data.nickname) {
        setSaveData({
          nickname: data.nickname || '', crystals: typeof data.crystals === 'number' ? data.crystals : 500,
          cards: Array.isArray(data.cards) ? data.cards.filter(Boolean) : [], deck: Array.isArray(data.deck) ? data.deck.filter(Boolean) : [],
          pveStage: typeof data.pveStage === 'number' ? data.pveStage : 1, storyCleared: !!data.storyCleared
        });
        showNotification("データを復元しました！");
        setGameState('menu');
      } else throw new Error("Invalid");
    } catch (e) { showNotification("無効なセーブコードです。"); }
  };

  // --- Deck logic ---
  const autoBuildDeck = () => {
    const sorted = [...(saveData?.cards||[])].sort((a,b) => b.power - a.power);
    return JSON.parse(JSON.stringify(sorted.slice(0, 5)));
  };

  const ensureDeck = () => {
    if (Array.isArray(saveData?.deck) && saveData.deck.length === 5) {
      return JSON.parse(JSON.stringify(saveData.deck));
    }
    if (!saveData?.cards || saveData.cards.length < 5) {
      showNotification("カードが5枚以上必要です！パックを引きましょう！");
      return null;
    }
    const autoDeck = autoBuildDeck();
    setSaveData(p => ({ ...p, deck: autoDeck }));
    showNotification("デッキが不足していたため自動編成しました！");
    return autoDeck;
  };

  const saveDeck = () => {
    if (deckBuilder.length !== 5) return showNotification("デッキはちょうど5枚選んでください！");
    setSaveData(p => ({ ...p, deck: JSON.parse(JSON.stringify(deckBuilder)) }));
    showNotification("デッキを保存しました！");
    setGameState('menu');
  };

  const toggleDeckCard = (card) => {
    if (deckBuilder.find(c => c.instanceId === card.instanceId)) {
      setDeckBuilder(deckBuilder.filter(c => c.instanceId !== card.instanceId));
    } else {
      if (deckBuilder.length >= 5) return showNotification("デッキは5枚までです！");
      setDeckBuilder([...deckBuilder, card]);
    }
  };

  // --- Gacha ---
  const openPackSelect = () => setGameState('packs');
  const pullPack = (packId) => {
    const pack = PACKS.find(p => p.id === packId);
    if ((saveData?.crystals || 0) < pack.price) return showNotification("クリスタル不足です");
    setSaveData(p => ({ ...(p||{}), crystals: Math.max(0, (p?.crystals||0) - pack.price) }));
    setSelectedPack(pack);
    setGachaCards([generateRandomCard(pack.id), generateRandomCard(pack.id), generateRandomCard(pack.id)]);
    setGachaStep('shaking'); setRevealedCount(0); setGameState('gacha');
    setTimeout(() => setGachaStep('opened'), 1500);
  };

  const revealCard = (index) => {
    if (gachaStep !== 'opened') return;
    const cards = [...(gachaCards || [])];
    if (cards[index] && !cards[index].revealed) {
      cards[index] = { ...cards[index], revealed: true };
      setGachaCards(cards);
      const newCount = revealedCount + 1;
      setRevealedCount(newCount);
      if (newCount >= 3) {
        setGachaStep('revealed');
        setSaveData(p => {
          const arr = [...(p?.cards||[]), ...cards.map(c => { const n={...c}; delete n.revealed; return n; })];
          return { ...(p||{}), cards: arr };
        });
      }
    }
  };

  // --- PvE ---
  const startStoryOrBattle = () => {
    const deckToUse = ensureDeck();
    if (!deckToUse) return;
    const stageId = saveData?.pveStage || 1;
    const stage = PVE_STAGES.find(s => s.id === stageId) || PVE_STAGES[PVE_STAGES.length-1];
    
    if (!saveData.storyCleared && stageId === stage.id && stage.texts) {
      setStoryIndex(0);
      setBattleData({ stage, playerDeck: deckToUse });
      setGameState('story');
    } else {
      initPvEBattle(stage, deckToUse);
    }
  };

  const nextStory = () => {
    const stage = battleData.stage;
    if (storyIndex < stage.texts.length - 1) {
      setStoryIndex(storyIndex + 1);
    } else {
      initPvEBattle(stage, battleData.playerDeck);
    }
  };

  const initPvEBattle = (stage, deckToUse) => {
    // 完全に独立した手札を生成 (5枚)
    const hand = JSON.parse(JSON.stringify(deckToUse));
    setBattleData({
      type: 'pve', stage, playerHand: hand,
      playerHp: INITIAL_PLAYER_HP, enemyHp: stage.hp,
      playerActive: null, enemyActive: null,
      animating: false, effect: null, finished: false,
      turnCount: 1
    });
    setGameState('pve');
  };

  const escapePvE = () => {
    setGameState('menu');
    setBattleData(null);
  };

  const playPvETurn = (idx) => {
    if (battleData?.animating || battleData?.finished) return;
    const hand = [...(battleData?.playerHand||[])];
    const pCard = hand[idx];
    if(!pCard) return;

    // 手札から消費する
    hand.splice(idx, 1);

    const el = Object.keys(ELEMENTS);
    const eCard = { id: 'e'+Date.now(), name: `幻影の${ELEMENTS[el[Math.floor(Math.random()*el.length)]].name}`, element: el[Math.floor(Math.random()*el.length)], rarity: 'R', power: (battleData?.stage?.deckPower||2) + Math.floor(Math.random()*3)-1 };

    setBattleData(p => ({ ...p, playerHand: hand, playerActive: pCard, enemyActive: eCard, animating: true }));

    setTimeout(() => {
      const { p1, p2 } = calculateDamage(pCard, eCard);
      setBattleData(p => ({ ...p, effect: { p1, p2 } }));

      setTimeout(() => {
        let nEHp = (battleData?.enemyHp||0) - p1;
        let nPHp = (battleData?.playerHp||0) - p2;
        
        // 終了判定（HPが尽きるか、手札の5枚を使い切ったら終了）
        if (nEHp <= 0 || nPHp <= 0 || hand.length === 0) {
          let won = false;
          if (nEHp <= 0) won = true;
          else if (nPHp <= 0) won = false;
          else won = nPHp >= nEHp; // 手札が尽きた場合はHPが同点以上なら勝ちとする

          if (won) {
            const nextStage = (battleData?.stage?.id || 1) + 1;
            const isCleared = nextStage > PVE_STAGES.length;
            setSaveData(p => ({ 
              ...(p||{}), 
              crystals: (p?.crystals||0) + (battleData?.stage?.reward||100), 
              pveStage: isCleared ? p.pveStage : Math.max(p.pveStage, nextStage),
              storyCleared: p.storyCleared || isCleared
            }));
          }
          setBattleData(p => ({ ...p, enemyHp: Math.max(0, nEHp), playerHp: Math.max(0, nPHp), effect: null, finished: true, won }));
        } else {
          // 次のターンへ
          setBattleData(p => ({ ...p, enemyHp: nEHp, playerHp: nPHp, playerActive: null, enemyActive: null, animating: false, effect: null, turnCount: p.turnCount + 1 }));
        }
      }, 1500);
    }, 800);
  };

  // --- PvP ---
  const startPvPMatchmaking = async () => {
    if (!saveData.storyCleared) return showNotification("まずはPVEクエストをすべてクリアしてストーリーを見届けろ！");
    if (!user || !db) return showNotification("通信エラー");
    if (roomCodeInput.length !== 3) return showNotification("3桁入力必須");
    
    const deckToUse = ensureDeck();
    if (!deckToUse) return;

    setGameState('pvp_match');
    const mRef = collection(db, 'artifacts', appId, 'public', 'data', 'matches');
    try {
      const snap = await getDocs(mRef);
      const now = Date.now();
      let fMatch = null;
      snap.forEach(d => {
        const dd = d.data();
        if (dd.code === roomCodeInput && dd.status === 'waiting' && (now - dd.timestamp < 15000)) fMatch = { id: d.id, ...dd };
      });

      const pDeck = JSON.parse(JSON.stringify(deckToUse));
      const pData = { uid: user.uid, name: saveData?.nickname || 'ゲスト', deck: pDeck };

      if (fMatch) {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', fMatch.id), { player2: pData, status: 'playing' });
        setMatchId(fMatch.id); listenToMatch(fMatch.id, 2);
      } else {
        const nRef = doc(mRef);
        await setDoc(nRef, { code: roomCodeInput, status: 'waiting', timestamp: now, player1: pData, p1Hp: INITIAL_PLAYER_HP, p2Hp: INITIAL_PLAYER_HP, turns: {}, currentTurn: 1 });
        setMatchId(nRef.id); listenToMatch(nRef.id, 1);
      }
    } catch (e) { showNotification("エラー発生"); setGameState('menu'); }
  };

  const listenToMatch = (mId, pNum) => {
    if (!db) return;
    const unsub = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId), (d) => {
      if (!d.exists()) return;
      const data = d.data();
      if (data.status === 'playing' || data.status === 'finished') {
        setGameState('pvp_battle');
        setBattleData({ ...data, myPlayerNum: pNum, myDeck: pNum === 1 ? data.player1?.deck : data.player2?.deck, enemyData: pNum === 1 ? data.player2 : data.player1, animating: false });
      }
    });
    if (pNum === 1) setTimeout(() => { getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId)).then(s => { if(s.exists() && s.data()?.status === 'waiting') { deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId)); showNotification("タイムアウト"); setGameState('menu'); setMatchId(null); unsub(); } }) }, 15000);
  };

  const playPvPTurn = async (idx) => {
    if (!matchId || !db || !battleData || battleData.finished) return;
    const mCard = battleData?.myDeck?.[idx];
    if (!mCard) return;
    const tData = battleData?.turns?.[`turn${battleData.currentTurn}`] || {};
    if (tData[`p${battleData.myPlayerNum}Card`]) return; // 既に出している場合は無効

    try {
      // ローカルのUIから手札を消す
      const nDeck = [...(battleData.myDeck || [])];
      nDeck.splice(idx, 1);
      setBattleData(p => ({ ...(p||{}), myDeck: nDeck }));

      // Firestoreを更新
      const isO = !!tData[`p${battleData.myPlayerNum===1?2:1}Card`];
      const cCard = JSON.parse(JSON.stringify(mCard));
      
      let upd = { 
        [`turns.turn${battleData.currentTurn}.p${battleData.myPlayerNum}Card`]: cCard,
        [`player${battleData.myPlayerNum}.deck`]: nDeck
      };

      if (isO) {
        const oCard = tData[`p${battleData.myPlayerNum===1?2:1}Card`];
        const p1C = battleData.myPlayerNum===1 ? cCard : oCard;
        const p2C = battleData.myPlayerNum===2 ? cCard : oCard;
        const { p1, p2 } = calculateDamage(p1C, p2C);
        
        const nP1Hp = (battleData.p1Hp||0) - p2; 
        const nP2Hp = (battleData.p2Hp||0) - p1;
        
        upd.p1Hp = nP1Hp; upd.p2Hp = nP2Hp;
        upd[`turns.turn${battleData.currentTurn}.result`] = { p1, p2 };
        if (nP1Hp <= 0 || nP2Hp <= 0 || (battleData.currentTurn||1) >= 5) upd.status = 'finished';
        else upd.currentTurn = (battleData.currentTurn||1) + 1;
      }
      await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', matchId), upd);
    } catch (e) { console.warn(e); }
  };

  const surrenderPvP = async () => {
    if (matchId && db && battleData && !battleData.finished) {
      try {
        let upd = { status: 'finished' };
        upd[`p${battleData.myPlayerNum}Hp`] = 0; // 自殺して相手の勝利にする
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', matchId), upd);
      } catch(e){}
    }
    setGameState('menu');
    setBattleData(null);
    setMatchId(null);
  };

  // ==========================================
  // CSS & Layout
  // ==========================================
  const customStyles = `
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes gradient-bg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .bg-animated { background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #020617); background-size: 400% 400%; animation: gradient-bg 20s ease infinite; }
    
    .card-container { perspective: 1000px; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .card-container:hover { transform: translateY(-10px) scale(1.05) rotate(-2deg); }
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .card-container.revealed .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 0.75rem; }
    .card-front { transform: rotateY(180deg); }
    
    .shadow-glow-blue { box-shadow: 0 0 20px 5px rgba(59, 130, 246, 0.5); }
    .shadow-glow-gold { box-shadow: 0 0 25px 8px rgba(234, 179, 8, 0.6); }
    .shadow-glow-rainbow { box-shadow: 0 0 30px 10px rgba(236, 72, 153, 0.7); animation: rainbow-shadow 3s linear infinite; }
    @keyframes rainbow-shadow { 0% { box-shadow: 0 0 30px 10px rgba(255, 0, 0, 0.7); } 33% { box-shadow: 0 0 30px 10px rgba(0, 255, 0, 0.7); } 66% { box-shadow: 0 0 30px 10px rgba(0, 0, 255, 0.7); } 100% { box-shadow: 0 0 30px 10px rgba(255, 0, 0, 0.7); } }
    .hologram-effect::after { content: ""; position: absolute; inset:0; background: linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.8) 40%, rgba(255,255,255,0.8) 60%, transparent 80%); background-size: 200% 200%; animation: holo-sweep 3s linear infinite; mix-blend-mode: overlay; pointer-events: none; }
    @keyframes holo-sweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @keyframes slide-up { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .anim-slide-up { animation: slide-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    @keyframes attack-shake { 0%, 100% { transform: translate(0,0) scale(0.9); } 25% { transform: translate(10px,-10px) scale(0.9); } 50% { transform: translate(-10px,10px) scale(0.9); } 75% { transform: translate(10px,10px) scale(0.9); } }
    .anim-attack { animation: attack-shake 0.3s ease-in-out infinite; }
  `;

  // --- Battle Arena Component (PvE & PvP Shared Layout) ---
  const renderBattleArena = () => {
    const isPvE = gameState === 'pve';
    const eHp = isPvE ? battleData.enemyHp : (battleData.myPlayerNum === 1 ? battleData.p2Hp : battleData.p1Hp);
    const eMax = isPvE ? battleData.stage.hp : INITIAL_PLAYER_HP;
    const eName = isPvE ? battleData.stage.name : battleData.enemyData?.name;
    const eActive = isPvE ? battleData.enemyActive : battleData?.turns?.[`turn${battleData.currentTurn}`]?.[`p${battleData.myPlayerNum===1?2:1}Card`];
    
    const pHp = isPvE ? battleData.playerHp : (battleData.myPlayerNum === 1 ? battleData.p1Hp : battleData.p2Hp);
    const pMax = isPvE ? INITIAL_PLAYER_HP : INITIAL_PLAYER_HP;
    const pActive = isPvE ? battleData.playerActive : battleData?.turns?.[`turn${battleData.currentTurn}`]?.[`p${battleData.myPlayerNum}Card`];
    
    const effect = battleData.effect; // PvE専用のダメージ演出用

    // 既にカードを出したか？
    const hasPlayedPvP = !isPvE && !!battleData?.turns?.[`turn${battleData.currentTurn}`]?.[`p${battleData.myPlayerNum}Card`];
    
    // 現在のターン数（UI表示用）
    const currentTurnDisplay = isPvE ? battleData.turnCount : battleData.currentTurn;

    return (
      <div className="max-w-md mx-auto w-full h-[90vh] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl relative flex flex-col font-sans antialiased border-[3px] border-slate-700">
        
        {/* === ENEMY ZONE === */}
        <div className="flex-1 flex flex-col p-4 bg-gradient-to-b from-red-950/60 to-slate-900 relative shadow-lg">
          <div className="flex justify-between items-center bg-black/60 p-3 rounded-2xl border border-slate-600 backdrop-blur-md shadow-md z-10">
             <div className="flex items-center gap-3 w-full">
               <div className="w-12 h-12 rounded-full bg-gradient-to-br from-slate-700 to-slate-900 border-2 border-red-500 flex items-center justify-center text-2xl shadow-inner flex-shrink-0">👾</div>
               <div className="flex-1">
                 <div className="font-black text-sm text-slate-200 tracking-wide drop-shadow-md mb-1">{eName || 'Unknown'}</div>
                 <HpBar hp={eHp} maxHp={eMax} />
               </div>
             </div>
             {/* 逃げる/降参ボタン */}
             {!battleData.finished && (
                <button onClick={isPvE ? escapePvE : surrenderPvP} className="ml-2 px-4 py-2 bg-gradient-to-r from-red-800 to-red-600 hover:from-red-700 hover:to-red-500 rounded-xl text-[10px] text-white font-black tracking-widest border border-red-400 shadow-lg whitespace-nowrap transition-transform hover:scale-105">
                  {isPvE ? 'ESCAPE' : 'SURRENDER'}
                </button>
             )}
          </div>
          
          <div className="flex-1 flex items-center justify-center relative mt-2">
             {eActive ? (
               <CardUI card={eActive} isRevealed={isPvE ? true : hasPlayedPvP} className={`transform scale-90 md:scale-100 ${battleData.animating ? 'anim-attack' : 'anim-slide-up'}`} />
             ) : (
               <div className="w-24 h-36 md:w-32 md:h-48 rounded-xl border-[3px] border-dashed border-red-900/50 flex items-center justify-center text-red-900/60 font-black tracking-widest bg-red-950/20 shadow-inner">ACTIVE</div>
             )}
          </div>
        </div>

        {/* === CENTER VS LINE === */}
        <div className="h-0 relative z-20">
           <div className="absolute top-1/2 left-0 w-full h-1.5 bg-gradient-to-r from-transparent via-red-500 to-transparent transform -translate-y-1/2 opacity-80 blur-[1px]"></div>
           <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-slate-900 rounded-full border-[4px] border-slate-600 flex items-center justify-center font-black italic text-2xl text-slate-200 shadow-[0_0_25px_rgba(255,50,50,0.5)]">VS</div>
        </div>

        {/* === PLAYER ZONE === */}
        <div className="flex-[1.3] flex flex-col p-4 bg-gradient-to-t from-blue-950/60 to-slate-900 relative">
          <div className="flex-1 flex items-center justify-center relative mb-4">
             {pActive ? (
               <CardUI card={pActive} isRevealed={true} className={`transform scale-90 md:scale-100 ${battleData.animating ? 'anim-attack' : 'anim-slide-up'}`} />
             ) : (

        )}

        {gameState === 'collection' && (
          <div className="w-full flex flex-col h-[85vh]">
            <div className="flex justify-between items-center mb-6 bg-slate-900/80 p-4 rounded-2xl border border-slate-700 backdrop-blur-md">
              <h2 className="text-3xl font-black tracking-widest">COLLECTION</h2>
              <button onClick={() => setGameState('menu')} className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors">BACK</button>
            </div>
            <div className="flex-1 overflow-y-auto pr-2 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4 content-start scrollbar-hide pb-10">
              {(!Array.isArray(saveData?.cards) || saveData.cards.length === 0) ? (
                <div className="col-span-full text-center text-slate-500 py-20 font-black text-2xl tracking-widest">NO CARDS</div>
              ) : (
                [...saveData.cards].sort((a,b) => (b?.power || 0) - (a?.power || 0)).map((card, idx) => (
                  <div key={card?.instanceId || idx} className="flex justify-center"><CardUI card={card} isRevealed={true} className="w-full h-auto aspect-[2/3] text-[0.5rem] hover:-translate-y-2 hover:shadow-[0_0_20px_rgba(255,255,255,0.2)] transition-transform" /></div>
                ))
              )}
            </div>
          </div>
        )}

        {gameState === 'story' && battleData && battleData.stage && (
          <div className="max-w-2xl mx-auto w-full h-[70vh] flex flex-col justify-end relative bg-slate-900 border-4 border-slate-700 rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)] anim-slide-up">
             {/* 簡易背景表現 */}
             <div className="absolute inset-0 bg-gradient-to-b from-slate-800 to-black z-0 opacity-80"></div>
             <div className="absolute top-16 w-full text-center z-10">
                <div className="text-7xl mb-6 drop-shadow-2xl opacity-90">{battleData.stage.id === 1 ? '🌲' : battleData.stage.id === 2 ? '🪨' : battleData.stage.id === 3 ? '🌋' : battleData.stage.id === 4 ? '🏛️' : '🌌'}</div>
                <h2 className="text-5xl font-black text-white tracking-widest drop-shadow-[0_5px_5px_rgba(0,0,0,1)]">{battleData.stage.name}</h2>
             </div>
             
             <div className="bg-slate-950/95 p-10 z-10 border-t-[4px] border-indigo-500 min-h-[220px] flex flex-col justify-between backdrop-blur-xl">
                <p className="text-2xl font-bold leading-loose text-slate-200">{battleData.stage.texts[storyIndex]}</p>
                <div className="text-right mt-8">
                   <button onClick={nextStory} className="px-12 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-full font-black text-xl tracking-widest shadow-[0_0_20px_rgba(79,70,229,0.5)] transition-transform hover:scale-105">
                     {storyIndex < battleData.stage.texts.length - 1 ? 'NEXT ▽' : 'BATTLE START!!'}
                   </button>
                </div>
             </div>
          </div>
        )}

        {(gameState === 'pve' || gameState === 'pvp_battle') && renderBattleArena()}

        {gameState === 'pvp_match' && (
          <div className="flex-1 flex flex-col items-center justify-center">
            <div className="w-32 h-32 border-[8px] border-indigo-500 border-t-transparent rounded-full animate-spin mb-10 shadow-[0_0_30px_rgba(99,102,241,0.5)]"></div>
            <h2 className="text-4xl font-black mb-6 tracking-widest drop-shadow-md">SEARCHING...</h2>
            <div className="bg-slate-900 p-8 rounded-3xl border-4 border-slate-700 text-center mb-10 min-w-[300px] shadow-2xl">
               <p className="text-slate-400 text-sm font-black mb-2 tracking-widest">MATCHING CODE</p>
               <p className="font-mono text-7xl font-black text-white tracking-widest drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">{roomCodeInput}</p>
            </div>
            <button onClick={leavePvP} className="px-12 py-4 border-[3px] border-slate-600 text-slate-300 font-black tracking-widest rounded-xl hover:bg-slate-800 transition-colors">CANCEL</button>
          </div>
        )}

      </main>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
