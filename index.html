const getEnergyTheme = (card) => {
  if (!card) return 'basic';
  if (card.energyTheme) return card.energyTheme;
  if (card.id === 'custom-nori-energy' || card.name === 'ノリエネルギー') return 'prism';
  return 'basic';
};

const getEnergyThemeMeta = (cardOrTheme) => {
  const theme = typeof cardOrTheme === 'string' ? cardOrTheme : getEnergyTheme(cardOrTheme);
  return ENERGY_THEME_META[theme] || ENERGY_THEME_META.basic;
};

const getEnergySupport = (cards = []) => {
  const energyCards = (cards || []).filter(c => c?.isEnergyCard || c?.element === 'Energy');
  const byTheme = {};
  energyCards.forEach(card => {
    const theme = getEnergyTheme(card);
    byTheme[theme] = (byTheme[theme] || 0) + 1;
  });
  const total = energyCards.length;
  return {
    total,
    byTheme,
    maxBonus: Math.min(2, byTheme.basic || 0) + Math.min(2, byTheme.prism || 0),
    turnBonus: Math.min(2, byTheme.basic || 0) + Math.min(1, byTheme.prism || 0),
    attackBonus: Math.min(8, ((byTheme.Fire || 0) * 2) + ((byTheme.Fighting || 0) * 2) + (byTheme.prism || 0)),
    healBonus: Math.min(12, ((byTheme.Water || 0) * 4) + ((byTheme.Light || 0) * 2) + (byTheme.prism || 0)),
    statusBonus: Math.min(4, (byTheme.Dark || 0) + (byTheme.prism || 0)),
    barrierBonus: Math.min(2, (byTheme.Wood || 0) + (byTheme.Metal || 0) > 0 ? 1 : 0) + Math.min(1, byTheme.prism || 0),
    gaugeBonus: Math.min(30, ((byTheme.Psychic || 0) * 10) + ((byTheme.prism || 0) * 5)),
    critBonus: Math.min(0.18, ((byTheme.Fighting || 0) * 0.04) + ((byTheme.prism || 0) * 0.02)),
    damageReduction: Math.min(12, ((byTheme.Metal || 0) * 3) + (byTheme.Wood || 0) + (byTheme.prism || 0))
  };
};

const describeEnergySupport = (support) => {
  if (!support || !support.total) return [];
  const chips = [];
  Object.entries(support.byTheme || {}).forEach(([theme, count]) => {
    const meta = getEnergyThemeMeta(theme);
    chips.push(`${meta.icon} ${meta.label}×${count}`);
  });
  if (support.attackBonus) chips.push(`⚔️ +${support.attackBonus}`);
  if (support.healBonus) chips.push(`💚 +${support.healBonus}`);
  if (support.gaugeBonus) chips.push(`✨ G+${support.gaugeBonus}`);
  if (support.damageReduction) chips.push(`🛡️ -${support.damageReduction}`);
  return chips;
};

const getLocalDateKey = (offset = 0) => {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const getWeekKey = () => {
  const d = new Date();
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2, '0')}`;
};

const upgradeImageCardBalance = (card = {}) => {
  if (!card || typeof card !== 'object') return card;
  const catalogBase = CARD_CATALOG.find(c => c.id === card.id);
  const merged = catalogBase ? { ...catalogBase, ...card, imageKey: card.imageKey || catalogBase.imageKey } : { ...card };
  if (merged.imageKey && CUSTOM_CARD_IMAGES[merged.imageKey]) {
    return {
      ...merged,
      rarity: 'UR',
      power: Math.max(Number(merged.power) || 0, 11),
      cardClass: merged.cardClass && String(merged.cardClass).includes('★5') ? merged.cardClass : `★5 ${merged.cardClass || 'UR'}`.trim()
    };
  }
  return merged;
};

const normalizeSaveData = (data = {}) => {
  const base = getDefaultSave(data.nickname || '');
  const normalizedCards = Array.isArray(data.cards)
    ? data.cards.filter(Boolean).map(c => upgradeImageCardBalance({ ...c, instanceId: c.instanceId || generateId() }))
    : [];
  const normalizedDeck = Array.isArray(data.deck)
    ? data.deck.filter(Boolean).map(c => upgradeImageCardBalance({ ...c, instanceId: c.instanceId || generateId() }))
    : [];
  return {
    ...base,
    ...data,
    crystals: typeof data.crystals === 'number' ? data.crystals : base.crystals,
    cards: normalizedCards,
    deck: normalizedDeck,
    pveStage: typeof data.pveStage === 'number' ? data.pveStage : 1,
    usedAdminCodes: (data.usedAdminCodes && typeof data.usedAdminCodes === 'object') ? data.usedAdminCodes : {},
    storyCleared: !!data.storyCleared,
    collectionRewards: data.collectionRewards || {},
    missionProgress: data.missionProgress || {},
    weeklyProgress: data.weeklyProgress || {},
    claimedMissions: data.claimedMissions || {},
    claimedWeekly: data.claimedWeekly || {},
    battlePass: data.battlePass || { xp: 0, claimed: {} },
    shop: data.shop || { date: '', bought: {} },
    pvpStats: data.pvpStats || { wins: 0, losses: 0, streak: 0, bestStreak: 0, history: [] },
    unlockedSkins: Array.isArray(data.unlockedSkins) ? data.unlockedSkins : [],
    selectedSkins: data.selectedSkins || {},
    settings: data.settings || { guideSeen: false },
    saveVersion: VERSION_LABEL
  };
};

const safeParseSave = (raw) => {
  try {
    if (!raw || raw === 'undefined') return null;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object' || !data.nickname) return null;
    return data;
  } catch (e) {
    return null;
  }
};

const getSaveScore = (data) => {
  const t = Number(data.updatedAt || 0);
  const cardScore = Array.isArray(data.cards) ? data.cards.length : 0;
  const deckScore = Array.isArray(data.deck) ? data.deck.length : 0;
  const crystalScore = typeof data.crystals === 'number' ? Math.min(data.crystals, 999999999) / 1000000000 : 0;
  return t * 1000000 + cardScore * 1000 + deckScore * 100 + crystalScore;
};

const readBestSaveData = () => {
  let best = null;
  let bestScore = -1;
  const stores = [];
  try { stores.push(localStorage); } catch(e) {}
  try { stores.push(sessionStorage); } catch(e) {}

  stores.forEach(store => {
    SAVE_READ_KEYS.forEach(key => {
      try {
        const parsed = safeParseSave(store.getItem(key));
        if (!parsed) return;
        const score = getSaveScore(parsed);
        if (score > bestScore) {
          best = parsed;
          bestScore = score;
        }
      } catch(e) {}
    });
  });

  return best ? normalizeSaveData(best) : null;
};

const writeSaveRedundantly = (data) => {
  if (!data?.nickname) return;
  const payload = JSON.stringify({
    ...normalizeSaveData(data),
    saveVersion: VERSION_LABEL,
    stableSaveSchema: 1,
    updatedAt: Date.now(),
    lastSavedAt: new Date().toISOString()
  });
  [...new Set(SAVE_READ_KEYS)].forEach(key => {
    try { localStorage.setItem(key, payload); } catch(e) {}
  });
  try { sessionStorage.setItem(SAVE_KEY, payload); } catch(e) {}
};

const adjustChancesForEvent = (pack) => {
  const today = getTodayPickup();
  const chances = { ...(pack.chances || {}) };
  if (today.weekend) {
    const add = 0.02;
    chances.UR = Math.min(0.25, (chances.UR || 0) + add);
    chances.N = Math.max(0.05, (chances.N || 0) - add);
  }
  return chances;
};

const getCardLevel = (card) => Math.min(10, 1 + Math.floor((card?.xp || 0) / 40));
const getCardLimit = (card) => 10 + ((card?.limitBreak || 0) * 5);
const getCardEvoStage = (card) => card?.evoStage || 0;
const getCardPower = (card) => (card?.power || 1) + Math.floor(getCardLevel(card) / 2) + getCardEvoStage(card) * 2;

const getCardMaxHp = (card) => {
  if (!card) return 0;
  if (card.isEnergyCard) return 70 + getCardLevel(card) * 5;
  const customBonus = card.id?.startsWith('custom-') ? 25 : 0;
  const base = 35 + (getCardPower(card) * 8);
  return base + customBonus + (RARITY_HP_BONUS[card.rarity] || 0) + getCardLevel(card) * 4 + getCardEvoStage(card) * 16;
};

const getDeckTotalHp = (cards) => {
  const total = (cards || []).reduce((sum, card) => sum + getCardMaxHp(card), 0);

};

};

const generateSeed = (str) => {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return Math.abs(h);
};

const seededPick = (arr, seed) => arr[seed % arr.length];

const generateRandomCard = (packId, forcedRarity = null) => {
  const pack = PACKS.find(p => p.id === packId) || PACKS[0];
  const chances = adjustChancesForEvent(pack);
  const rand = Math.random();
  let rarity = forcedRarity || 'N';
  if (!forcedRarity) {
    let cumulative = 0;
    for (const [r, chance] of Object.entries(chances)) {
      cumulative += chance;
      if (rand <= cumulative) { rarity = r; break; }
    }
  }

  let pool = CARD_CATALOG.filter(c => c.rarity === rarity);
  const todayPickup = getTodayPickup();
  const pickupElements = [...(pack.pickups || []), todayPickup.element].filter(Boolean);
  if (pickupElements.length) {
    const pickups = pool.filter(c => pickupElements.includes(c.element) || (c.isEnergyCard && pickupElements.includes('Energy')));
    pool = [...pool, ...pickups, ...pickups, ...pickups];
  }

  const energyCandidates = pool.filter(c => c.isEnergyCard);
  if (energyCandidates.length) {
    pool = [...pool, ...energyCandidates, ...energyCandidates];
  }

  let baseCard = pool[Math.floor(Math.random() * pool.length)] || CARD_CATALOG[0];
  if (baseCard?.isEnergyCard) {
    const variantDefs = ENERGY_VARIANT_DEFS.filter(v => pack.id === 'custom' ? true : v.theme !== 'prism');
    const variant = variantDefs[Math.floor(Math.random() * variantDefs.length)] || ENERGY_VARIANT_DEFS[0];
    baseCard = buildEnergyCard(variant, rarity);
  }

  return JSON.parse(JSON.stringify({ ...baseCard, instanceId: generateId(), xp: 0, limitBreak: 0, evoStage: 0, createdAt: Date.now() }));
};

const calculateDamage = (card1, card2) => {
  if (!card1 || !card2) return { p1: 0, p2: 0 };
  let p1Power = card1.power || 0;
  let p2Power = card2.power || 0;
  if (ELEMENTS[card1.element]?.strongAgainst === card2.element) p1Power += 3;
  if (ELEMENTS[card2.element]?.strongAgainst === card1.element) p2Power += 3;
  if (p1Power > p2Power) return { p1: 1, p2: 0 };
  if (p2Power > p1Power) return { p1: 0, p2: 1 };
  return { p1: 0, p2: 0 };
};

const copyToClipboard = (text) => {
  try {
    const el = document.createElement('textarea'); el.value = text;
    el.style.position = 'absolute'; el.style.left = '-9999px';
    document.body.appendChild(el); el.select();
    const res = document.execCommand('copy');
    document.body.removeChild(el); return res;
  } catch (e) { return false; }
};

          <div className="w-[88%] h-[70%] rounded-2xl bg-gradient-to-b from-white/20 to-black/20 border border-white/25 flex flex-col items-center justify-center shadow-[0_0_18px_rgba(255,255,255,0.18)] transform group-hover:scale-105 transition-transform duration-300 px-2">
            <span className="text-5xl md:text-6xl drop-shadow-[0_4px_10px_rgba(0,0,0,0.85)] leading-none">{getCardCharacterIcon(card)}</span>
            <span className="mt-2 text-[9px] md:text-[11px] font-black text-white/95 tracking-wide text-center">{card.isEnergyCard ? getEnergyThemeMeta(card).label : ELEMENTS[card.element]?.name}</span>
          </div>
        )}
        <div className="mt-1 w-6 h-6 md:w-7 md:h-7 text-white/90 drop-shadow-md flex items-center justify-center">{elem.icon}</div>
      </div>
      <div className="bg-gradient-to-t from-slate-950/90 to-slate-900/80 px-2 py-1.5 border-t border-slate-600/50 backdrop-blur-sm relative z-10 space-y-1">
        <div className="flex items-center justify-between">
          <div className="font-black text-[8px] md:text-[10px] text-slate-200 bg-black/60 px-1.5 py-0.5 rounded border border-slate-700 shadow-inner tracking-widest">{card.cardClass || card.rarity}</div>
          <div className="flex items-baseline gap-1 bg-red-900/40 px-2 py-0.5 rounded border border-red-500/30">
            <span className="text-[8px] md:text-[9px] text-red-300 font-black tracking-wider">ATK</span>
            <span className="font-black text-sm md:text-lg text-white drop-shadow-[0_0_5px_rgba(255,100,100,0.8)] leading-none">{getCardPower(card)}</span>
          </div>
        </div>
        <div className="flex items-center justify-between text-[8px] md:text-[9px] font-black bg-emerald-950/60 border border-emerald-500/30 rounded px-1.5 py-0.5">
          <span className="text-emerald-300">HP</span>
          <span className="text-white">{card.currentHp ?? getCardMaxHp(card)} / {getCardMaxHp(card)}</span>
        </div>
      </div>
    </div>
  );

  return (
    <div className={`card-container w-24 h-36 md:w-32 md:h-48 group ${className}`} onClick={onClick} style={style}>
      {isRevealed ? renderFront() : renderBack()}
    </div>
  );
};

const HpBar = ({ hp, maxHp }) => {
  const percent = Math.max(0, (hp / maxHp) * 100);
  let color = 'from-green-400 via-green-500 to-green-600';
  if (percent <= 50) color = 'from-yellow-400 via-yellow-500 to-yellow-600';
  if (percent <= 25) color = 'from-red-400 via-red-500 to-red-600';
  
  return (
    <div className="w-28 md:w-40 h-3.5 md:h-4 bg-slate-950 rounded-full overflow-hidden border border-slate-700 shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] relative flex items-center">
      <div className={`h-full bg-gradient-to-r ${color} transition-all duration-500 ease-out`} style={{ width: `${percent}%` }}></div>
      <div className="absolute inset-0 flex items-center justify-center text-[10px] md:text-[11px] font-black text-white drop-shadow-[0_1px_1px_rgba(0,0,0,1)] tracking-widest">
        {hp} / {maxHp}
      </div>
    </div>
  );
};

// ==========================================
// 5. Main Application Component
// ==========================================
function App() {
  const [user, setUser] = useState(null);
  const [gameState, setGameState] = useState('title');
  const [saveData, setSaveData] = useState(getDefaultSave(''));
  
  const [nicknameInput, setNicknameInput] = useState('');
  const [saveCodeInput, setSaveCodeInput] = useState('');
  const [roomCodeInput, setRoomCodeInput] = useState('');
  const [adminCodeInput, setAdminCodeInput] = useState('');
  const [notification, setNotification] = useState('');

  const [selectedPack, setSelectedPack] = useState(null);
  const [gachaCards, setGachaCards] = useState([]);
  const [gachaStep, setGachaStep] = useState('idle');
  const [revealedCount, setRevealedCount] = useState(0);
  const [gachaMeta, setGachaMeta] = useState(null);
  const [swipeX, setSwipeX] = useState(0);
  const swipeStartRef = useRef(null);

  const [deckBuilder, setDeckBuilder] = useState([]);
  const [storyIndex, setStoryIndex] = useState(0);
  const [difficulty, setDifficulty] = useState('NORMAL');
  const [detailCard, setDetailCard] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);

  const [battleData, setBattleData] = useState(null);
  const [matchId, setMatchId] = useState(null);
  const [battlePaused, setBattlePaused] = useState(false);

  useEffect(() => {
    const migratedSave = readBestSaveData();
    if (migratedSave?.nickname) {
      setSaveData(migratedSave);
      writeSaveRedundantly(migratedSave);
    }

    if (!auth) return;
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
        else await signInAnonymously(auth);
      } catch (e) {}
    };
    initAuth();
    const unsubscribe = onAuthStateChanged(auth, setUser);
    return () => unsubscribe();
  }, []);

  useEffect(() => {
    if (saveData?.nickname) {
      writeSaveRedundantly(saveData);
      if (user && db) {
        try {
          const sRef = doc(db, 'artifacts', appId, 'users', user.uid, 'saveDataV4');
          setDoc(sRef, JSON.parse(JSON.stringify(saveData))).catch(()=>{});
        } catch(e) {}
      }
    }
  }, [saveData, user]);

  const showNotification = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };

  useEffect(() => {
    if (!saveData?.nickname) return;
    const today = getLocalDateKey();
    const storedDate = readDailyBonusDate();
    const alreadyGot = saveData.lastDailyBonus === today || storedDate === today;
    if (alreadyGot) return;
    writeDailyBonusDate(today);
    setSaveData(p => {
      if (!p?.nickname || p.lastDailyBonus === today) return p;
      const yesterday = getLocalDateKey(-1);
      const streak = p.lastLoginDay === yesterday ? (p.loginStreak || 0) + 1 : 1;
      const sevenDay = streak >= 7;
      return {
        ...(p || {}),
        crystals: (p.crystals || 0) + DAILY_BONUS_AMOUNT + (streak >= 2 ? 200 : 0),
        packTickets: (p.packTickets || 0) + (streak === 3 ? 1 : 0),
        srTickets: (p.srTickets || 0) + (sevenDay ? 1 : 0),
        lastDailyBonus: today,
        lastLoginDay: today,
        loginStreak: sevenDay ? 0 : streak
      };
    });
    showNotification(`ログインボーナス 💎${DAILY_BONUS_AMOUNT}＋連続ボーナスを受け取りました！`);
  }, [saveData?.nickname]);

  const startGame = () => {
    if (!nicknameInput.trim() && !saveData?.nickname) return showNotification("ニックネームを入力してください");
    if (!saveData?.nickname) {
      const starterDeck = createStarterDeck();
      setSaveData(p => normalizeSaveData({ ...(p||{}), nickname: nicknameInput.trim(), cards: starterDeck, deck: starterDeck }));
    }
    setGameState('menu');
  };

  const generateSaveCode = () => {
    try {
      const code = btoa(encodeURIComponent(JSON.stringify(saveData || {})));
      copyToClipboard(code);
      showNotification("セーブコードをコピーしました！");
    } catch(e) { showNotification("生成失敗"); }
  };

  const loadSaveCode = () => {
    try {
      if (!saveCodeInput) return;
      const data = JSON.parse(decodeURIComponent(atob(saveCodeInput)));
      if (data && typeof data === 'object' && data.nickname) {
setSaveData(normalizeSaveData(data));
        showNotification("データを復元しました！");
        setGameState('menu');
      } else throw new Error("Invalid");
    } catch (e) { showNotification("無効なセーブコードです。"); }
  };


  const createAdminCards = (count, mode = 'ur') => {
    const cards = [];
    for (let i = 0; i < count; i++) {
      if (mode === 'energy') {
        const variant = ENERGY_VARIANT_DEFS[Math.floor(Math.random() * ENERGY_VARIANT_DEFS.length)] || ENERGY_VARIANT_DEFS[0];
        const rarityPool = ['N', 'R', 'SR', 'UR'];
        const rarity = rarityPool[Math.floor(Math.random() * rarityPool.length)] || 'N';
        cards.push({ ...buildEnergyCard(variant, rarity), instanceId: generateId(), xp: 0, limitBreak: 0, evoStage: 0, createdAt: Date.now() + i });
      } else {
        cards.push(generateRandomCard('legend', 'UR'));
      }
    }
    return cards;
  };

  const applyAdminCodeEffect = (prev, key) => {
    const current = normalizeSaveData(prev || {});
    const addOwnedCards = (newCards = []) => ({
      ...current,
      cards: [...(current.cards || []), ...newCards],
      deck: current.deck && current.deck.length ? current.deck : [...(current.deck || []), ...newCards].slice(0, 5)
    });
    switch (key) {
      case 'crystal_s': return { ...current, crystals: (current.crystals || 0) + 5000 };
      case 'crystal_l': return { ...current, crystals: (current.crystals || 0) + 50000 };
      case 'ticket_s': return { ...current, packTickets: (current.packTickets || 0) + 3 };
      case 'ticket_l': return { ...current, packTickets: (current.packTickets || 0) + 10 };
      case 'srticket': return { ...current, srTickets: (current.srTickets || 0) + 2 };
      case 'materials': return { ...current, materials: (current.materials || 0) + 250 };
      case 'ur_one': return addOwnedCards(createAdminCards(1, 'ur'));
      case 'ur_three': return addOwnedCards(createAdminCards(3, 'ur'));
      case 'energy_five': return addOwnedCards(createAdminCards(5, 'energy'));
      case 'deck_xp': return { ...current, deck: (current.deck || []).map(c => ({ ...c, xp: (c.xp || 0) + 120 })), cards: (current.cards || []).map(c => ({ ...c, xp: (c.xp || 0) + ((current.deck || []).some(d => d.instanceId === c.instanceId) ? 120 : 0) })) };
      case 'all_xp': return { ...current, cards: (current.cards || []).map(c => ({ ...c, xp: (c.xp || 0) + 60 })), deck: (current.deck || []).map(c => ({ ...c, xp: (c.xp || 0) + 60 })) };
      case 'unlock_map': return { ...current, pveStage: PVE_STAGES.length, storyCleared: true };
      case 'daily_clear': {
        const today = getLocalDateKey();
        const progress = { ...(current.missionProgress || {}) };
        progress[today] = {};
        (dailyMissionList || []).forEach(m => { progress[today][m.key] = m.target; });
        return { ...current, missionProgress: progress };
      }
      case 'pass_xp': return { ...current, battlePass: { ...(current.battlePass || { xp: 0, claimed: {} }), xp: (current.battlePass?.xp || 0) + 400 } };
      case 'admin_all': {
        const urs = createAdminCards(2, 'ur');
        const energies = createAdminCards(5, 'energy');
        return {
          ...current,
          crystals: (current.crystals || 0) + 200000,
          packTickets: (current.packTickets || 0) + 10,
          srTickets: (current.srTickets || 0) + 5,
          materials: (current.materials || 0) + 500,
          cards: [...(current.cards || []), ...urs, ...energies],
          deck: current.deck && current.deck.length ? current.deck : [...urs, ...energies].slice(0, 5),
          battlePass: { ...(current.battlePass || { xp: 0, claimed: {} }), xp: (current.battlePass?.xp || 0) + 400 }
        };
      }
      default: return current;
    }
  };

  const useAdminCode = () => {
    const code = (adminCodeInput || '').replace(/[^0-9]/g, '').slice(0, 7);
    if (code.length !== 7) return showNotification('管理者コードは7桁の数字です');
    const entry = ADMIN_CODE_LOOKUP[code];
    if (!entry) return showNotification('無効な管理者コードです');
    setSaveData(prev => normalizeSaveData(applyAdminCodeEffect(prev, entry.key)));
    setAdminCodeInput('');
    showNotification(`管理者コード発動：${entry.title}`);
  };

  // --- Deck logic ---
  const autoBuildDeck = () => {
    const sorted = [...(saveData?.cards||[])].sort((a,b) => getCardPower(b) - getCardPower(a));
    return JSON.parse(JSON.stringify(sorted.slice(0, 5)));
  };

  const ensureDeck = () => {
    if (Array.isArray(saveData?.deck) && saveData.deck.length === 5) {
      return JSON.parse(JSON.stringify(saveData.deck));
    }
    if (!saveData?.cards || saveData.cards.length < 5) {
      const starterDeck = createStarterDeck();
      setSaveData(p => ({ ...(p||{}), cards: starterDeck, deck: starterDeck }));
      showNotification("スターターデッキを配布しました！");
      return starterDeck;
    }
    const autoDeck = autoBuildDeck();
    setSaveData(p => ({ ...p, deck: autoDeck }));
    showNotification("デッキが不足していたため自動編成しました！");
    return autoDeck;
  };

  const saveDeck = () => {
    if (deckBuilder.length !== 5) return showNotification("デッキはちょうど5枚選んでください！");
    setSaveData(p => ({ ...p, deck: JSON.parse(JSON.stringify(deckBuilder)) }));
    showNotification("デッキを保存しました！");
    setGameState('menu');
  };

  const toggleDeckCard = (card) => {
    if (deckBuilder.find(c => c.instanceId === card.instanceId)) {
      setDeckBuilder(deckBuilder.filter(c => c.instanceId !== card.instanceId));
    } else {
      if (deckBuilder.length >= 5) return showNotification("デッキは5枚までです！");
      setDeckBuilder([...deckBuilder, card]);
    }
  };

  // --- Gacha / Pack Opening ---
  const openPackSelect = () => setGameState('packs');

  const consumePackCost = (pack) => {
    if ((saveData?.packTickets || 0) > 0) {
      setSaveData(p => ({ ...(p || {}), packTickets: Math.max(0, (p.packTickets || 0) - 1) }));
      return true;
    }
    if ((saveData?.crystals || 0) < pack.price) {
      showNotification("クリスタル不足です");
      return false;
    }
    setSaveData(p => ({ ...(p || {}), crystals: Math.max(0, (p.crystals || 0) - pack.price) }));
    return true;
  };

  const pullPack = (packId) => {
    const pack = PACKS.find(p => p.id === packId) || PACKS[0];
    if (!consumePackCost(pack)) return;

    const nextSR = (saveData?.pitySR || 0) + 1;
    const nextUR = (saveData?.pityUR || 0) + 1;
    let forced = null;
    let pityMessage = '';
    if (nextUR >= 100) { forced = 'UR'; pityMessage = '100パック天井：UR確定！'; }
    else if (nextSR >= 30) { forced = 'SR'; pityMessage = '30パック天井：SR以上確定！'; }

    const cards = [generateRandomCard(pack.id), generateRandomCard(pack.id), generateRandomCard(pack.id, forced)];
    const hasUR = cards.some(c => c.rarity === 'UR');
    const hasSR = cards.some(c => c.rarity === 'SR' || c.rarity === 'UR');
    const meta = { ...getPackAura(cards), pityMessage };

    setSaveData(p => ({
      ...(p || {}),
      pitySR: hasSR ? 0 : ((p?.pitySR || 0) + 1),
      pityUR: hasUR ? 0 : ((p?.pityUR || 0) + 1),
      battlePass: { ...(p?.battlePass || { xp: 0, claimed: {} }), xp: (p?.battlePass?.xp || 0) + 8 }
    }));
    trackMission('openPack', 1);
    setSelectedPack(pack);
    setGachaCards(cards.map(c => ({ ...c, revealed: false })));
    setGachaMeta(meta);
    setSwipeX(0);
    setGachaStep('ready');
    setRevealedCount(0);
    setGameState('gacha');
  };

  const openGachaPack = () => {
    if (gachaStep !== 'ready') return;
    setGachaStep('shaking');
    setTimeout(() => setGachaStep('opened'), gachaMeta?.className === 'pack-aura-ur' ? 1800 : 1000);
  };

  const handlePackTouchStart = (e) => {
    swipeStartRef.current = e.touches?.[0]?.clientX || 0;
    setSwipeX(0);
  };

  const handlePackTouchMove = (e) => {
    if (swipeStartRef.current == null) return;
    const x = e.touches?.[0]?.clientX || 0;
    setSwipeX(Math.max(-120, Math.min(120, x - swipeStartRef.current)));
  };

  const handlePackTouchEnd = () => {
    if (Math.abs(swipeX) > 70) openGachaPack();
    setSwipeX(0);
    swipeStartRef.current = null;
  };

  const revealCard = (index) => {
    if (gachaStep !== 'opened') return;
    const cards = [...(gachaCards || [])];
    if (cards[index] && !cards[index].revealed) {
      cards[index] = { ...cards[index], revealed: true };
      setGachaCards(cards);
      const newCount = revealedCount + 1;
      setRevealedCount(newCount);
      if (index === 2 && RARITY_RANK[cards[index].rarity] >= 3) showNotification('ラスト1枚の特別演出！');
      if (newCount >= 3) {
        setGachaStep('revealed');
        setSaveData(p => {
          const arr = [...(p?.cards || []), ...cards.map(c => { const n = { ...c }; delete n.revealed; return n; })];
          return { ...(p || {}), cards: arr };
        });
      }
    }
  };

  // --- Missions / Shop / Growth ---
  const trackMission = (key, amount = 1) => {
    const today = getLocalDateKey();
    const week = getWeekKey();
    setSaveData(p => ({
      ...(p || {}),
      missionProgress: { ...(p?.missionProgress || {}), [today]: { ...((p?.missionProgress || {})[today] || {}), [key]: (((p?.missionProgress || {})[today] || {})[key] || 0) + amount } },
      weeklyProgress: { ...(p?.weeklyProgress || {}), [week]: { ...((p?.weeklyProgress || {})[week] || {}), [key]: (((p?.weeklyProgress || {})[week] || {})[key] || 0) + amount } }
    }));
  };

  const dailyMissionList = [
    { key: 'openPack', name: 'パックを1回開ける', target: 1, reward: 150 },
    { key: 'pveWin', name: 'PvEで1勝する', target: 1, reward: 200 },
    { key: 'elementAttack', name: '属性攻撃を3回使う', target: 3, reward: 150 },
    { key: 'pvpPlay', name: 'オンライン対戦を1回遊ぶ', target: 1, reward: 300 }
  ];

  const weeklyMissionList = [
    { key: 'openPack', name: 'パックを10回開ける', target: 10, reward: 900 },
    { key: 'pveWin', name: 'PvEで7勝する', target: 7, reward: 1200 },
    { key: 'elementAttack', name: '攻撃を30回使う', target: 30, reward: 1000 }
  ];

  const claimMission = (m, weekly = false) => {
    const keyDate = weekly ? getWeekKey() : getLocalDateKey();
    const claimKey = `${weekly ? 'w' : 'd'}-${keyDate}-${m.key}`;
    const progress = weekly ? (saveData.weeklyProgress?.[keyDate]?.[m.key] || 0) : (saveData.missionProgress?.[keyDate]?.[m.key] || 0);
    if (progress < m.target) return showNotification('まだ達成していません');
    if (saveData.claimedMissions?.[claimKey]) return showNotification('受け取り済みです');
    setSaveData(p => ({
      ...(p || {}),
      crystals: (p?.crystals || 0) + m.reward,
      claimedMissions: { ...(p?.claimedMissions || {}), [claimKey]: true },
      battlePass: { ...(p?.battlePass || { xp: 0, claimed: {} }), xp: (p?.battlePass?.xp || 0) + (weekly ? 40 : 15) }
    }));
    showNotification(`報酬 💎${m.reward} を受け取りました！`);
  };

  const getDailyShopItems = () => {
    const today = getLocalDateKey();
    const seed = generateSeed(today);
    const pickup = getTodayPickup();
    const rareCard = seededPick(CARD_CATALOG.filter(c => c.element === pickup.element && ['R','SR'].includes(c.rarity)), seed + 3) || CARD_CATALOG[0];
    return [
      { id: `mat-${today}`, name: '強化素材 ×30', price: 350, type: 'materials', amount: 30, icon: '🔧' },
      { id: `ticket-${today}`, name: 'パックチケット', price: 600, type: 'ticket', amount: 1, icon: '🎟️' },
      { id: `skin-${today}`, name: '限定ホロスキン', price: 1500, type: 'skin', value: 'holo', icon: '🌈' },
      { id: `card-${today}`, name: `${rareCard.name}`, price: rareCard.rarity === 'SR' ? 2200 : 1200, type: 'card', card: rareCard, icon: '🃏' },
      { id: `sr-${today}`, name: 'SR以上チケット', price: 3000, type: 'srTicket', amount: 1, icon: '👑' }
    ];
  };

  const buyShopItem = (item) => {
    if (saveData.shop?.bought?.[item.id]) return showNotification('売り切れです');
    if ((saveData.crystals || 0) < item.price) return showNotification('ダイヤが足りません');
    setSaveData(p => {
      const next = { ...(p || {}), crystals: (p?.crystals || 0) - item.price, shop: { ...(p?.shop || {}), date: getLocalDateKey(), bought: { ...(p?.shop?.bought || {}), [item.id]: true } } };
      if (item.type === 'materials') next.materials = (next.materials || 0) + item.amount;
      if (item.type === 'ticket') next.packTickets = (next.packTickets || 0) + item.amount;
      if (item.type === 'srTicket') next.srTickets = (next.srTickets || 0) + item.amount;
      if (item.type === 'skin') next.unlockedSkins = Array.from(new Set([...(next.unlockedSkins || []), item.value]));
      if (item.type === 'card') next.cards = [...(next.cards || []), { ...item.card, instanceId: generateId(), xp: 0, limitBreak: 0, evoStage: 0 }];
      return next;
    });
    showNotification(`${item.name}を購入しました！`);
  };

  const claimBattlePass = (level) => {
    const xp = saveData.battlePass?.xp || 0;
    const need = level * 50;
    if (xp < need) return showNotification('バトルパスXPが足りません');
    if (saveData.battlePass?.claimed?.[level]) return showNotification('受け取り済みです');
    setSaveData(p => ({
      ...(p || {}),
      crystals: (p?.crystals || 0) + level * 120,
      packTickets: (p?.packTickets || 0) + (level % 3 === 0 ? 1 : 0),
      battlePass: { ...(p?.battlePass || { xp: 0, claimed: {} }), claimed: { ...(p?.battlePass?.claimed || {}), [level]: true } }
    }));
    showNotification(`バトルパスLv.${level}報酬を受け取りました！`);
  };

  const getUniqueIds = () => Array.from(new Set((saveData.cards || []).map(c => c.id)));
  const claimCollectionReward = (key, reward) => {
    if (saveData.collectionRewards?.[key]) return showNotification('受け取り済みです');
    setSaveData(p => ({ ...(p || {}), crystals: (p?.crystals || 0) + reward, collectionRewards: { ...(p?.collectionRewards || {}), [key]: true } }));
    showNotification(`図鑑報酬 💎${reward} を受け取りました！`);
  };

  const mergeSelectedCard = (card) => {
    if (!card) return showNotification('カードが選択されていません');
    let resultMessage = '';
    let mergedCard = null;
    setSaveData(prev => {
      const current = normalizeSaveData(prev || saveData || {});
      const cards = [...(current.cards || [])];
      const targetIndex = cards.findIndex(c => c.instanceId === card.instanceId);
      if (targetIndex < 0) {
        resultMessage = 'このカードが見つかりませんでした';
        return current;
      }

      const duplicateIndex = cards.findIndex((c, i) => i !== targetIndex && c.id === card.id);
      const canUseMaterial = (current.materials || 0) >= 40;
      if (duplicateIndex < 0 && !canUseMaterial) {
        resultMessage = '同じカード1枚、または強化素材40個で合成できます';
        return current;
      }

      const target = cards[targetIndex];
      const duplicate = duplicateIndex >= 0 ? cards[duplicateIndex] : null;
      const gainedXp = 140 + (duplicate ? Math.floor((duplicate.xp || 0) / 2) : 0);
      const nextTarget = {
        ...target,
        xp: (target.xp || 0) + gainedXp,
        limitBreak: (target.limitBreak || 0) + 1,
        power: Math.max(target.power || 1, (target.power || 1) + (duplicate ? 1 : 0))
      };

      let nextCards = cards.map((c, i) => i === targetIndex ? nextTarget : c);
      if (duplicateIndex >= 0) nextCards = nextCards.filter((_, i) => i !== duplicateIndex);
      const nextDeck = (current.deck || []).map(c => c.instanceId === target.instanceId ? nextTarget : c).filter(c => c.instanceId !== duplicate?.instanceId);
      mergedCard = nextTarget;
      resultMessage = duplicate ? '合成成功！同じカードを素材にして強化しました' : '素材合成成功！強化素材40個で強化しました';
      return {
        ...current,
        cards: nextCards,
        deck: nextDeck,
        materials: Math.max(0, (current.materials || 0) - (duplicate ? 0 : 40)) + (duplicate ? 10 : 0)
      };
    });
    setTimeout(() => {
      if (mergedCard) setDetailCard(mergedCard);
      showNotification(resultMessage || '合成しました');
    }, 0);
  };

  const evolveSelectedCard = (card) => {
    if (!card) return showNotification('カードが選択されていません');
    let resultMessage = '';
    let evolvedCard = null;
    setSaveData(prev => {
      const current = normalizeSaveData(prev || saveData || {});
      const cards = [...(current.cards || [])];
      const targetIndex = cards.findIndex(c => c.instanceId === card.instanceId);
      if (targetIndex < 0) {
        resultMessage = 'このカードが見つかりませんでした';
        return current;
      }

      const target = cards[targetIndex];
      const nextId = EVOLUTION_LINES[target.id];
      const nextBase = CARD_CATALOG.find(c => c.id === nextId);
      const materialCost = Math.min(20, current.materials || 0);

      if (nextBase) {
        evolvedCard = {
          ...nextBase,
          instanceId: target.instanceId,
          xp: Math.max(0, (target.xp || 0) + 40),
          limitBreak: target.limitBreak || 0,
          evoStage: (target.evoStage || 0) + 1,
          skin: target.skin,
          createdAt: target.createdAt || Date.now()
        };
        resultMessage = `${nextBase.name}に進化しました！`;
      } else {
        const rarityOrder = ['N', 'R', 'SR', 'UR'];
        const currentRank = Math.max(0, rarityOrder.indexOf(target.rarity));
        const nextRarity = rarityOrder[Math.min(rarityOrder.length - 1, currentRank + 1)] || target.rarity || 'UR';
        evolvedCard = {
          ...target,
          rarity: nextRarity,
          xp: (target.xp || 0) + 80,
          power: (target.power || 1) + 2,
          limitBreak: (target.limitBreak || 0) + 1,
          evoStage: (target.evoStage || 0) + 1,
          cardClass: target.cardClass && String(target.cardClass).includes('EVOLVE') ? target.cardClass : `${target.cardClass || target.rarity || 'CARD'} EVOLVE`.trim()
        };
        resultMessage = `${target.name}を覚醒進化しました！`;
      }

      const nextCards = cards.map((c, i) => i === targetIndex ? evolvedCard : c);
      const nextDeck = (current.deck || []).map(c => c.instanceId === target.instanceId ? evolvedCard : c);
      return {
        ...current,
        materials: Math.max(0, (current.materials || 0) - materialCost),
        cards: nextCards,
        deck: nextDeck
      };
    });
    setTimeout(() => {
      if (evolvedCard) setDetailCard(evolvedCard);
      showNotification(resultMessage || '進化しました');
    }, 0);
  };

  const applySkinToCard = (card, skin) => {
    if (!card) return;
    setSaveData(p => ({
      ...(p || {}),
      cards: (p.cards || []).map(c => c.instanceId === card.instanceId ? { ...c, skin } : c),
      deck: (p.deck || []).map(c => c.instanceId === card.instanceId ? { ...c, skin } : c)
    }));
    showNotification('スキンを変更しました');
    setDetailCard(null);
  };

  // --- PvE ---
  const startStoryOrBattle = () => {
    const deckToUse = ensureDeck();
    if (!deckToUse) return;
    const stageId = saveData?.pveStage || 1;
    const stage = PVE_STAGES.find(s => s.id === stageId) || PVE_STAGES[PVE_STAGES.length-1];
    
    if (!saveData.storyCleared && stageId === stage.id && stage.texts) {
      setStoryIndex(0);
      setBattleData({ stage, playerDeck: deckToUse });
      setGameState('story');
    } else {
      initPvEBattle(stage, deckToUse);
    }
  };

  const nextStory = () => {
    const stage = battleData.stage;
    if (storyIndex < stage.texts.length - 1) {
      setStoryIndex(storyIndex + 1);
    } else {
      initPvEBattle(stage, battleData.playerDeck);
    }
  };

  const initPvEBattle = (stage, deckToUse, diffName = difficulty) => {
    setBattlePaused(false);
    const hand = JSON.parse(JSON.stringify(deckToUse)).map(card => ({ ...card, currentHp: getCardMaxHp(card) }));
    const enemy = createPvEEnemyCard(stage);
    const diff = DIFFICULTIES[diffName] || DIFFICULTIES.NORMAL;
    const enemyMaxHp = Math.floor((getCardMaxHp(enemy) + (stage.id * 12)) * diff.enemy);
    setBattleData({
      type: 'pve', stage, difficulty: diffName, playerDeck: JSON.parse(JSON.stringify(deckToUse)), playerHand: hand,
      playerHp: 0, playerMaxHp: getDeckTotalHp(hand),
      enemyHp: enemyMaxHp, enemyMaxHp,
      playerActive: null, selectedHandIndex: null, enemyActive: { ...enemy, currentHp: enemyMaxHp },
      energy: { player: getBattleStartEnergy(deckToUse || saveData.deck || []), enemy: 2, max: getBattleEnergyMax(deckToUse || saveData.deck || []) },
      animating: false, effect: null, finished: false, won: false,
      turnCount: 1, ultimateGauge: 0, playerStatus: {}, enemyStatus: {}, defendNext: false, lastActionText: 'カードを選んでフィールドに出そう！エネルギーを使って攻撃できます。'
    });
    setGameState('pve');
  };

  const escapePvE = () => {
    setBattlePaused(false);
    setGameState('menu');
    setBattleData(null);
  };

  const selectPvECard = (idx) => {
    if (battlePaused || battleData?.animating || battleData?.finished || battleData?.playerActive) return;
    const hand = [...(battleData?.playerHand || [])];
    const card = hand[idx];
    if (!card) return;
    const maxHp = getCardMaxHp(card);
    setBattleData(p => ({
      ...p,
      selectedHandIndex: idx,
      playerActive: { ...card, currentHp: card.currentHp ?? maxHp },
      playerHp: card.currentHp ?? maxHp,
      playerMaxHp: maxHp,
      effect: null,
      lastActionText: `${card.name}をフィールドに出した！攻撃を選ぼう。`
    }));
  };

  const usePvEAttack = (attackIndex) => {
    if (battlePaused || battleData?.animating || battleData?.finished || !battleData?.playerActive) return;
    const pCard = { ...(battleData.playerActive || {}) };
    const eCard = { ...(battleData.enemyActive || createPvEEnemyCard(battleData.stage)) };
    const attacks = getCardAttacks(pCard);
    const isUltimate = attackIndex === 99;
    const attack = isUltimate ? getUltimateAttack(pCard) : (attacks[attackIndex] || attacks[0]);
    if (isUltimate && (battleData.ultimateGauge || 0) < 100) return showNotification('必殺ゲージが足りません');
    if (!attack) return;
    const energyCost = getAttackEnergyCost(attack, isUltimate);
    const currentEnergy = battleData.energy?.player ?? 0;
    if (currentEnergy < energyCost) return showNotification(`エネルギー不足：必要${energyCost} / 現在${currentEnergy}`);
    const energySupport = getEnergySupport(battleData?.playerDeck || saveData.deck || []);

    trackMission('elementAttack', 1);
    const enemyAttacks = getCardAttacks(eCard);
    const enemyFrozen = (battleData.enemyStatus?.freeze || 0) > 0;
    const enemyAttack = enemyFrozen ? { name: '凍結中', damage: 0 } : (enemyAttacks[Math.floor(Math.random() * enemyAttacks.length)] || { name: '反撃', damage: 6 });
    const critical = attack.charge && Math.random() < Math.min(0.45, 0.22 + (energySupport.critBonus || 0));
    const evaded = Math.random() < Math.min(0.18, 0.04 + getCardLevel(pCard) * 0.01);
    let enemyDamage = Math.max(1, attack.damage + getElementBonusDamage(pCard, eCard) + (energySupport.attackBonus || 0));
    if (critical) enemyDamage *= 2;
    let playerDamage = evaded ? 0 : Math.max(0, Math.floor(enemyAttack.damage * 0.65) + getElementBonusDamage(eCard, pCard));
    if (battleData.playerStatus?.barrier) playerDamage = Math.floor(playerDamage / 2);
    playerDamage = Math.max(0, playerDamage - (energySupport.damageReduction || 0));

    setBattleData(p => ({
      ...p,
      animating: true,
      effect: null,
      lastActionText: `${pCard.name}の「${attack.name}」！ ENERGY -${energyCost} ${getEffectText(pCard, eCard)} ${critical ? 'クリティカル！' : ''} ${evaded ? '回避成功！' : ''}`
    }));

    setTimeout(() => {
      setBattleData(p => ({
        ...p,
        effect: { enemyDamage, playerDamage, attackName: attack.name, enemyAttackName: enemyAttack.name, critical, evaded, effectType: getAttackEffectType(pCard, attack), element: pCard.element }
      }));

      setTimeout(() => {
        setBattleData(p => {
          const hand = [...(p.playerHand || [])];
          const selectedIndex = typeof p.selectedHandIndex === 'number' ? p.selectedHandIndex : 0;
          let nextEnemyStatus = { ...(p.enemyStatus || {}) };
          let nextPlayerStatus = { ...(p.playerStatus || {}) };
          if (attack.status === 'burn') nextEnemyStatus.burn = 3 + Math.min(1, energySupport.byTheme?.Fire || 0);
          if (attack.status === 'poison') nextEnemyStatus.poison = 3 + Math.min(1, energySupport.byTheme?.Dark || 0);
          if (attack.status === 'freeze') nextEnemyStatus.freeze = 1;
          if (attack.status === 'barrier') nextPlayerStatus.barrier = 1 + Math.min(1, energySupport.barrierBonus || 0);
          if (attack.status === 'heal') nextPlayerStatus.heal = 1 + Math.min(1, energySupport.byTheme?.Light || 0);
          if (attack.status === 'revive') nextPlayerStatus.revive = 1;
          if (isUltimate && pCard.element === 'Water') nextPlayerStatus.heal = 2;
          if (isUltimate && pCard.element === 'Wood') nextPlayerStatus.barrier = 2;
          if (isUltimate && pCard.element === 'Light') nextPlayerStatus.revive = 1;
          if (isUltimate && pCard.element === 'Dark') nextEnemyStatus.poison = 4;
          if (isUltimate && pCard.element === 'Fire') nextEnemyStatus.burn = 4;

          const burnPoisonDamage = (nextEnemyStatus.burn ? 5 + (energySupport.statusBonus || 0) : 0) + (nextEnemyStatus.poison ? 4 + (energySupport.statusBonus || 0) : 0);
          const healAmount = (nextPlayerStatus.heal ? 10 : 0) + (energySupport.healBonus || 0);
          const nextEnemyHp = Math.max(0, (p.enemyHp || 0) - enemyDamage - burnPoisonDamage);
          let nextPlayerHp = Math.max(0, Math.min(p.playerMaxHp || getCardMaxHp(pCard), (p.playerHp || 0) - playerDamage + healAmount));
          let nextPlayerActive = p.playerActive ? { ...p.playerActive, currentHp: nextPlayerHp } : null;
          if (nextPlayerHp <= 0 && nextPlayerStatus.revive) {
            nextPlayerHp = Math.max(1, Math.floor((p.playerMaxHp || getCardMaxHp(pCard)) * 0.25));
            nextPlayerStatus.revive = 0;
            nextPlayerActive = { ...p.playerActive, currentHp: nextPlayerHp };
          }
          if (hand[selectedIndex]) hand[selectedIndex] = { ...hand[selectedIndex], currentHp: nextPlayerHp };

          nextEnemyStatus = Object.fromEntries(Object.entries(nextEnemyStatus).map(([k,v]) => [k, Math.max(0, (v || 0) - 1)]).filter(([,v]) => v > 0));
          nextPlayerStatus = Object.fromEntries(Object.entries(nextPlayerStatus).map(([k,v]) => [k, Math.max(0, (v || 0) - 1)]).filter(([,v]) => v > 0));

          const enemyDefeated = nextEnemyHp <= 0;
          const playerCardDefeated = nextPlayerHp <= 0;
          let nextHand = hand;
          let finished = false;
          let won = false;
          let message = `敵に${enemyDamage}${burnPoisonDamage ? `+${burnPoisonDamage}` : ''} / 自分に${playerDamage}${healAmount ? ` / 回復${healAmount}` : ''}`;
          let nextGauge = isUltimate ? 0 : Math.min(100, (p.ultimateGauge || 0) + (attack.gauge || 20) + (energySupport.gaugeBonus || 0));
          const activeDeckCards = p.playerDeck || saveData.deck || [];
          const energyMax = p.energy?.max || getBattleEnergyMax(activeDeckCards);
          const baseEnergyAfterCost = Math.max(0, (p.energy?.player || 0) - energyCost);
          const bonusEnergy = attack.status === 'energyBoost' ? 2 + (energySupport.turnBonus || 0) : (energySupport.turnBonus || 0);
          const nextEnergy = {
            ...(p.energy || { player: 0, enemy: 0, max: energyMax }),
            max: energyMax,
            player: Math.min(energyMax, baseEnergyAfterCost + getTurnEnergyGain(activeDeckCards, pCard) + bonusEnergy),
            enemy: Math.min(energyMax, (p.energy?.enemy || 0) + 1)
          };

          if (enemyDefeated) {
            finished = true;
            won = true;
            message = `${attack.name}で勝利！`;
            const diff = DIFFICULTIES[p.difficulty] || DIFFICULTIES.NORMAL;
            const nextStage = (p.stage?.id || 1) + 1;
            const isCleared = nextStage > PVE_STAGES.length;
            const reward = Math.floor((p.stage?.reward || 100) * diff.reward);
            setSaveData(prev => ({
              ...(prev || {}),
              crystals: (prev?.crystals || 0) + reward,
              materials: (prev?.materials || 0) + (p.difficulty === 'LEGEND' ? 15 : p.difficulty === 'HARD' ? 8 : 4),
              pveStage: isCleared ? prev.pveStage : Math.max(prev.pveStage || 1, nextStage),
              storyCleared: prev.storyCleared || isCleared,
              cards: (prev.cards || []).map(c => c.instanceId === pCard.instanceId ? { ...c, xp: (c.xp || 0) + 25 } : c),
              deck: (prev.deck || []).map(c => c.instanceId === pCard.instanceId ? { ...c, xp: (c.xp || 0) + 25 } : c),
              battlePass: { ...(prev.battlePass || { xp: 0, claimed: {} }), xp: (prev.battlePass?.xp || 0) + 20 }
            }));
            trackMission('pveWin', 1);
          } else if (playerCardDefeated) {
            nextHand = hand.filter((_, i) => i !== selectedIndex);
            nextPlayerActive = null;
            if (nextHand.length === 0) {
              finished = true;
              won = false;
              message = '全カードが倒された…';
            } else {
              message = `${pCard.name}は倒れた。ベンチから次のカードを選ぼう！`;
            }
          }

          return {
            ...p,
            playerHand: nextHand,
            enemyHp: nextEnemyHp,
            enemyActive: { ...(p.enemyActive || eCard), currentHp: nextEnemyHp },
            playerHp: nextPlayerActive ? nextPlayerHp : 0,
            playerActive: nextPlayerActive,
            selectedHandIndex: nextPlayerActive ? selectedIndex : null,
            enemyStatus: nextEnemyStatus,
            playerStatus: nextPlayerStatus,
            energy: nextEnergy,
            ultimateGauge: nextGauge,
            animating: false,
            effect: null,
            finished,
            won,
            turnCount: (p.turnCount || 1) + 1,
            lastActionText: message
          };
        });
      }, 950);
    }, 450);
  };

  const switchActiveCard = () => {
    if (battlePaused || !battleData?.playerActive || battleData?.animating || battleData?.finished) return;
    setBattleData(p => ({ ...p, playerActive: null, playerHp: 0, selectedHandIndex: null, lastActionText: '交代します。ベンチからカードを選んでください。' }));
  };

  const defendPvE = () => {
    if (battlePaused || !battleData?.playerActive || battleData?.animating || battleData?.finished) return;
    setBattleData(p => ({ ...p, playerStatus: { ...(p.playerStatus || {}), barrier: 1 }, energy: { ...(p.energy || {player:0,max:5}), player: Math.min(p.energy?.max || 5, (p.energy?.player || 0) + 1) }, lastActionText: '防御！次のダメージを半分にして、エネルギーを1回復。' }));
  };

  const startSpecificStage = (stage, diffName = difficulty) => {
    const deckToUse = ensureDeck();
    if (!deckToUse) return;
    setDifficulty(diffName);
    initPvEBattle(stage, deckToUse, diffName);
  };

  const startDailyDungeon = () => {
    const today = getLocalDateKey();
    if (saveData.dailyDungeonDate === today) return showNotification('デイリーダンジョンは今日はクリア済みです');
    const pickup = getTodayPickup();
    const stage = { id: 6, name: `デイリー${ELEMENTS[pickup.element].name}ダンジョン`, hp: 26, deckPower: 11, reward: 900, texts: [`今日は${pickup.label}`, '1日1回だけ挑戦できる特別ステージ！'] };
    setSaveData(p => ({ ...(p || {}), dailyDungeonDate: today }));
    startSpecificStage(stage, 'HARD');
  };

  // --- PvP ---
  const startPvPMatchmaking = async () => {
    if (!user || !db) return showNotification("通信エラー");
    if (roomCodeInput.length !== 3) return showNotification("3桁入力必須");
    
    const deckToUse = ensureDeck();
    if (!deckToUse) return;

    setGameState('pvp_match');
    trackMission('pvpPlay', 1);
    const mRef = collection(db, 'artifacts', appId, 'public', 'data', 'matches');
    try {
      const snap = await getDocs(mRef);
      const now = Date.now();
      let fMatch = null;
      snap.forEach(d => {
        const dd = d.data();
        if (dd.code === roomCodeInput && dd.status === 'waiting' && (now - dd.timestamp < 15000)) fMatch = { id: d.id, ...dd };
      });

      const pDeck = JSON.parse(JSON.stringify(deckToUse));
      const pData = { uid: user.uid, name: saveData?.nickname || 'ゲスト', deck: pDeck };

      if (fMatch) {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', fMatch.id), { player2: pData, status: 'playing' });
        setMatchId(fMatch.id); listenToMatch(fMatch.id, 2);
      } else {
        const nRef = doc(mRef);
        await setDoc(nRef, { code: roomCodeInput, status: 'waiting', timestamp: now, player1: pData, p1Hp: INITIAL_PLAYER_HP, p2Hp: INITIAL_PLAYER_HP, turns: {}, currentTurn: 1 });
        setMatchId(nRef.id); listenToMatch(nRef.id, 1);
      }
    } catch (e) { showNotification("エラー発生"); setGameState('menu'); }
  };

  const listenToMatch = (mId, pNum) => {
    if (!db) return;
    const unsub = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId), (d) => {
      if (!d.exists()) return;
      const data = d.data();
      if (data.status === 'playing' || data.status === 'finished') {
        setGameState('pvp_battle');
        setBattleData({ ...data, myPlayerNum: pNum, myDeck: pNum === 1 ? data.player1?.deck : data.player2?.deck, enemyData: pNum === 1 ? data.player2 : data.player1, animating: false });
      }
    });
    if (pNum === 1) setTimeout(() => { getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId)).then(s => { if(s.exists() && s.data()?.status === 'waiting') { deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', mId)); showNotification("タイムアウト"); setGameState('menu'); setMatchId(null); unsub(); } }) }, 15000);
  };

  const playPvPTurn = async (idx) => {
    if (!matchId || !db || !battleData || battleData.finished) return;
    const mCard = battleData?.myDeck?.[idx];
    if (!mCard) return;
    const tData = battleData?.turns?.[`turn${battleData.currentTurn}`] || {};
    if (tData[`p${battleData.myPlayerNum}Card`]) return; // 既に出している場合は無効

    try {
      // ローカルのUIから手札を消す
      const nDeck = [...(battleData.myDeck || [])];
      nDeck.splice(idx, 1);
      setBattleData(p => ({ ...(p||{}), myDeck: nDeck }));

      // Firestoreを更新
      const isO = !!tData[`p${battleData.myPlayerNum===1?2:1}Card`];
      const cCard = JSON.parse(JSON.stringify(mCard));
      
      let upd = { 
        [`turns.turn${battleData.currentTurn}.p${battleData.myPlayerNum}Card`]: cCard,
        [`player${battleData.myPlayerNum}.deck`]: nDeck
      };

      if (isO) {
        const oCard = tData[`p${battleData.myPlayerNum===1?2:1}Card`];
        const p1C = battleData.myPlayerNum===1 ? cCard : oCard;
        const p2C = battleData.myPlayerNum===2 ? cCard : oCard;
        const { p1, p2 } = calculateDamage(p1C, p2C);
        
        const nP1Hp = (battleData.p1Hp||0) - p2; 
        const nP2Hp = (battleData.p2Hp||0) - p1;
        
        upd.p1Hp = nP1Hp; upd.p2Hp = nP2Hp;
        upd[`turns.turn${battleData.currentTurn}.result`] = { p1, p2 };
        if (nP1Hp <= 0 || nP2Hp <= 0 || (battleData.currentTurn||1) >= 5) upd.status = 'finished';
        else upd.currentTurn = (battleData.currentTurn||1) + 1;
      }
      await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', matchId), upd);
    } catch (e) { console.warn(e); }
  };

  const surrenderPvP = async () => {
    if (matchId && db && battleData && !battleData.finished) {
      try {
        let upd = { status: 'finished' };
        upd[`p${battleData.myPlayerNum}Hp`] = 0; // 自殺して相手の勝利にする
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', matchId), upd);
      } catch(e){}
    }
    setGameState('menu');
    setBattleData(null);
    setMatchId(null);
  };

  const leavePvP = async () => {
    if (matchId && db) {
      try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'matches', matchId)); } catch(e) {}
    }
    setGameState('menu');
    setBattleData(null);
    setMatchId(null);
  };

  const resetAllData = () => {
    clearAllSaveKeys();
    setSaveData(getDefaultSave(''));
    setConfirmReset(false);
    setGameState('title');
    showNotification('データをリセットしました');
  };

  const finishBattleAndReturn = () => {
    setBattlePaused(false);
    if (gameState === 'pvp_battle' && battleData?.finished) {
      const draw = battleData.p1Hp === battleData.p2Hp;
      const won = !draw && (battleData.myPlayerNum === 1 ? (battleData.p2Hp <= 0 || battleData.p1Hp > battleData.p2Hp) : (battleData.p1Hp <= 0 || battleData.p2Hp > battleData.p1Hp));
      const usedCard = (battleData?.turns?.turn1?.[`p${battleData.myPlayerNum}Card`]?.name) || (battleData?.myDeck?.[0]?.name) || '不明';
      setSaveData(p => {
        const stats = p?.pvpStats || { wins: 0, losses: 0, streak: 0, bestStreak: 0, history: [] };
        const nextStreak = won ? (stats.streak || 0) + 1 : 0;
        return {
          ...(p || {}),
          crystals: (p?.crystals || 0) + (won ? 300 + nextStreak * 50 : draw ? 100 : 50),
          pvpStats: {
            wins: (stats.wins || 0) + (won ? 1 : 0),
            losses: (stats.losses || 0) + (!won && !draw ? 1 : 0),
            streak: nextStreak,
            bestStreak: Math.max(stats.bestStreak || 0, nextStreak),
            history: [...(stats.history || []), { result: draw ? 'DRAW' : won ? 'WIN' : 'LOSE', date: getLocalDateKey(), card: usedCard }].slice(-30)
          },
          battlePass: { ...(p?.battlePass || { xp: 0, claimed: {} }), xp: (p?.battlePass?.xp || 0) + (won ? 30 : 12) }
        };
      });
      showNotification(won ? 'オンライン勝利報酬を受け取りました！' : '対戦報酬を受け取りました！');
    }

      {detailCard && (
        <div className="fixed inset-0 z-[80] bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setDetailCard(null)}>
          <div className="max-w-3xl w-full bg-slate-900 border-2 border-indigo-500 rounded-3xl p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-start gap-4 mb-5">
              <div>
                <h2 className="text-3xl font-black">{detailCard.name}</h2>
                <div className="text-slate-400 font-bold">{ELEMENTS[detailCard.element]?.name} / {detailCard.rarity} / Lv.{getCardLevel(detailCard)} / HP {getCardMaxHp(detailCard)}</div>
              </div>
              <button onClick={() => setDetailCard(null)} className="px-4 py-2 bg-slate-700 rounded-xl font-black">閉じる</button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-6">
              <div className="flex justify-center"><CardUI card={detailCard} isRevealed={true} /></div>
              <div className="space-y-4">
                <div className="bg-slate-950/70 border border-slate-700 rounded-2xl p-3 text-xs font-black text-slate-300 grid grid-cols-2 gap-2">
                  <div>同カード素材：{(saveData.cards || []).filter(c => c.id === detailCard.id && c.instanceId !== detailCard.instanceId).length}枚</div>
                  <div>強化素材：{saveData.materials || 0}個</div>
                </div>
                <div className="bg-slate-950/70 border border-slate-700 rounded-2xl p-4">
                  <h3 className="font-black mb-2">技</h3>
                  {getCardAttacks(detailCard).map(a => <div key={a.id} className="text-sm border-b border-slate-800 py-2"><b>{a.name}</b>：DMG {a.damage} / {a.desc}</div>)}
                  <div className="text-sm py-2"><b>{getUltimateAttack(detailCard).name}</b>：DMG {getUltimateAttack(detailCard).damage} / 必殺技</div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <button onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); mergeSelectedCard(detailCard); }} className="bg-blue-700 hover:bg-blue-600 rounded-xl p-3 font-black transition-colors">合成する</button>
                  <button onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); evolveSelectedCard(detailCard); }} className="bg-green-700 hover:bg-green-600 rounded-xl p-3 font-black transition-colors">進化する</button>
                  <button onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); applySkinToCard(detailCard, ''); }} className="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 font-black transition-colors">通常スキン</button>
                </div>
                {!!(saveData.unlockedSkins || []).length && <div className="grid grid-cols-2 gap-3">{saveData.unlockedSkins.map(sk => <button key={sk} onClick={() => applySkinToCard(detailCard, sk)} className="bg-purple-700 rounded-xl p-3 font-black">{sk}スキン</button>)}</div>}
                <div className="text-xs text-slate-400">合成：同じカード1枚、または素材40個で強化。進化：通常進化または覚醒進化できます。</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {confirmReset && (
        <div className="fixed inset-0 z-[90] bg-black/80 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-red-500 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 className="text-3xl font-black text-red-400 mb-4">本当にリセット？</h2>
            <p className="text-slate-300 font-bold mb-6">カード・ダイヤ・進行状況が消えます。</p>
            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => setConfirmReset(false)} className="bg-slate-700 rounded-xl py-3 font-black">やめる</button>
              <button onClick={resetAllData} className="bg-red-700 rounded-xl py-3 font-black">消す</button>
            </div>
          </div>
        </div>
      )}


    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
