        ${homeButton('story','⚔️','バトルを始める','ストーリーPVE。ボスを倒して次の章へ。','rgba(255,84,104,.24)','rgba(255,84,104,.9)')}

        ${homeButton('dex','📘','カード図鑑','全カードのランク・強さ・技を一覧で確認。','rgba(76,245,142,.20)','rgba(76,245,142,.9)')}

  function homeButton(view,icon,title,desc,glow,glow2){
    return `<button class="panel homeCard" style="--glow:${glow};--glow2:${glow2}" data-action="goto" data-view="${view}"><div class="homeIcon">${icon}</div><div style="text-align:left"><h2>${title}</h2><p>${desc}</p></div></button>`;

  function viewPacks(){
    return `<main class="screen">
      <button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>パックショップ</h1><div class="muted strong small">普通パックに加えて、画像カード限定の超高級フォトパックも追加しました。</div></div><span class="pill gem">★ ${saveData.gems}</span></div>
      <div class="grid grid4">${PACKS.map(p=>packCard(p)).join('')}</div>
    </main>`;
  }
  function packCard(p){
    const rateKeys = Object.keys(p.rates||{}).filter(k=>(p.rates[k]||0)>0);
    const rateInfo = rateKeys.map(k=>`${k}: ${p.rates[k]}%`).join(' / ');
    return `<div class="panel packCard" style="--c1:${p.c1};--c2:${p.c2}">
      <div class="packVisual"><div class="packEmoji">${p.icon}</div></div>
      <div><h2 style="margin:14px 0 4px">${esc(p.name)}</h2><div class="pill" style="padding:5px 9px;font-size:12px">${esc(p.tag)}</div><p class="rateText">${esc(p.desc)}<br>封入枚数: ${p.draws||5}枚 / ${rateInfo}</p></div>
      <div class="cost"><span class="pill gem">★ ${p.cost}</span></div>
      <div class="packButtonGrid"><button class="btn gold" data-action="buyPack" data-pack="${p.id}" data-count="1">1回</button><button class="btn gold" data-action="buyPackBulk" data-pack="${p.id}" data-count="5">5回<br>★${p.cost*5}</button><button class="btn gold" data-action="buyPackBulk" data-pack="${p.id}" data-count="10">10回<br>★${p.cost*10}</button></div>
    </div>`;
  }
  function viewOpening(){
    const p = packById(ui.packId);
    if(ui.openingStage==='ready' || ui.openingStage==='shaking' || ui.openingStage==='tearing'){
      const cls = ui.openingStage==='shaking'?'openingNow':ui.openingStage==='tearing'?'tearing':'';
      return `<main class="screen opening"><div><div class="megaPack ${cls}" style="--c1:${p.c1};--c2:${p.c2}" data-action="tearPack"><div><span>${p.icon}</span><br><b>${esc(p.name)}</b></div></div><div class="tapHint">TAP TO OPEN</div></div></main>`;
    }
    return `<main class="screen opening"><div style="width:100%">
      <div class="sectionTitle center" style="display:block"><h1>カードをタップしてめくる</h1><div class="muted strong small">レアカードは特別な光演出が出ます。</div></div>
      <div class="revealRow">${ui.openingCards.map((id,i)=> i<ui.revealed?cardHTML(cardById(id),'justReveal'):`<button class="backCard" data-action="revealCard" data-index="${i}">🎴</button>`).join('')}</div>
      <div class="mt center">${ui.revealed>=ui.openingCards.length?`<div class="storyNextBox"><button class="btn gold" data-action="repeatPack">同じパックをもう1回</button><button class="btn secondary" data-action="finishOpeningToPacks">パックショップへ</button><button class="btn secondary" data-action="finishOpening">ホームへ</button></div>`:`<div class="tapHint">NEXT CARD</div>`}</div>
    </div></main>`;
  }
  function cardHTML(c, extra='', selected=false, owned=''){
    const r=RARITIES[c.rarity]||RARITIES.C;
    const stars='★'.repeat(r.stars);
    const stats = c.type==='energy'
      ? `<div class="stat">⚡ +${c.charge||1}</div><div class="stat">${elementLabel(c.element)}</div>`
      : c.type==='support'
      ? `<div class="stat">❤ +${c.heal||0}</div><div class="stat">⚡ +${c.energyBoost||0}</div>`
      : `<div class="stat">HP ${c.hp}</div><div class="stat">ATK ${c.atk}</div>`;
    const art = c.art ? `<div class="cardArt"><img src="${c.art}" alt="${esc(c.name)}"></div>` : `<div class="cardArt"><div class="cardArtEmoji">${c.icon}</div></div>`;
    return `<div class="card ${r.shiny?'shiny':''} ${c.specialSet?'specialCard':''} ${extra} ${selected?'selectedCard':''}" style="${rarityStyle(c.rarity)}" data-card="${c.id}">
      <div class="cardTop"><div class="cardName">${esc(c.name)}</div><div class="cardMeta"><span>${stars}</span><span>${c.rarity}</span></div></div>
      ${art}${c.evoLevel?`<span class="evoBadge">+${c.evoLevel}</span>`:''}${c.moves?`<div class="cardMove">技 ${c.moves.length}個：${esc(c.moves[0]?.name||'')}</div>`:''}<div class="cardStats">${stats}</div>${c.moves?`<div class="moveCount">技${c.moves.length}</div>`:''}${owned?`<div class="ownedBadge">${owned}</div>`:''}</div>`;
  }
  function elementLabel(e){ return ({fire:'炎',water:'水',leaf:'草',light:'光',dark:'闇',normal:'無色'}[e]||'無色'); }
  function viewDeck(){
    const cc = counts(); const dc = deckCounts();
    const sorted = Object.keys(cc).map(cardById).sort(cardSort);
    return `<main class="screen"><button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>デッキ編集</h1><div class="muted strong small">上の5枚が現在のデッキ。タップで外せます。</div></div><button class="btn" data-action="saveDeck">保存</button></div>
      <div class="panel" style="padding:12px;margin-bottom:14px"><div class="slotRow">${[0,1,2,3,4].map(i=>saveData.deck[i]?`<button class="slot" data-action="removeDeck" data-index="${i}">${cardHTML(cardById(saveData.deck[i]))}</button>`:`<div class="slot"><div class="emptySlot">EMPTY</div></div>`).join('')}</div></div>
      <div class="cardGrid">${sorted.map(c=>{const can=(dc[c.id]||0)<cc[c.id];return `<button data-action="addDeck" data-cardid="${c.id}" style="background:transparent;padding:0;text-align:left" ${can?'':'disabled'}>${cardHTML(c,can?'':'lock',false,`${dc[c.id]||0}/${cc[c.id]}`)}</button>`}).join('')}</div>
    </main>`;
  }
  function viewCollection(){
    const cc = counts();
    const list = Object.keys(cc).map(cardById).filter(c=>ui.filter==='all'||c.rarity===ui.filter||c.type===ui.filter).sort(cardSort);
    return `<main class="screen"><button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>コレクション</h1><div class="muted strong small">所持カード：${saveData.collection.length}枚 / 種類：${Object.keys(cc).length}</div></div></div>
      <div class="filterRow">${['all','monster','energy','support','C','R','SR','UR','EX','GOD'].map(f=>`<button class="chip ${ui.filter===f?'active':''}" data-action="filter" data-filter="${f}">${filterName(f)}</button>`).join('')}</div>
      <div class="cardGrid mt">${list.map(c=>`<button style="background:transparent;padding:0;text-align:left" data-action="viewCardDetail" data-cardid="${c.id}">${cardHTML(c,'',false,'×'+cc[c.id])}</button>`).join('')}</div>
    </main>`;
  }
  function filterName(f){ return {all:'全部',monster:'モンスター',energy:'エネルギー',support:'サポート',C:'C',R:'R',SR:'SR',UR:'UR',EX:'EX',GOD:'GOD'}[f]||f; }
  function cardSort(a,b){ return (RARITIES[b.rarity].order-RARITIES[a.rarity].order) || a.name.localeCompare(b.name,'ja'); }

  function cardPower(c){
    const moveMax = Math.max(0,...(c.moves||[]).map(m=>m.dmg||0));
    return Math.round((c.hp||0)*0.45 + (c.atk||0)*1.4 + moveMax*1.15 + (RARITIES[c.rarity]?.order||1)*35 + ((saveData.evolved&&saveData.evolved[c.id])||0)*80);
  }
  function rankLabel(c){ const p=cardPower(c); if(p>=980)return 'SSS'; if(p>=760)return 'SS'; if(p>=540)return 'S'; if(p>=350)return 'A'; if(p>=210)return 'B'; return 'C'; }
  function viewDex(){
    const cc=counts(); const list=[...CARDS].map(c=>cardById(c.id)).sort((a,b)=>cardPower(b)-cardPower(a));
    return `<main class="screen"><button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>カード図鑑</h1><div class="muted strong small">全カードのランク・強さ・技数が一目で分かります。カードをタップすると詳細表示。</div></div></div>
      <div class="grid">${list.map(c=>{const p=cardPower(c), own=cc[c.id]||0; return `<button class="dexRow" data-action="viewCardDetail" data-cardid="${c.id}" style="opacity:${own?1:.42}"><div class="dexIcon">${c.art?'🎴':c.icon}</div><div><b>${esc(c.name)} ${c.evoLevel?`<span class="evoBadge">進化+${c.evoLevel}</span>`:''}</b><div class="muted small strong">${c.rarity} / ランク ${rankLabel(c)} / 強さ ${p} / 技 ${(c.moves||[]).length}個 / 所持 ${own}</div><div class="rankMeter mt"><i style="width:${Math.min(100,p/10)}%"></i></div></div><span class="pill">${rankLabel(c)}</span></button>`}).join('')}</div>
    </main>`;
  }
  function viewCardDetail(id){
    const c=cardById(id); const cc=counts(); const lv=(saveData.evolved&&saveData.evolved[id])||0; const can=(cc[id]||0)>=3 && lv<3;
    return `<div class="detailOverlay" data-action="closeDetail"><div class="panel detailBox" onclick="event.stopPropagation()"><div class="between mb"><h1 style="margin:0">${esc(c.name)} ${lv?`<span class="evoBadge">進化+${lv}</span>`:''}</h1><button class="btn secondary" data-action="closeDetail">閉じる</button></div>
      <div class="detailGrid"><div>${cardHTML(c,'',false,`×${cc[id]||0}`)}</div><div><div class="row mb"><span class="pill">${c.rarity}</span><span class="pill">ランク ${rankLabel(c)}</span><span class="pill">強さ ${cardPower(c)}</span><span class="pill">技 ${(c.moves||[]).length}個</span></div>
      <div class="rankMeter mb"><i style="width:${Math.min(100,cardPower(c)/10)}%"></i></div>
      <p class="muted strong">${esc(c.effectText || 'カードごとに異なる技とエフェクトを持っています。')}</p>
      <h2>技一覧</h2><div class="detailMoves">${(c.moves||[]).map(m=>`<div class="detailMove"><b>${esc(m.name)}</b> <span class="pill">⚡${m.cost}</span> <span class="pill">${m.dmg?`DMG ${m.dmg}`:'支援'}</span><br><span class="muted small strong">${esc(m.desc||'')}</span></div>`).join('')}</div>
      <div class="mt"><button class="btn gold" data-action="evolveCard" data-cardid="${id}" ${can?'':'disabled'}>同じカード3枚で進化 ${lv>=3?'MAX':`+${lv+1}`}</button><div class="muted small strong mt">進化条件：同じカード3枚以上。進化するとHP・攻撃・技ダメージが上がります。</div></div>
      </div></div></div></div>`;
  }

  function viewStory(){
    return `<main class="screen"><button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>ストーリーPVE</h1><div class="muted strong small">長めの物語に変更。各章をクリアすると次の章が解放されます。</div></div><button class="btn danger" data-action="quickBattle">今すぐ挑戦</button></div>
      <div class="storyIntro"><b>あらすじ：</b> 古いカード研究所で見つけた端末から、君は「クロノカード」の世界に入ってしまう。世界の時間を守るため、暴走したカードとボスを倒し、最後にクロノ・ゼロ EXへたどり着こう。</div>
      <div class="grid">${BOSSES.map((b,i)=>{const open=saveData.storyProgress>=i; const clear=saveData.storyProgress>i; return `<button class="panel storyCard ${open?'':'lock'}" data-action="startBattle" data-boss="${b.id}" ${open?'':'disabled'}><div class="homeIcon">${open?b.icon:'🔒'}</div><div style="text-align:left"><div class="storyTag">${esc(b.tag)} ${clear?' / CLEAR':''}</div><h2>${esc(b.name)} ${clear?'🏆':''}</h2><p>${open?esc(b.story):'前の章をクリアすると解放されます。'}</p></div><div style="display:grid;gap:8px;justify-items:end"><span class="pill">HP ${b.hp}</span><span class="pill gem">★ ${b.reward}</span></div></button>`}).join('')}</div>

  function viewBattle(){
    const b = ui.battle; if(!b) return viewHome();
    const boss = bossById(b.bossId);
    const hpw = Math.max(0, Math.min(100, (b.playerHp/b.playerMax)*100));
    const ehpw = Math.max(0, Math.min(100, (b.enemyHp/b.enemyMax)*100));
    const deck = saveData.deck.map(cardById);
    return `<main class="screen battleWrap">
      <div class="between"><button class="back" data-action="endBattle">← 降参</button><div class="pill">${esc(boss.name)}</div></div>
      <section class="arena panel">
        <div class="hpBox enemyHp"><div class="hpName">ENEMY</div><div class="hpNum">${Math.ceil(b.enemyHp)}</div><div class="bar"><i style="width:${ehpw}%"></i></div></div>
        <div class="hpBox playerHp"><div class="hpName">${esc(saveData.nickname)}</div><div class="hpNum">${Math.ceil(b.playerHp)}</div><div class="bar"><i style="width:${hpw}%"></i></div><div class="energyBar">${[1,2,3,4,5,6,7,8].map(n=>`<i class="energyDot ${b.energy>=n?'on':''}"></i>`).join('')}</div></div>
        <div class="enemyAvatar">${boss.icon}</div><div class="vs">VS</div><div class="playerField">${b.activeCard?cardHTML(cardById(b.activeCard)):'<div class="emptySlot">CARD</div>'}</div>

      ${b.result?`<div class="resultOverlay"><div class="panel resultCard"><h1 style="color:${b.result==='win'?'var(--gold)':'#8790aa'}">${b.result==='win'?'VICTORY':'DEFEAT'}</h1><p class="muted strong">${b.result==='win'?`報酬 ★${boss.reward} を獲得！`:'デッキを強化してもう一度挑戦しよう。'}</p><div class="continueHint">ホームに戻らず、このまま連続で進められます。</div><div class="storyNextBox">${b.result==='win'&&BOSSES[saveData.storyProgress]?`<button class="btn gold" data-action="nextStoryBattle">次の章へ</button>`:''}<button class="btn secondary" data-action="finishBattle">ストーリー一覧へ</button><button class="btn secondary" data-action="retryBattle" data-boss="${boss.id}">もう一度</button></div></div></div>`:''}
    </main>`;
  }

  function battleMovePanel(b, deck){
    if(b.selected===null) return `<div class="movePanel"><button class="moveBtn" disabled><b>カードを選択</b><small>下の手札からカードを選ぶと、技が表示されます。</small></button></div>`;
    const c=deck[b.selected];
    return `<div class="movePanel">${(c.moves||[]).map((m,i)=>`<button class="moveBtn" data-action="battleMove" data-move="${i}" ${b.locked||b.energy<(m.cost||0)?'disabled':''}><b>${esc(m.name)} / ⚡${m.cost||0}</b><small>${m.dmg?`DMG ${m.dmg} `:'支援 '}${esc(m.desc||'')}${b.energy<(m.cost||0)?' / エネルギー不足':''}</small></button>`).join('')}</div>`;

  function viewSaveCode(){

  function viewOnline(){

    return `<main class="screen"><button class="back" data-action="leaveOnline">← 戻る</button>
      <div class="sectionTitle"><div><h1>オンライン対戦</h1><div class="muted strong small">同じ3桁コードを前後15秒以内に入力した相手と対戦します。</div></div>${ready?'<span class="onlineBadge">● ONLINE READY</span>':'<span class="offlineBadge">● 未接続</span>'}</div>

  function weightedRarity(rates){
    const total=Object.values(rates).reduce((a,b)=>a+b,0); let x=Math.random()*total;
    for(const [r,v] of Object.entries(rates)){ x-=v; if(x<=0) return r; }
    return 'C';
  }
  function pickCard(pack, minRarity){
    let rarity = weightedRarity(pack.rates);
    if(minRarity && RARITIES[rarity].order < RARITIES[minRarity].order){
      const choices = Object.keys(RARITIES).filter(r=>RARITIES[r].order>=RARITIES[minRarity].order && (pack.rates[r]||0)>0);
      rarity = choices[Math.floor(Math.random()*choices.length)] || minRarity;
    }
    let pool = CARDS.filter(c=>c.rarity===rarity);
    if(pack.only==='monster') pool=pool.filter(c=>c.type==='monster');
    if(pack.only==='energy') pool=pool.filter(c=>c.type==='energy');
    if(pack.only==='special') pool=pool.filter(c=>c.specialSet);
    if(pack.only==='support') pool=pool.filter(c=>c.type==='support');
    if(!pool.length) pool=CARDS.filter(c=>c.type===pack.only || !pack.only);
    return pool[Math.floor(Math.random()*pool.length)].id;
  }
  function buyPack(id,count=1){
    count=Math.max(1, Math.min(10, Number(count)||1));
    const p=packById(id);
    const total=p.cost*count;
    if(saveData.gems<total){ toast('ジェムが足りません'); return; }
    if(saveData.settings.confirmPack && !confirm(`${p.name}を${count}回、${total}ジェムで開封しますか？`)) return;
    saveData.gems-=total;
    const drawCount = (p.draws || 5) * count;
    const cards=[]; for(let i=0;i<drawCount;i++) cards.push(pickCard(p, p.guarantee && (i%(p.draws||5))===(p.draws||5)-1 ? p.guarantee : null));
    saveData.collection.push(...cards); saveData.stats.packs=(saveData.stats.packs||0)+count; save();
    ui.view='opening'; ui.packId=id; ui.openingStage='ready'; ui.openingCards=cards; ui.revealed=0; ui.lastPackCount=count; render();
  }

  function battleAction(moveIndex=0){
    const b=ui.battle; if(!b || b.result || b.locked) return;

    const card=cardById(saveData.deck[b.selected]); const mv=(card.moves||[])[moveIndex] || (card.moves||[])[0];
    if(!mv){ toast('このカードには技がありません'); return; }
    if(b.energy<(mv.cost||0)){ toast('エネルギーが足りません'); return; }
    b.locked=true; b.activeCard=card.id; render(); vib(25);
    b.energy=Math.max(0,b.energy-(mv.cost||0));
    if(mv.charge){ b.energy=Math.min(10,b.energy+mv.charge); }
    if(mv.heal){ b.playerHp=Math.min(b.playerMax,b.playerHp+mv.heal); }
    if(mv.guard){ b.guard=(b.guard||0)+mv.guard; }
    let dmg=0;
    if(mv.dmg){
      dmg=Math.floor(mv.dmg + (b.energy*4) + RARITIES[card.rarity].order*5 + Math.random()*14);
      b.enemyHp=Math.max(0,b.enemyHp-dmg); saveData.stats.bestDamage=Math.max(saveData.stats.bestDamage||0,dmg);
      if(mv.selfDamage||card.selfDamage) b.playerHp=Math.max(1,b.playerHp-(mv.selfDamage||card.selfDamage||0));
      b.log.unshift(`${card.name} の ${mv.name}！ ${dmg}ダメージ！`); attackEffect(card.element,dmg,mv.fx||'slash');
    }else{

  function onlineReady(){ return !!(ONLINE_CONFIG.apiKey && ONLINE_CONFIG.projectId && ONLINE_CONFIG.appId); }

    try{
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js');
      const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js');
      const fbApp = appMod.initializeApp(ONLINE_CONFIG);
      const db = fsMod.getFirestore(fbApp);

  async function startOnlineSearch(){
    const code = String(ui.online.code||'').replace(/\D/g,'').slice(0,3);
    if(code.length!==3){ toast('3桁の数字を入力してください'); return; }
    if(!(await initOnline())) return;
    const {db,collection,query,where,getDocs,addDoc,doc,updateDoc,onSnapshot} = onlineApi;
    ui.online.status='searching'; ui.online.message='15秒以内に同じコードを入力した相手を探しています...'; render();
    const now = Date.now(); const hp = onlineHp();
    try{
      const q = query(collection(db, ONLINE_COLLECTION), where('passcode','==',code), where('status','==','waiting'));
      const snap = await getDocs(q);
      let found = null;
      snap.forEach(d=>{ const m={id:d.id,...d.data()}; if(!found && m.p1?.id!==saveData.clientId && now-(m.createdAtMs||0)<=15000) found=m; });
      if(found){
        await updateDoc(doc(db, ONLINE_COLLECTION, found.id), {status:'playing',p2:{id:saveData.clientId,nickname:saveData.nickname},p2Hp:hp,p2MaxHp:hp,p2Energy:0,turn:'p1',lastLog:`${saveData.nickname} が入室しました`,updatedAtMs:now});
        listenOnlineMatch(found.id); ui.online.matchId=found.id; ui.online.message='マッチしました';
      }else{
        const ref = await addDoc(collection(db, ONLINE_COLLECTION), {passcode:code,status:'waiting',createdAtMs:now,updatedAtMs:now,p1:{id:saveData.clientId,nickname:saveData.nickname},p1Hp:hp,p1MaxHp:hp,p1Energy:0,turn:'p1',lastLog:'対戦相手を待っています'});
        listenOnlineMatch(ref.id); ui.online.matchId=ref.id; ui.online.message='部屋を作成しました。相手を待っています...';
      }
    }catch(err){ console.error(err); ui.online.status='idle'; ui.online.message='オンライン接続に失敗しました。'; toast('接続に失敗しました'); }
    render();
  }
  function listenOnlineMatch(id){
    if(onlineUnsub) onlineUnsub();

      if(!snap.exists()){ ui.online={code:'',status:'idle',selected:null,matchId:null,state:null,message:'部屋が終了しました'}; render(); return; }
      const data={id:snap.id,...snap.data()}; ui.online.state=data; ui.online.status=data.status; ui.online.message=data.lastLog||'';
      if(data.status==='finished' && data.winnerId===saveData.clientId && !onlineRewardedMatches.has(data.id)){ onlineRewardedMatches.add(data.id); saveData.gems+=300; save(); }
      render();

  }

  function attackEffect(element,dmg,fxType='slash'){
    const color={fire:'#ff5a3d',water:'#41e8ff',leaf:'#4cf58e',light:'#ffd45f',dark:'#b86bff',normal:'#ffffff'}[element]||'#ffffff';
    if(fxType==='flame'||fxType==='explode') { screenFlash('#ff5a3d66'); addImpact(color); burstEffect(color,68,36,48); }
    else if(fxType==='aqua'||fxType==='ice') { screenFlash('#41e8ff44'); addBeam(color,-14); burstEffect(color,64,38,30); }
    else if(fxType==='vine'||fxType==='storm') { addSlash('#4cf58e',-34); addSlash('#4cf58e',28); burstEffect('#4cf58e',60,42,32); }
    else if(fxType==='beam'||fxType==='flash') { screenFlash('#ffffff88'); addBeam(color,0); addImpact(color); }
    else if(fxType==='shadow'||fxType==='curse'||fxType==='void'||fxType==='abyss') { screenFlash('#6d28d966'); addBeam('#b86bff',-8); addSlash('#2e1065',22); burstEffect('#b86bff',70,35,46); }
    else if(fxType==='meteor'||fxType==='nova') { screenFlash('#ffd45f77'); addImpact('#ffd45f'); addBeam(color,10); burstEffect('#ffd45f',68,34,58); }
    else { screenFlash(color+'55'); addSlash(color,-18); setTimeout(()=>addSlash(color,16),95); addBeam(color,-8); addImpact(color); burstEffect(color,70,36,34); }
    addDamage(dmg);

    if(a==='buyPack') buyPack(el.dataset.pack, el.dataset.count||1);
    if(a==='buyPackBulk') buyPack(el.dataset.pack, el.dataset.count||1);
    if(a==='tearPack' && ui.openingStage==='ready'){ ui.openingStage='shaking'; render(); setTimeout(()=>{ui.openingStage='tearing'; render();},650); setTimeout(()=>{ui.openingStage='opened'; rareEffect('R'); render();},1280); }
    if(a==='revealCard') revealCard(Number(el.dataset.index));
    if(a==='finishOpening'){ ui.view='home'; render(); }
    if(a==='finishOpeningToPacks'){ ui.view='packs'; render(); }
    if(a==='repeatPack'){ buyPack(ui.packId, 1); }
    if(a==='addDeck') addDeck(el.dataset.cardid);
    if(a==='removeDeck') removeDeck(el.dataset.index);
    if(a==='saveDeck') saveDeck();
    if(a==='filter'){ ui.filter=el.dataset.filter; render(); }
    if(a==='startBattle') startBattle(el.dataset.boss);
    if(a==='selectBattleCard'){ if(ui.battle&&!ui.battle.locked&&!ui.battle.result){ui.battle.selected=Number(el.dataset.index); render();} }
    if(a==='battleAction') battleAction();
    if(a==='battleMove') battleAction(Number(el.dataset.move||0));
    if(a==='chargeEnergy'){ if(ui.battle){ ui.battle.energy=Math.min(10,(ui.battle.energy||0)+2); auraEffect('light'); render(); } }
    if(a==='autoSelect') autoSelect();
    if(a==='endBattle'){ ui.battle=null; ui.view='story'; render(); }
    if(a==='finishBattle'){ ui.battle=null; ui.view='story'; render(); }
    if(a==='retryBattle'){ const id=el.dataset.boss || (ui.battle&&ui.battle.bossId); ui.battle=null; startBattle(id); }
    if(a==='nextStoryBattle'){ const next=BOSSES[Math.min(saveData.storyProgress, BOSSES.length-1)]; ui.battle=null; startBattle(next.id); }
    if(a==='toggleSetting'){ const k=el.dataset.key; saveData.settings[k]=!saveData.settings[k]; save(); render(); }
    if(a==='copyExport'){ navigator.clipboard?.writeText(exportCode()); toast('コピーしました'); }
    if(a==='importSave'){ try{importCode(document.getElementById('importBox').value);}catch(err){toast('セーブコードが正しくありません');} }
    if(a==='dailyBonus') dailyBonus();
    if(a==='runAdminCode') runAdminCode();
    if(a==='clearAdminCode'){ ui.adminCode=''; render(); }
    if(a==='startOnlineSearch') startOnlineSearch();
    if(a==='cancelOnlineSearch') cancelOnlineSearch();
    if(a==='leaveOnline') leaveOnline();
    if(a==='selectOnlineCard'){ ui.online.selected=Number(el.dataset.index); render(); }
    if(a==='onlineAction') onlineAction();
    if(a==='onlineAutoSelect') onlineAutoSelect();
    if(a==='finishOnlineBattle'){ leaveOnline(); }
    if(a==='viewCardDetail'){ ui.detailCardId=el.dataset.cardid; render(); }
    if(a==='closeDetail') closeDetail();
    if(a==='evolveCard') evolveCard(el.dataset.cardid);
    if(a==='softReset'){ if(confirm('本当に最初からやり直しますか？')){ saveData=defaultSave(); save(); ui.view='title'; render(); } }
  });

  // ===== EXTRA UPDATE: cooldown, type advantage, levels, auto deck, friend ranking =====
  function normalizeSaveV2(){
    saveData.cardXp = saveData.cardXp || {};
    saveData.cardLevels = saveData.cardLevels || {};
    saveData.friends = Array.isArray(saveData.friends) ? saveData.friends : [];
    saveData.stats = saveData.stats || {};
    saveData.stats.totalDamage = saveData.stats.totalDamage || 0;
    saveData.stats.maxStory = Math.max(saveData.stats.maxStory||0, saveData.storyProgress||0);
    saveData.versionTag = 'cooldown_type_level_friend_v1';
  }
  normalizeSaveV2();

  function moveCooldown(m){
    if(m.cooldown!==undefined) return m.cooldown;
    const c = Number(m.cost||0);
    if(c>=5) return 3;
    if(c>=3) return 2;
    if(c>=1) return 1;
    return 0;
  }
  function decorateMovesV2(){
    CARDS.forEach(c=>{
      if(!c.moves || !c.moves.length) c.moves=baseMovesFor(c);
      c.moves = c.moves.map((m,i)=>({
        ...m,
        cooldown: moveCooldown(m),
        type: m.type || c.element || 'normal',
        fx: m.fx || (c.element==='fire'?'flame':c.element==='water'?'aqua':c.element==='leaf'?'vine':c.element==='light'?'flash':c.element==='dark'?'shadow':'impact')
      }));
      const need = c.type==='monster' ? Math.min(4, rarityMoveCount(c.rarity)) : Math.min(4, Math.max(1,(c.moves||[]).length));
      while(c.moves.length<need){
        const i=c.moves.length;
        c.moves.push(move(`${elementLabel(c.element)}追加奥義 ${i+1}`, Math.min(5,i+1), Math.round((c.atk||40)*(0.8+i*.35)), c.element==='dark'?'abyss':'nova', '追加された強力な技。', {cooldown:Math.min(3,i), type:c.element||'normal'}));
      }
    });
  }
  decorateMovesV2();

  const TYPE_CHART = {
    fire:{leaf:1.35, water:.75},
    water:{fire:1.35, leaf:.75},
    leaf:{water:1.35, fire:.75},
    light:{dark:1.25},
    dark:{light:1.25},
    normal:{}
  };
  function typeMultiplier(atkType, defType){
    return (TYPE_CHART[atkType] && TYPE_CHART[atkType][defType]) || 1;
  }
  function typeText(mult){
    if(mult>=1.3) return '効果ばつぐん！';
    if(mult<=.8) return 'いまひとつ…';
    return '';
  }
  function cardLevel(id){ normalizeSaveV2(); return saveData.cardLevels[id] || 1; }
  function cardXp(id){ normalizeSaveV2(); return saveData.cardXp[id] || 0; }
  function addCardXp(id, xp){
    normalizeSaveV2();
    saveData.cardXp[id]=(saveData.cardXp[id]||0)+xp;
    let lv=saveData.cardLevels[id]||1;
    while(lv<50 && saveData.cardXp[id] >= lv*120){
      saveData.cardXp[id] -= lv*120;
      lv++;
      rareEffect('SR');
    }
    saveData.cardLevels[id]=lv;
  }
  const __oldCardByIdV2 = cardById;
  cardById = function(id){
    const c = __oldCardByIdV2(id);
    const lv = cardLevel(id);
    if(lv<=1) return c;
    const mul = 1 + (lv-1)*0.025;
    const x = {...c, cardLevel:lv};
    if(x.hp) x.hp=Math.round(x.hp*mul);
    if(x.atk) x.atk=Math.round(x.atk*mul);
    if(x.moves) x.moves=x.moves.map(m=>({...m,dmg:m.dmg?Math.round(m.dmg*mul):m.dmg}));
    return x;
  };
  const __oldCardHTMLV2 = cardHTML;
  cardHTML = function(c, extra='', selected=false, owned=''){
    const html = __oldCardHTMLV2(c, extra, selected, owned);
    if(!c || !c.id) return html;
    return html.replace('</div>', `<div class="levelPill">Lv.${cardLevel(c.id)} / XP ${cardXp(c.id)}</div></div>`);
  };

  const __oldMainViewV2 = mainView;
  mainView = function(){
    if(ui.view==='friends') return viewFriendsRanking();
    return __oldMainViewV2();
  };

  const __oldViewHomeV2 = viewHome;
  viewHome = function(){
    return __oldViewHomeV2().replace(
      `${homeButton('savecode','🔐','セーブコード','アップデート後もデータを引き継げる。','rgba(142,104,255,.25)','rgba(142,104,255,.9)')}`,
      `${homeButton('ranking','🏆','友達ランキング','友達コードで記録を共有して順位を競う。','rgba(255,212,95,.22)','rgba(255,212,95,.95)')}${homeButton('savecode','🔐','セーブコード','アップデート後もデータを引き継げる。','rgba(142,104,255,.25)','rgba(142,104,255,.9)')}`
    ).replace(`data-view="ranking"`,`data-view="friends"`);
  };

  const __oldViewDeckV2 = viewDeck;
  viewDeck = function(){
    return __oldViewDeckV2().replace(
      '<button class="btn" data-action="saveDeck">保存</button>',
      '<div class="row"><button class="btn secondary" data-action="autoBuildDeck">おすすめ自動編成</button><button class="btn" data-action="saveDeck">保存</button></div>'
    );
  };

  function autoBuildDeck(){
    const cc=counts();
    const owned=Object.keys(cc).map(cardById).filter(c=>c.type==='monster'||c.type==='energy'||c.type==='support');
    const monsters=owned.filter(c=>c.type==='monster').sort((a,b)=>cardPower(b)-cardPower(a));
    const energy=owned.filter(c=>c.type==='energy'||c.type==='support').sort((a,b)=>cardPower(b)-cardPower(a));
    const chosen=[];
    monsters.forEach(c=>{ if(chosen.length<3) chosen.push(c.id); });
    energy.forEach(c=>{ if(chosen.length<5) chosen.push(c.id); });
    owned.sort((a,b)=>cardPower(b)-cardPower(a)).forEach(c=>{ if(chosen.length<5 && !chosen.includes(c.id)) chosen.push(c.id); });
    saveData.deck=chosen.slice(0,5);
    while(saveData.deck.length<5) saveData.deck.push(START_DECK[saveData.deck.length]||START_DECK[0]);
    save(); toast('おすすめデッキを作成しました'); render();
  }

  startBattle = function(id){
    normalizeSaveV2();
    const boss=bossById(id); const deck=saveData.deck.map(cardById);
    const max = 140 + deck.reduce((a,c)=>a+(c.hp||0),0);
    ui.battle={bossId:id,playerHp:max,playerMax:max,enemyHp:boss.hp,enemyMax:boss.hp,energy:4,guard:0,selected:null,activeCard:null,locked:false,result:null,log:[boss.story || `${boss.name} が現れた！`],cooldowns:{}};
    ui.view='battle'; render();
  };

  battleMovePanel = function(b, deck){
    if(b.selected===null) return `<div class="movePanel"><button class="moveBtn" disabled><b>カードを選択</b><small>下の手札からカードを選ぶと、技が表示されます。</small></button></div>`;
    const c=deck[b.selected]; const keyPrefix=`${b.selected}:`;
    return `<div class="movePanel">${(c.moves||[]).map((m,i)=>{
      const cd=(b.cooldowns&&b.cooldowns[keyPrefix+i])||0;
      const disabled=b.locked||b.energy<(m.cost||0)||cd>0;
      const mult=typeMultiplier(m.type||c.element, bossById(b.bossId).element);
      return `<button class="moveBtn" data-action="battleMove" data-move="${i}" ${disabled?'disabled':''}><b>${esc(m.name)} / ⚡${m.cost||0}${cd?`<span class="coolBadge">あと${cd}T</span>`:''}</b><small><span class="typeBadge">${elementLabel(m.type||c.element)}</span> ${m.dmg?`DMG ${m.dmg} `:'支援 '}${mult!==1?`倍率 ${mult}x `:''}${esc(m.desc||'')}${b.energy<(m.cost||0)?' / エネルギー不足':''}</small></button>`;
    }).join('')}</div>`;
  };

  function tickCooldowns(){
    const b=ui.battle; if(!b||!b.cooldowns) return;
    Object.keys(b.cooldowns).forEach(k=>{ b.cooldowns[k]=Math.max(0,(b.cooldowns[k]||0)-1); if(!b.cooldowns[k]) delete b.cooldowns[k]; });
  }

  battleAction = function(moveIndex=0){
    normalizeSaveV2();
    const b=ui.battle; if(!b || b.result || b.locked) return;
    if(b.selected===null){ toast('使うカードを選んでください'); return; }
    const card=cardById(saveData.deck[b.selected]); const mv=(card.moves||[])[moveIndex] || (card.moves||[])[0];
    if(!mv){ toast('このカードには技がありません'); return; }
    const cdKey=`${b.selected}:${moveIndex}`;
    if((b.cooldowns&&b.cooldowns[cdKey])>0){ toast('この技はクールタイム中です'); return; }
    if(b.energy<(mv.cost||0)){ toast('エネルギーが足りません'); return; }
    b.locked=true; b.activeCard=card.id; render(); vib(25);
    b.energy=Math.max(0,b.energy-(mv.cost||0));
    if(mv.charge){ b.energy=Math.min(12,b.energy+mv.charge); }
    if(mv.heal){ b.playerHp=Math.min(b.playerMax,b.playerHp+mv.heal); }
    if(mv.guard){ b.guard=(b.guard||0)+mv.guard; }
    b.cooldowns=b.cooldowns||{};
    const cd=moveCooldown(mv);
    if(cd>0) b.cooldowns[cdKey]=cd;
    let dmg=0;
    const boss=bossById(b.bossId);
    const mult=typeMultiplier(mv.type||card.element,boss.element);
    if(mv.dmg){
      dmg=Math.floor((mv.dmg + (b.energy*5) + RARITIES[card.rarity].order*6 + cardLevel(card.id)*2 + Math.random()*15)*mult);
      b.enemyHp=Math.max(0,b.enemyHp-dmg); 
      saveData.stats.bestDamage=Math.max(saveData.stats.bestDamage||0,dmg);
      saveData.stats.totalDamage=(saveData.stats.totalDamage||0)+dmg;
      if(mv.selfDamage||card.selfDamage) b.playerHp=Math.max(1,b.playerHp-(mv.selfDamage||card.selfDamage||0));
    }
    b.log.unshift(`${card.name} の ${mv.name}！ ${dmg?`${dmg}ダメージ！`:''} ${typeText(mult)}`.trim());
    effectByMove(mv.fx||card.element, dmg||mv.heal||30);
    if(b.enemyHp<=0){ winBattle(); render(); return; }
    setTimeout(()=>enemyTurn(),760); render();
  };

  enemyTurn = function(){
    const b=ui.battle; if(!b||b.result) return;
    tickCooldowns();
    const boss=bossById(b.bossId); let dmg=Math.floor(boss.power*(.85+Math.random()*.45));
    if(b.guard){ const reduce=Math.min(dmg,b.guard); dmg-=reduce; b.guard=Math.max(0,b.guard-reduce); }
    b.playerHp=Math.max(0,b.playerHp-dmg); b.energy=Math.min(12,(b.energy||0)+3);
    b.log.unshift(`${boss.name} の反撃！ ${dmg}ダメージ！ / エネルギー+3`);
    enemyEffect(boss.element,dmg);
    b.locked=false; b.activeCard=null; b.selected=null;
    if(b.playerHp<=0){ loseBattle(); }
    render();
  };

  winBattle = function(){
    const b=ui.battle; const boss=bossById(b.bossId); const idx=BOSSES.findIndex(x=>x.id===boss.id);
    b.result='win'; b.locked=false; saveData.gems+=boss.reward; saveData.storyProgress=Math.max(saveData.storyProgress,idx+1); 
    saveData.stats.wins++; saveData.stats.maxStory=Math.max(saveData.stats.maxStory||0, saveData.storyProgress||0);
    saveData.deck.forEach(id=>addCardXp(id, 80 + idx*25));
    save(); rareEffect('UR'); toast('カード経験値を獲得しました');
  };

  autoSelect = function(){
    const b=ui.battle; if(!b||b.result) return;
    let best=0, score=-999;
    const boss=bossById(b.bossId);
    saveData.deck.map(cardById).forEach((c,i)=>{
      const bestMove=Math.max(...(c.moves||[]).map((m,mi)=>{
        const cd=(b.cooldowns&&b.cooldowns[`${i}:${mi}`])||0;
        if(cd>0 || (m.cost||0)>b.energy) return -50;
        const mult=typeMultiplier(m.type||c.element,boss.element);
        return (m.dmg||0)*mult + (m.heal||0)*0.8 + (m.charge||0)*25 - (m.cost||0)*8;
      }));
      const s=bestMove+RARITIES[c.rarity].order*12+cardLevel(c.id)*3;
      if(s>score){score=s;best=i;}
    });
    b.selected=best; render();
  };

  const __oldEvolveCardV2 = evolveCard;
  evolveCard = function(id){
    const before=(saveData.evolved&&saveData.evolved[id])||0;
    __oldEvolveCardV2(id);
    const after=(saveData.evolved&&saveData.evolved[id])||0;
    if(after>before) showEvoCutin(rawCardById(id).name, after);
  };
  function showEvoCutin(name, lv){
    const d=document.createElement('div'); d.className='evoCutin'; d.innerHTML=`<div><h1>EVOLUTION!</h1><p class="center strong">${esc(name)} 進化+${lv}</p></div>`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),1500);
  }

  function myFriendCode(){
    normalizeSaveV2();
    const payload={
      v:1, id:saveData.clientId, nickname:saveData.nickname,
      wins:saveData.stats.wins||0, bestDamage:saveData.stats.bestDamage||0,
      maxStory:saveData.storyProgress||0, cardKinds:Object.keys(counts()).length,
      updatedAt:Date.now()
    };
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }
  function importFriendCode(code){
    const f=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!f.id || !f.nickname) throw new Error('bad friend code');
    normalizeSaveV2();
    saveData.friends = saveData.friends.filter(x=>x.id!==f.id);
    saveData.friends.push(f);
    save(); toast(`${f.nickname} をランキングに追加/更新しました`);
  }
  function myRankEntry(){
    return {id:saveData.clientId,nickname:saveData.nickname,wins:saveData.stats.wins||0,bestDamage:saveData.stats.bestDamage||0,maxStory:saveData.storyProgress||0,cardKinds:Object.keys(counts()).length,updatedAt:Date.now(),self:true};
  }
  function rankScore(x){ return (x.wins||0)*100000 + (x.maxStory||0)*5000 + (x.bestDamage||0)*20 + (x.cardKinds||0)*60; }
  function viewFriendsRanking(){
    normalizeSaveV2();
    const rows=[myRankEntry(),...(saveData.friends||[])].sort((a,b)=>rankScore(b)-rankScore(a));
    return `<main class="screen"><button class="back" data-action="goto" data-view="home">← 戻る</button>
      <div class="sectionTitle"><div><h1>友達ランキング</h1><div class="muted strong small">友達コードを交換すると、ニックネームと記録をランキングに表示できます。友達の記録が更新されたら、新しい友達コードを貼ると上書き反映されます。</div></div></div>
      <div class="grid grid2">
        <section class="panel" style="padding:16px"><h2 style="margin-top:0">自分の友達コード</h2><div class="friendCodeBox">${myFriendCode()}</div><button class="btn mt" data-action="copyFriendCode">自分の友達コードをコピー</button></section>
        <section class="panel" style="padding:16px"><h2 style="margin-top:0">友達コードを追加/更新</h2><textarea id="friendCodeInput" class="textarea" placeholder="友達からもらったコードを貼る"></textarea><button class="btn gold mt" data-action="importFriendCode">ランキングに追加/更新</button></section>
      </div>
      <section class="panel mt"><h2 style="padding:16px;margin:0">ランキング</h2>${rows.map((r,i)=>`<div class="rankRow"><div class="rankNo">${i+1}</div><div><b>${esc(r.nickname)} ${r.self?'（自分）':''}</b><div class="muted small strong">勝利 ${r.wins||0} / 最高ダメージ ${r.bestDamage||0} / 章 ${r.maxStory||0} / 種類 ${r.cardKinds||0}</div></div><div class="pill">${rankScore(r)}</div></div>`).join('')}</section>
    </main>`;
  }

  const __oldExportCodeV2 = exportCode;
  exportCode = function(){ normalizeSaveV2(); return __oldExportCodeV2(); };
  const __oldImportCodeV2 = importCode;
  importCode = function(code){ __oldImportCodeV2(code); normalizeSaveV2(); save(); };

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]'); if(!el) return;
    const a=el.dataset.action;
    if(a==='autoBuildDeck') autoBuildDeck();
    if(a==='copyFriendCode'){ navigator.clipboard?.writeText(myFriendCode()); toast('友達コードをコピーしました'); }
    if(a==='importFriendCode'){ try{ importFriendCode(document.getElementById('friendCodeInput').value); render(); }catch(err){ toast('友達コードが正しくありません'); } }
  });

  normalizeSaveV2();

  save(); render();
  </script>
