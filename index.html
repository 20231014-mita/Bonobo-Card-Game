<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>トイパズ！ V8 UI STABLE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0f172a;--line:#334155;--txt:#f8fafc;
  --pink:#fb7185;--cyan:#22d3ee;--yellow:#facc15;--green:#34d399;--purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;color:var(--txt);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;user-select:none}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer;touch-action:manipulation}
#app{width:100%;height:100dvh;max-width:450px;margin:0 auto;background:radial-gradient(circle at 50% 0,#2563eb,#0f172a 50%,#020617);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px #000}
@media(min-width:460px){body{display:flex;align-items:center;justify-content:center}#app{height:850px;max-height:96vh;border:8px solid #1e293b;border-radius:38px}}
.top{height:56px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #334155;z-index:50;flex-shrink:0}
.pill{background:#1f2937;border:1px solid #475569;border-radius:999px;padding:5px 9px;display:flex;gap:5px;align-items:center;font-weight:900;font-size:13px}
.logo{text-align:center;line-height:1}.logo small{display:block;color:#818cf8;font-size:9px;font-weight:900;letter-spacing:.13em}.logo b{font-size:20px;background:linear-gradient(90deg,#fde047,#fb7185,#22d3ee);-webkit-background-clip:text;color:transparent}
.view{flex:1;min-height:0;position:relative;background:#0f172a;display:flex;flex-direction:column}
.hidden{display:none!important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:rgba(30,41,59,.92);border:1px solid rgba(100,116,139,.55);border-radius:22px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.btn{border-radius:18px;font-weight:900;padding:12px 14px;background:#334155;box-shadow:0 4px 0 #111827;transition:.08s transform,.08s filter}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #000;filter:brightness(.92)}
.btn-main{background:linear-gradient(#fb7185,#be123c);box-shadow:0 6px 0 #881337;color:white;border:2px solid #fda4af}
.btn-blue{background:linear-gradient(#38bdf8,#2563eb);box-shadow:0 4px 0 #1d4ed8}
.btn-gold{background:linear-gradient(#facc15,#d97706);box-shadow:0 4px 0 #92400e;color:#111827}
.btn-green{background:linear-gradient(#34d399,#0f766e);box-shadow:0 4px 0 #115e59}
.home-head{padding:16px;background:linear-gradient(#1e293b,#0f172a);border-bottom:1px solid #1e293b}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:10px;color:#94a3b8;font-weight:800}
.big-score{font-size:34px;color:#fde047;font-weight:1000;line-height:1}
.my-wrap{text-align:center;padding:18px 16px 10px}
.my-tsum{width:142px;height:142px;margin:0 auto;background:#1e293b;border:5px solid #64748b;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px #0008;overflow:hidden}
.my-tsum canvas{width:124px;height:124px;position:relative;z-index:1}
.badge{position:absolute;z-index:3;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:1000;box-shadow:0 2px 5px #0007}
.badge-rank{top:9px;left:9px}.badge-lv{right:8px;bottom:8px;background:#4f46e5}
.change{display:inline-block;margin-top:-8px;background:linear-gradient(90deg,#facc15,#f59e0b);color:#111827;border:2px solid #020617;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:1000;position:relative;z-index:5}
.play-btn{width:260px;font-size:30px;margin:18px auto 0;display:block;letter-spacing:.08em}
.section{margin:12px 14px;padding:14px}
.section-title{font-size:13px;font-weight:1000;letter-spacing:.08em;margin-bottom:8px}
.small-btn{padding:8px 10px;border-radius:12px;font-size:12px;font-weight:900;background:#334155}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#1e1b4b,#05020d)}
#gameCanvas{width:100%;height:100%;max-width:400px;max-height:500px;aspect-ratio:4/5;touch-action:none;display:block}
.game-ui{position:absolute;inset:0;pointer-events:none}
.hud-left{position:absolute;top:12px;left:12px;background:#0f172acc;border:1px solid #475569;border-radius:18px;padding:9px 12px;backdrop-filter:blur(4px)}
.score{font-size:28px;color:#fde047;font-weight:1000;line-height:1}
.hud-right{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.pause{width:42px;height:42px;border-radius:50%;background:#1e293bee;border:1px solid #64748b;font-size:20px}
.timer{background:#1e293bee;border:2px solid #64748b;border-radius:999px;padding:3px 18px;font-size:32px;font-weight:1000}
.fever-box{position:absolute;top:94px;left:12px;width:140px;background:#0f172acc;border:1px solid #475569;border-radius:14px;padding:8px}
.bar-bg{height:11px;background:#020617;border:1px solid #334155;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#fb7185,#a78bfa,#22d3ee)}
.combo{position:absolute;top:150px;left:12px;width:135px;text-align:center;background:#0f172acc;border:1px solid #334155;border-radius:18px;padding:5px}
.combo b{font-size:36px}
.combo-warn{position:absolute;top:216px;left:12px;background:#f97316;color:#111827;border-radius:14px;padding:5px 9px;font-size:11px;font-weight:1000;animation:pulse .55s infinite alternate}
.rating{position:absolute;top:260px;left:50%;transform:translateX(-50%);background:#facc15;color:#111827;border-radius:999px;padding:8px 18px;font-weight:1000;box-shadow:0 8px 24px #0008}
.footer{height:96px;background:#0f172a;border-top:2px solid #334155;display:flex;gap:12px;align-items:center;padding:10px 14px;flex-shrink:0;z-index:20}
.skill-area{flex:1}.skillbar{height:28px;background:#020617;border:2px solid #334155;border-radius:999px;padding:2px;overflow:hidden}
.skill-ready{border-color:#22d3ee!important;animation:pulse .75s infinite alternate;box-shadow:0 0 18px #22d3ee66}
#btnSkill{width:82px;height:66px;border:2px solid #334155;border-radius:18px;background:#1e293b;font-weight:1000}
#btnShuffle{width:66px;height:66px;border-radius:18px;font-size:26px;background:#1e293b;border:2px solid #475569}
.modal{position:absolute;inset:0;background:#020617dc;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.modal-box{width:100%;max-width:380px;max-height:88vh;overflow:auto;background:#1e293b;border:1px solid #64748b;border-radius:28px;padding:20px;box-shadow:0 20px 50px #000;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
.tsum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tsum-cell{height:76px;border-radius:18px;background:#0f172a;border:3px solid #334155;position:relative;display:flex;align-items:center;justify-content:center}
.tsum-cell canvas{width:58px;height:58px}
.locked{opacity:.28;filter:grayscale(1)}
.tabbar{display:flex;gap:6px;margin-bottom:10px}.tabbar button{flex:1;padding:9px;border-radius:12px;background:#334155;font-size:12px;font-weight:900}.tabbar .active{background:#4f46e5}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:10px}
.cut{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#0006}
.cut-inner{width:115%;height:170px;display:flex;align-items:center;justify-content:center;gap:12px;transform:skewX(-12deg);font-size:42px;font-weight:1000;color:white;text-shadow:0 5px 8px #000;animation:cutin 1.15s ease-in-out forwards}
.cut-ss .cut-inner{height:230px;font-size:54px;background:linear-gradient(90deg,transparent,#ef4444,#facc15,#8b5cf6,transparent);box-shadow:0 0 50px #facc15}
.cut-normal .cut-inner{background:linear-gradient(90deg,transparent,#06b6d4,transparent)}
@keyframes cutin{0%{transform:translateX(-110%) skewX(-12deg);opacity:0}15%,82%{transform:translateX(0) skewX(-12deg);opacity:1}100%{transform:translateX(110%) skewX(-12deg);opacity:0}}
.new-record{animation:record 1s infinite alternate}
@keyframes record{from{text-shadow:0 0 10px #facc15;transform:scale(1)}to{text-shadow:0 0 30px #fb7185;transform:scale(1.04)}}
.fever-flash{animation:bgflash .45s infinite alternate}
@keyframes bgflash{from{box-shadow:inset 0 0 60px #fb718588;background:#1e1b4b}to{box-shadow:inset 0 0 130px #a78bfa;background:#581c87}}
textarea{width:100%;min-height:70px;background:#020617;color:#f8fafc;border:1px solid #475569;border-radius:14px;padding:10px;font-size:12px}
.input{width:100%;background:#020617;color:#f8fafc;border:1px solid #475569;border-radius:12px;padding:10px;font-size:12px}
.notice{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:10px;font-size:12px;line-height:1.55}

.canvas-wrap{background:radial-gradient(circle at 50% 18%,#312e81,#111827 58%,#020617)}.hud-left{top:12px;left:10px;min-width:132px;padding:10px 12px;border-radius:20px;background:rgba(15,23,42,.88)}.score{font-size:clamp(24px,7.2vw,34px);letter-spacing:.01em}.hud-right{top:12px;right:10px}.pause{width:46px;height:46px;font-size:21px}.timer{font-size:34px;min-width:78px;text-align:center;padding:4px 18px}.fever-box{top:100px;left:10px;width:152px;padding:9px;border-radius:16px;background:rgba(15,23,42,.88)}.bar-bg{height:13px}.combo{top:164px;left:10px;width:146px;padding:7px;border-radius:20px;background:rgba(15,23,42,.90)}.combo b{font-size:38px}.combo-warn{top:236px;left:10px;font-size:12.5px;padding:7px 10px;border-radius:16px}.rating{font-size:16px;padding:10px 22px;z-index:30}.footer{height:104px;padding:12px 14px;gap:12px;background:linear-gradient(180deg,#111827,#0f172a)}.skill-area .mini{font-size:12px;margin-bottom:4px}.skillbar{height:30px}.skillbar .bar,.bar-bg .bar{transition:width .16s ease-out}#btnSkill{width:88px;height:72px;font-size:14px;border-radius:20px}#btnSkill small{font-size:11px}#btnShuffle{width:70px;height:70px;font-size:28px;border-radius:20px}.modal{padding:14px}.modal-box{max-width:398px;max-height:90vh;padding:22px;border-radius:30px;background:linear-gradient(180deg,#1e293b,#111827);border-color:#94a3b8;line-height:1.65}.modal-box h1,.modal-box h2,.modal-box h3{margin-top:0;line-height:1.25}.modal-box h2{font-size:24px;text-align:center;margin-bottom:14px}.modal-box h3{font-size:16px;margin:16px 0 8px}.modal-box .notice{font-size:14px}.modal-box .btn{font-size:15px;min-height:50px}.list{gap:10px}.list-item{font-size:13.5px;line-height:1.6;padding:12px;border-radius:18px;background:#111827;border-color:#475569}.list-item b{font-size:14.5px}.list-item .mini{font-size:11.5px;color:#cbd5e1}.tsum-grid{gap:12px}.tsum-cell{height:84px;border-radius:20px;border-width:3px}.tsum-cell canvas{width:64px;height:64px}.tabbar button{font-size:13px;min-height:42px}.cut-inner{font-size:42px;text-align:center}.cut-ss .cut-inner{font-size:46px}textarea,.input{font-size:13px;line-height:1.6;min-height:82px;border-color:#64748b}.new-record{animation:record 0.8s infinite alternate}
@media(max-width:380px){
  .top{height:60px;padding:0 8px}.pill{font-size:12.5px;padding:5px 8px}.logo b{font-size:19px}.logo small{font-size:8.5px}.small-btn{font-size:12px;padding:9px 9px}.home-head{padding:15px 12px}.big-score{font-size:32px}.section{margin:12px 10px;padding:13px}.notice{font-size:12.5px}.play-btn{font-size:28px}.grid2{gap:9px}.footer{height:100px;padding:10px}.hud-left{min-width:118px}.score{font-size:24px}.timer{font-size:30px}.fever-box{width:136px}.combo{width:132px}.modal-box{padding:18px}.modal-box h2{font-size:22px}.tsum-grid{gap:9px}.tsum-cell{height:78px}

<body>
<div id="app">
  <div class="top">
    <div class="pill">❤️ <span id="heartCount">5/5</span> <small id="heartTimer">MAX</small></div>
    <div class="logo"><small>V8 UI STABLE</small><b>トイパズ！</b></div>
    <div class="pill">🪙 <span id="coinCount">0</span></div>
  </div>

  <div id="home" class="view scroll">
    <div class="home-head">
      <div class="row">
        <div><div class="mini">ハイスコア</div><div id="homeHigh" class="big-score">0</div></div>
        <div style="display:flex;gap:8px">
          <button class="small-btn" id="btnCodex">📘 図鑑</button>
          <button class="small-btn" id="btnRanking">🏆 ランキング</button>
          <button class="small-btn" id="btnSettings">⚙️ 設定</button>
        </div>
      </div>
    </div>
    <div class="my-wrap">
      <div class="my-tsum" id="btnTsumSelect" data-clickable="true">
        <div id="myBg" style="position:absolute;inset:0;opacity:.38"></div>
        <canvas id="myCanvas" width="140" height="140"></canvas>
        <div id="myRank" class="badge badge-rank">C</div>
        <div id="myLv" class="badge badge-lv">Lv.1</div>
      </div>
      <span class="change">ツム変更</span>
      <button class="btn btn-main play-btn" id="btnPlay">プレイ ▶</button>
    </div>

    <div class="section card">
      <div class="row"><div class="section-title">おすすめ</div><span class="mini">初心者向け</span></div>
      <div id="recommendBox" class="notice">---</div>
    </div>

    <div class="section card">
      <div class="row"><div class="section-title">デイリーミッション</div><b id="dailyStatus" class="mini">挑戦中</b></div>
      <div id="dailyMission" class="notice">---</div>
    </div>

    <div class="section card">
      <div class="row"><div class="section-title">ウィークリーミッション</div><b id="weeklyStatus" class="mini">挑戦中</b></div>
      <div id="weeklyMission" class="notice">---</div>
    </div>

    <div class="section card">
      <div class="row">
        <div><div class="section-title">🎁 プレミアムBOX</div><div class="mini">チケットでも引けます / SSランク天井あり</div></div>
        <div class="mini">🎫 <span id="ticketCount">0</span></div>
      </div>
      <div class="grid2">
        <button class="btn btn-gold" id="btnGacha1">1回<br><small>🪙1000 / 🎫1</small></button>
        <button class="btn btn-blue" id="btnGacha10">10連<br><small>🪙10000 / 🎫10</small></button>
      </div>
      <div id="pityText" class="mini" style="margin-top:8px">---</div>
    </div>

    <div class="section card">
      <div class="section-title">イベント</div>
      <div id="eventBox" class="notice">---</div>
      <button class="btn btn-blue" id="btnEventGacha" style="width:100%;margin-top:10px">イベントBOXを引く</button>
    </div>

    <div class="section card">
      <div class="section-title">ボスステージ風 特別ミッション</div>
      <div class="notice">1プレイでボスHPを削る特別チャレンジ。高スコアほど大ダメージ！</div>
      <button class="btn btn-green" id="btnBoss" style="width:100%;margin-top:10px">ボスミッションに挑戦</button>
    </div>
  </div>

  <div id="shop" class="view hidden">
    <div class="home-head"><h2 style="text-align:center;margin:0">アイテム選択</h2><div class="mini" style="text-align:center">おすすめアイテムも表示</div></div>
    <div class="scroll" style="padding:14px;flex:1"><div id="shopItems" class="list"></div></div>
    <div class="footer">
      <button class="btn" id="btnShopBack" style="flex:1">キャンセル</button>
      <button class="btn btn-main" id="btnStart" style="flex:1">スタート！</button>
    </div>
  </div>

  <div id="game" class="view hidden">
    <div id="cutin" class="cut hidden"><div class="cut-inner"><span id="cutEmoji">🐭</span><span id="cutText">スキル!</span></div></div>

      <div class="hud-right"><button class="pause" id="btnPause">⏸</button><div id="timer" class="timer">60</div></div>

      <div id="comboBox" class="combo hidden"><b id="comboNum">0</b><div class="mini" style="color:#facc15">コンボ</div></div>

      <div id="rating" class="rating hidden">GREAT!</div>
    </div>
    <div class="footer">
      <button id="btnShuffle">🌪️</button>
      <div class="skill-area"><div class="mini">スキル Lv.<span id="skillLevelHud">1</span></div><div class="skillbar"><div id="skillBar" class="bar"></div></div></div>
      <button id="btnSkill" disabled><span id="skillEmoji">🐭</span><br><small>発動</small></button>
    </div>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const SAVE_KEYS = ["toy_puzzle_v7_feature_stable","tsum_save_v6_stable","tsum_save_v5"];
const SAVE_KEY = SAVE_KEYS[0];
const W=400,H=500,R=24,HEART_MAX=5,RECOVER_MS=60*1000,SKILL_MAX=40;
let Engine,World,Bodies,Body;
const rand = n => Math.floor(Math.random()*n);
const fmt = n => Math.floor(n||0).toLocaleString();
const today = () => {const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
const weekKey = () => {const d=new Date();const onejan=new Date(d.getFullYear(),0,1);const w=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);return `${d.getFullYear()}-W${w}`};
const seasonName = () => {const m=new Date().getMonth()+1;if([12,1,2].includes(m))return"クリスマス＆ウィンター";if([3,4,5].includes(m))return"スプリング";if([6,7,8].includes(m))return"夏祭り";return"ハロウィン";};
const seasonTag = () => {const m=new Date().getMonth()+1;if([12,1,2].includes(m))return"winter";if([3,4,5].includes(m))return"spring";if([6,7,8].includes(m))return"summer";return"halloween";};

function loadUser(){
  user=null;
  for(const k of SAVE_KEYS){try{const s=localStorage.getItem(k);if(s){user=JSON.parse(s);break}}catch(e){}}
  user={...clone(defaultUser),...(user||{})};
  user.settings={...defaultUser.settings,...(user.settings||{})};
  user.login={...defaultUser.login,...(user.login||{})};
  user.pity={...defaultUser.pity,...(user.pity||{})};
  user.unlockedTsums=[...new Set(user.unlockedTsums||[0,1])].filter(id=>ALL_TSUMS.some(t=>t.id===id));
  if(!user.unlockedTsums.includes(user.myTsumId))user.myTsumId=user.unlockedTsums[0]||0;
  if(!user.friendCode)user.friendCode=makeFriendCode();
  refreshDailyWeekly();
  recoverHeart();
  checkLoginBonus();
  save(false);renderHome();
}

 if(!user.daily||user.daily.date!==today())user.daily={date:today(),id:rand(DAILY_MISSIONS.length),cleared:false};
 if(!user.weekly||user.weekly.week!==weekKey())user.weekly={week:weekKey(),id:rand(WEEKLY_MISSIONS.length),cleared:false,progress:{score:0,clear:0,fever:0,boss:0}};
}
function recoverHeart(){if(user.hearts>=HEART_MAX)return false;const p=Date.now()-user.lastHeartTime;if(p<RECOVER_MS)return false;const c=Math.floor(p/RECOVER_MS);user.hearts=Math.min(HEART_MAX,user.hearts+c);user.lastHeartTime=user.hearts>=HEART_MAX?Date.now():user.lastHeartTime+c*RECOVER_MS;return true}
function checkLoginBonus(){
 if(user.login.last===today())return;
 const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
 const y=`${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
 user.login.streak=(user.login.last===y)?(user.login.streak||0)+1:1;user.login.last=today();
 const coins=300+Math.min(user.login.streak,7)*50;
 let tickets=0;if(user.login.streak%3===0)tickets++;if(user.login.streak%7===0)tickets+=2;
 user.coins+=coins;user.tickets+=tickets;
 setTimeout(()=>showModal(`<h2>ログインボーナス</h2><div class="notice">連続ログイン ${user.login.streak}日目！<br>🪙 ${coins}枚${tickets?`<br>🎫 ${tickets}枚`:``}</div><button class="btn btn-main" onclick="closeModal()" style="width:100%;margin-top:12px">OK</button>`),300);
}

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=((n>>8)&255)+p,b=(n&255)+p;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return`rgb(${r},${g},${b})`}
function oval(d,x,y,rx,ry,rot,col){d.save();d.translate(x,y);d.rotate(rot);d.beginPath();d.ellipse(0,0,rx,ry,0,0,Math.PI*2);d.fillStyle=col;d.fill();d.restore()}
function drawToy(d,t,x,y,r,a=0,sel=false,alpha=1,lvl=1){
 d.save();d.globalAlpha=alpha;d.translate(x,y);d.rotate(a);
 const col=t.color,light=shade(col,35),dark=shade(col,-30);
 if(lvl>=10){d.shadowBlur=18;d.shadowColor=rankColor(t.rank);d.beginPath();d.arc(0,0,r+7,0,Math.PI*2);d.fillStyle=rankColor(t.rank)+"55";d.fill();d.shadowBlur=0}
 if(t.ear==="bunny"){oval(d,-r*.42,-r*.95,r*.22,r*.62,-.25,dark);oval(d,r*.42,-r*.95,r*.22,r*.62,.25,dark);oval(d,-r*.42,-r*.95,r*.1,r*.4,-.25,"#ffd6e7");oval(d,r*.42,-r*.95,r*.1,r*.4,.25,"#ffd6e7")}
 else if(t.ear==="point"){d.fillStyle=dark;d.beginPath();d.moveTo(-r*.55,-r*.55);d.lineTo(-r*.2,-r*.9);d.lineTo(-r*.1,-r*.42);d.fill();d.beginPath();d.moveTo(r*.55,-r*.55);d.lineTo(r*.2,-r*.9);d.lineTo(r*.1,-r*.42);d.fill()}
 else{d.fillStyle=dark;d.beginPath();d.arc(-r*.52,-r*.55,r*.25,0,Math.PI*2);d.fill();d.beginPath();d.arc(r*.52,-r*.55,r*.25,0,Math.PI*2);d.fill()}
 d.shadowBlur=sel?20:8;d.shadowColor=sel?"#fff":"#0008";const g=d.createRadialGradient(-r*.25,-r*.28,r*.1,0,0,r*1.1);g.addColorStop(0,light);g.addColorStop(.72,col);g.addColorStop(1,dark);d.beginPath();d.arc(0,0,r,0,Math.PI*2);d.fillStyle=g;d.fill();d.shadowBlur=0;d.lineWidth=sel?4:2;d.strokeStyle=sel?"#fff":"#ffffff66";d.stroke();
 d.fillStyle="#111827";d.beginPath();d.ellipse(-r*.24,-r*.08,r*.08,r*.11,0,0,Math.PI*2);d.fill();d.beginPath();d.ellipse(r*.24,-r*.08,r*.08,r*.11,0,0,Math.PI*2);d.fill();d.fillStyle="#fff";d.beginPath();d.arc(-r*.27,-r*.12,r*.025,0,Math.PI*2);d.fill();d.beginPath();d.arc(r*.21,-r*.12,r*.025,0,Math.PI*2);d.fill();d.fillStyle="#fda4afaa";d.beginPath();d.arc(-r*.42,r*.12,r*.1,0,Math.PI*2);d.fill();d.beginPath();d.arc(r*.42,r*.12,r*.1,0,Math.PI*2);d.fill();d.strokeStyle="#111827";d.lineWidth=2;d.beginPath();d.arc(0,r*.18,r*.12,.2*Math.PI,.8*Math.PI);d.stroke();
 d.font=`${Math.max(12,r*.48)}px system-ui`;d.textAlign="center";d.textBaseline="middle";d.fillText(t.emoji,0,-r*.42);d.restore();
}

function useGachaCost(n){if(user.tickets>=n){user.tickets-=n;return true}const cost=n*1000;if(user.coins>=cost){user.coins-=cost;return true}return false}
function gachaOne(eventOnly=false,forcedSS=false){
 let pool=ALL_TSUMS.filter(t=>!t.limited||t.event===seasonTag()||isUnlocked(t.id));
 if(eventOnly)pool=ALL_TSUMS.filter(t=>t.event===seasonTag()||(!t.limited&&["A","S","SS"].includes(t.rank)));
 if(forcedSS)pool=pool.filter(t=>t.rank==="SS");
 const weights={SS:8,S:15,A:25,B:32,C:20};let total=pool.reduce((s,t)=>s+(weights[t.rank]||10),0),roll=Math.random()*total;
 for(const t of pool){roll-=weights[t.rank]||10;if(roll<=0)return t}return pool[pool.length-1];
}
function runGacha(n=1,eventOnly=false){
 if(!useGachaCost(n)){audio.error();alert("コインまたはチケットが足りません");return}
 audio.init();let results=[];for(let i=0;i<n;i++){const forced=(user.pity.ss||0)>=49;const t=gachaOne(eventOnly,forced);results.push(t);user.pity.total++;user.pity.ss=t.rank==="SS"?0:(user.pity.ss||0)+1;if(!isUnlocked(t.id)){user.unlockedTsums.push(t.id);user.tsumLevels[t.id]=1;user.tsumExps[t.id]=0;user.skillLevels[t.id]=1;user.skillExps[t.id]=0}else{addExp(t.id,120);addSkillExp(t.id,1)}}
 save();showGachaResults(results);
}
function addExp(id,amt){user.tsumExps[id]=(user.tsumExps[id]||0)+amt;user.tsumLevels[id]=user.tsumLevels[id]||1;while(user.tsumExps[id]>=user.tsumLevels[id]*150){user.tsumExps[id]-=user.tsumLevels[id]*150;user.tsumLevels[id]++}}
function addSkillExp(id,amt){user.skillExps[id]=(user.skillExps[id]||0)+amt;user.skillLevels[id]=user.skillLevels[id]||1;while(user.skillLevels[id]<6&&user.skillExps[id]>=user.skillLevels[id]*3){user.skillExps[id]-=user.skillLevels[id]*3;user.skillLevels[id]++}}
function showGachaResults(res){
 const best=[...res].sort((a,b)=>rankPower(b.rank)-rankPower(a.rank))[0];
 let html=`<h2>ガチャ結果</h2><div style="text-align:center"><canvas id="gachaBest" width="150" height="150"></canvas><h2 style="color:${rankColor(best.rank)}">${best.emoji} ${best.name}</h2><div class="notice">${best.rank}ランク<br>スキル：${best.skillDesc}</div></div>`;
 if(res.length>1)html+=`<div class="list" style="margin-top:10px">${res.map(t=>`<div class="list-item">${t.emoji} ${t.name} <b style="color:${rankColor(t.rank)}">${t.rank}</b></div>`).join("")}</div>`;
 html+=`<button class="btn btn-main" onclick="closeModal()" style="width:100%;margin-top:12px">OK</button>`;showModal(html);drawTsum($("gachaBest"),best,150,tsumLv(best.id));audio.skill();
}

function startGame(){
 if(!window.Matter){alert("Matter.jsの読み込みに失敗しました。再読み込みしてください。");return}
 Engine=Matter.Engine;World=Matter.World;Bodies=Matter.Bodies;Body=Matter.Body;
 const cost=selectedBoosters.reduce((s,x)=>s+BOOSTERS.find(y=>y.id===x).cost,0);if(user.coins<cost){alert("コインが足りません");return}if(user.hearts<=0){alert("ハートが足りません");return}
 user.coins-=cost;user.hearts--;if(user.hearts===HEART_MAX-1)user.lastHeartTime=Date.now();save();
 $("shop").classList.add("hidden");$("game").classList.remove("hidden");resetGame();initPhysics();isPlaying=true;isPaused=false;raf=requestAnimationFrame(loop);
}
function resetGame(){score=0;coinsEarned=0;timeLeft=selectedBoosters.includes("time")?65:60;if(bossMode)timeLeft+=10;combo=0;maxCombo=0;lastClear=0;feverGauge=0;isFever=false;feverLeft=0;skillGauge=0;activeBonus=false;feverBgmTimer=0;stats={fever:0,bombs:0,cleared:0,bossDamage:0};chain=[];dragging=false;particles=[];ripples=[];lastTick=0;acc=0;$("gameScore").textContent="0";$("timer").textContent=timeLeft;$("feverBar").style.width="0%";$("skillBar").style.width="0%";$("comboBox").classList.add("hidden");$("comboWarn").classList.add("hidden");$("btnSkill").disabled=true;$("btnSkill").classList.remove("skill-ready");$("game").classList.remove("fever-flash");$("skillEmoji").textContent=getTsum(user.myTsumId).emoji;$("skillLevelHud").textContent=skillLv()}
function initPhysics(){clearPhysics(false);engine=Engine.create({gravity:{y:1.45},positionIterations:6,velocityIterations:5});world=engine.world;const opt={isStatic:true};World.add(world,[Bodies.rectangle(W/2,H+35,W+120,70,opt),Bodies.rectangle(-35,H/2,70,H*2,opt),Bodies.rectangle(W+35,H/2,70,H*2,opt)]);activeTypes=[getTsum(user.myTsumId),...ALL_TSUMS.filter(t=>t.id!==user.myTsumId&&!t.limited).sort(()=>Math.random()-.5).slice(0,4)];for(let i=0;i<maxTsums();i++)spawnTsum(36+Math.random()*(W-72),-280+Math.random()*250)}
function clearPhysics(stop=true){if(stop&&raf)cancelAnimationFrame(raf);raf=0;if(engine&&world){try{World.clear(world,false);Engine.clear(engine)}catch(e){}}engine=null;world=null}
function maxTsums(){return user.settings.ultraLight||selectedBoosters.includes("ultra")?32:user.settings.lightMode?38:44}
function spawnTsum(x,y){const t=activeTypes[rand(activeTypes.length)];const b=Bodies.circle(x,y,R,{restitution:.12,friction:.05,density:.001,label:"tsum"});b.tsumType=t;World.add(world,b)}
function spawnBomb(x,y,type="normal"){const b=Bodies.circle(x,y,R*1.3,{restitution:.18,friction:.1,density:.003,label:"bomb"});b.bombType=type;World.add(world,b)}
function refill(){const c=world.bodies.filter(b=>b.label==="tsum"||b.label==="bomb").length;for(let i=0;i<Math.min(maxTsums()-c,3);i++)spawnTsum(40+Math.random()*(W-80),-60-i*34)}
function loop(ts){if(!isPlaying)return;raf=requestAnimationFrame(loop);if(!lastTick)lastTick=ts;const dt=Math.min(40,ts-lastTick);lastTick=ts;if(isPaused)return;acc+=dt;if(acc>=1000){timeLeft--;acc-=1000;$("timer").textContent=timeLeft;if(timeLeft<=0){timeUp();return}}if(isFever){feverLeft-=dt;feverBgmTimer+=dt;$("feverBar").style.width=Math.max(0,feverLeft/10000*100)+"%";if(feverBgmTimer>600){feverBgmTimer=0;audio.tone(500+rand(300),"sine",.06,.035)}if(feverLeft<=0)endFever()}else if(combo>0){const left=3000-(Date.now()-lastClear);$("comboWarn").classList.toggle("hidden",!(left<900&&left>0));if(left<=0){combo=0;$("comboBox").classList.add("hidden");$("comboWarn").classList.add("hidden")}}Engine.update(engine,Math.min(dt,30));if(Math.random()<.14)refill();draw()}
function draw(){ctx.fillStyle=activeBonus?"#2d1b4e":isFever?"#2e1065":"#0f172a";ctx.fillRect(0,0,W,H);const bodies=world.bodies.filter(b=>b.label==="tsum"||b.label==="bomb");for(const b of bodies){const sel=chain.includes(b);if(b.label==="tsum")drawToy(ctx,b.tsumType,b.position.x,b.position.y,R,b.angle,sel,1,tsumLv(b.tsumType.id));else drawBomb(b)}drawChain();drawParticles()}
function drawBomb(b){ctx.save();ctx.translate(b.position.x,b.position.y);let col="#cbd5e1",txt="⭐";if(b.bombType==="score"){col="#facc15";txt="✨"}if(b.bombType==="coin"){col="#f59e0b";txt="🪙"}if(b.bombType==="time"){col="#38bdf8";txt="⏱️"}if(b.bombType==="fever"){col="#ec4899";txt="🔥"}if(b.bombType==="skill"){col="#22d3ee";txt="💠"}if(b.bombType==="mega"){col="#a78bfa";txt="💥"}if(b.bombType==="rainbow"){col="#f0abfc";txt="🌈"}ctx.beginPath();ctx.arc(0,0,R*1.3,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#fff";ctx.stroke();ctx.font="24px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,0,1);ctx.restore()}
function drawChain(){if(chain.length<1)return;const col=chain[0].tsumType.color;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=18;ctx.strokeStyle=col;ctx.globalAlpha=.55;pathChain();ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=7;ctx.strokeStyle="#fff";pathChain();ctx.stroke();ctx.restore()}
function pathChain(){ctx.beginPath();ctx.moveTo(chain[0].position.x,chain[0].position.y);for(let i=1;i<chain.length;i++)ctx.lineTo(chain[i].position.x,chain[i].position.y)}
function burst(x,y,col,c=6){if(user.settings.ultraLight||selectedBoosters.includes("ultra"))return;const max=user.settings.lightMode?25:70;for(let i=0;i<c&&particles.length<max;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,r:2+Math.random()*4,c:col,a:1})}
function drawParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.a-=.05;if(p.a<=0)particles.splice(i,1);else{ctx.save();ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();ctx.restore()}}}

function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function bodyAt(p){const bs=world.bodies.filter(b=>b.label==="tsum"||b.label==="bomb");let best=null,d=1e9;for(let i=bs.length-1;i>=0;i--){const b=bs[i],rr=b.label==="bomb"?R*1.4+8:R+8,dd=Math.hypot(b.position.x-p.x,b.position.y-p.y);if(dd<rr&&dd<d){d=dd;best=b}}return best}
function down(e){if(!isPlaying||isPaused)return;canvas.setPointerCapture?.(e.pointerId);const b=bodyAt(pos(e));if(!b)return;if(b.label==="bomb")explodeBomb(b);else{dragging=true;chain=[b];audio.pop(1)}}
function move(e){if(!isPlaying||isPaused||!dragging||!chain.length)return;const p=pos(e),search=R*2.55,connect=R*3.9;if(chain.length>=2){const prev=chain[chain.length-2];if(Math.hypot(prev.position.x-p.x,prev.position.y-p.y)<search){chain.pop();audio.pop(chain.length);return}}const last=chain[chain.length-1];const cs=world.bodies.filter(b=>b.label==="tsum"&&!chain.includes(b)&&b.tsumType.id===chain[0].tsumType.id&&Math.hypot(b.position.x-p.x,b.position.y-p.y)<search&&Math.hypot(b.position.x-last.position.x,b.position.y-last.position.y)<connect);if(cs.length){cs.sort((a,b)=>Math.hypot(a.position.x-p.x,a.position.y-p.y)-Math.hypot(b.position.x-p.x,b.position.y-p.y));chain.push(cs[0]);audio.pop(chain.length);burst(cs[0].position.x,cs[0].position.y,"#fff",3)}}
function up(e){canvas.releasePointerCapture?.(e.pointerId);if(!isPlaying||isPaused||!dragging)return;dragging=false;if(chain.length>=3){const len=chain.length,last={x:chain[len-1].position.x,y:chain[len-1].position.y};clearTsums([...chain]);const min=selectedBoosters.includes("bomb")?6:7;if(len>=min)spawnBomb(last.x,last.y,pickBomb(len))}chain=[]}
function pickBomb(len){const r=Math.random();if(len>=18)return r<.25?"rainbow":r<.5?"mega":r<.75?"time":"skill";if(len>=13)return r<.25?"time":r<.5?"coin":r<.75?"score":"fever";if(len>=10)return r<.34?"time":r<.67?"coin":"score";if(len>=7&&r<.18)return"score";return"normal"}
function clearTsums(arr){const live=arr.filter(b=>world.bodies.includes(b));if(!live.length)return;const n=live.length;stats.cleared+=n;combo++;maxCombo=Math.max(maxCombo,combo);lastClear=Date.now();$("comboBox").classList.remove("hidden");$("comboNum").textContent=combo;
 const my=getTsum(user.myTsumId),lv=tsumLv(),sl=skillLv();let add=Math.floor((n*100+(n-3)*50+combo*12)*({SS:2,S:1.6,A:1.3,B:1.1,C:1}[my.rank]||1)*(1+lv*.05)*(1+sl*.03));if(selectedBoosters.includes("score"))add=Math.floor(add*1.1);if(isFever||activeBonus)add*=3;score+=add;let cc=n>=4?(n-3)*2:0;if(selectedBoosters.includes("coin"))cc=Math.floor(cc*1.1);coinsEarned+=cc;$("gameScore").textContent=fmt(score);
 increaseFever(Math.floor(n*3*(selectedBoosters.includes("fever")?1.2:1)));increaseSkill(live.filter(b=>b.tsumType.id===user.myTsumId).length);if(n>=15)rating("EXCELLENT!!");else if(n>=10)rating("GREAT!");else if(n>=7)rating("GOOD!");
 live.forEach(b=>{burst(b.position.x,b.position.y,b.tsumType.color,3);World.remove(world,b)})}
function explodeBomb(b){if(!world.bodies.includes(b))return;audio.bomb();stats.bombs++;const p={x:b.position.x,y:b.position.y};if(b.bombType==="score")score+=3000;if(b.bombType==="coin")coinsEarned+=20;if(b.bombType==="time")timeLeft+=2;if(b.bombType==="fever")increaseFever(50);if(b.bombType==="skill")increaseSkill(12);if(b.bombType==="rainbow"){score+=5000;increaseFever(70);coinsEarned+=30}const rad=b.bombType==="mega"?R*7:R*4.5;$("gameScore").textContent=fmt(score);$("timer").textContent=timeLeft;World.remove(world,b);burst(p.x,p.y,"#fff",18);const clear=world.bodies.filter(x=>x.label==="tsum"&&Math.hypot(x.position.x-p.x,x.position.y-p.y)<rad);if(clear.length)clearTsums(clear)}
function rating(t){$("rating").textContent=t;$("rating").classList.remove("hidden");setTimeout(()=>$("rating").classList.add("hidden"),1000)}
function increaseFever(v){if(isFever)return;feverGauge=Math.min(100,feverGauge+v);$("feverBar").style.width=feverGauge+"%";if(feverGauge>=100){isFever=true;feverLeft=10000;timeLeft+=5;stats.fever++;$("timer").textContent=timeLeft;$("game").classList.add("fever-flash");rating("フィーバータイム!")}}
function endFever(){isFever=false;feverGauge=0;feverLeft=0;$("feverBar").style.width="0%";$("game").classList.remove("fever-flash")}
function increaseSkill(v){if(v<=0||skillGauge>=SKILL_MAX)return;skillGauge=Math.min(SKILL_MAX,skillGauge+v);$("skillBar").style.width=skillGauge/SKILL_MAX*100+"%";if(skillGauge>=SKILL_MAX){$("btnSkill").disabled=false;$("btnSkill").classList.add("skill-ready")}}
function useSkill(){if(!isPlaying||isPaused||skillGauge<SKILL_MAX)return;skillGauge=0;$("skillBar").style.width="0%";$("btnSkill").disabled=true;$("btnSkill").classList.remove("skill-ready");const t=getTsum(user.myTsumId);showCutin(t);setTimeout(()=>execSkill(t.skillType),420);audio.skill()}
function showCutin(t){$("cutEmoji").textContent=t.emoji;$("cutText").textContent=t.rank==="SS"?`${t.name}!!`:"スキル発動!";$("cutin").className=`cut ${t.rank==="SS"?"cut-ss":"cut-normal"}`;setTimeout(()=>$("cutin").classList.add("hidden"),1150)}
function execSkill(type){if(!world)return;const cx=W/2,cy=H/2+20,ts=world.bodies.filter(b=>b.label==="tsum"),sl=skillLv();let clear=[];const bonus=1+(sl-1)*.08;switch(type){case"center":clear=ts.filter(b=>Math.hypot(b.position.x-cx,b.position.y-cy)<110*bonus);break;case"center_b":clear=ts.filter(b=>Math.hypot(b.position.x-cx,b.position.y-cy)<130*bonus);break;case"time":timeLeft+=3+Math.floor(sl/2);break;case"random_c":clear=ts.sort(()=>Math.random()-.5).slice(0,8+sl);break;case"random_b":clear=ts.sort(()=>Math.random()-.5).slice(0,11+sl);break;case"random_a":clear=ts.sort(()=>Math.random()-.5).slice(0,14+sl);break;case"random_s":clear=ts.sort(()=>Math.random()-.5).slice(0,18+sl);break;case"horizontal_c":clear=ts.filter(b=>Math.abs(b.position.y-cy)<40*bonus);break;case"vertical_c":clear=ts.filter(b=>Math.abs(b.position.x-cx)<45*bonus);break;case"vertical_b":clear=ts.filter(b=>Math.abs(b.position.x-cx+50)<35*bonus||Math.abs(b.position.x-cx-50)<35*bonus);break;case"vertical_a":clear=ts.filter(b=>Math.abs(b.position.x-cx)<70*bonus);break;case"bottom_c":clear=ts.filter(b=>b.position.y>H-120*bonus);break;case"slash_b":clear=ts.filter(b=>Math.abs(b.position.x-b.position.y)<50*bonus);break;case"fever_charge":increaseFever(30+sl*5);break;case"bomb":spawnBomb(cx,cy-50,sl>=4?"mega":"normal");break;case"bomb2":spawnBomb(cx-50,cy-50);spawnBomb(cx+50,cy-50,sl>=3?"skill":"normal");break;case"cross_a":clear=ts.filter(b=>Math.abs(b.position.x-b.position.y)<40*bonus||Math.abs(b.position.x-(H-b.position.y))<40*bonus);break;case"big_bomb":spawnBomb(cx-50,cy-50,"score");spawnBomb(cx+50,cy-50,"fever");break;case"rainbow_fever":activeBonus=true;$("game").classList.add("fever-flash");setTimeout(()=>{activeBonus=false;if(!isFever)$("game").classList.remove("fever-flash")},15000);break;case"coin_grab":coinsEarned+=200+rand(300)+sl*20;rating("コインGET!");break;case"coin_boost_s":coinsEarned+=50+sl*20;break;case"clear_one_type":if(ts.length){const id=ts[rand(ts.length)].tsumType.id;clear=ts.filter(b=>b.tsumType.id===id)}break;case"phoenix_megablast":clear=ts.filter(b=>Math.hypot(b.position.x-cx,b.position.y-cy)<185*bonus);break;case"dark_obliterate":clear=ts.sort(()=>Math.random()-.5).slice(0,28+sl);break;case"star_time_ss":timeLeft+=5+sl;spawnBomb(cx-40,cy-50,"time");spawnBomb(cx+40,cy-50,"time");break;case"dragon_slash":clear=ts.filter(b=>Math.abs(b.position.x-b.position.y)<60*bonus||Math.abs(b.position.x-(H-b.position.y))<60*bonus);break;case"phoenix_wings":clear=ts.filter(b=>b.position.y<150*bonus||b.position.y>H-150*bonus);break;case"festival_fire":spawnBomb(cx,cy,"mega");spawnBomb(cx-60,cy-30,"score");spawnBomb(cx+60,cy-30,"fever");break;case"winter_freeze":timeLeft+=2+sl;spawnBomb(cx,cy-60,"time");break;case"spring_bloom":clear=ts.filter(b=>Math.abs(b.position.y-(cy-50))<55*bonus||Math.abs(b.position.y-(cy+50))<35*bonus);break;case"halloween_burst":clear=ts.filter(b=>Math.hypot(b.position.x-cx,b.position.y-cy)<155*bonus);break}if(clear.length)clearTsums(clear);$("timer").textContent=timeLeft}
function shuffle(){if(!isPlaying||isPaused)return;world.bodies.filter(b=>b.label==="tsum"||b.label==="bomb").forEach(b=>Body.applyForce(b,b.position,{x:(Math.random()-.5)*.08,y:-.1-Math.random()*.12}));audio.pop(1)}
function pause(){if(!isPlaying)return;isPaused=true;showModal(`<h2>一時停止</h2><button class="btn btn-green" onclick="resumeGame()" style="width:100%">▶ 再開</button><button class="btn" onclick="quitGame()" style="width:100%;margin-top:10px">ホームへ戻る</button>`)}
window.resumeGame=()=>{isPaused=false;lastTick=performance.now();closeModal()}
window.quitGame=()=>{finishGame(false)}
function timeUp(){isPlaying=false;finishGame(true)}
function finishGame(showResult=true){isPlaying=false;clearPhysics();const myId=user.myTsumId;addExp(myId,100);const st=user.tsumStats[myId]||{uses:0,best:0};st.uses++;st.best=Math.max(st.best,score);user.tsumStats[myId]=st;const newHigh=score>user.highScore;if(newHigh)user.highScore=score;user.coins+=coinsEarned;updateMissions();if(bossMode){stats.bossDamage=Math.floor(score/1000);if(stats.bossDamage>=100){user.weekly.progress.boss=(user.weekly.progress.boss||0)+1;user.bossClearedWeek=weekKey()}}save();if(!showResult){closeModal();$("game").classList.add("hidden");$("home").classList.remove("hidden");bossMode=false;return}
 const t=getTsum(myId);let cls=newHigh?"new-record":"";showModal(`<h2 class="${cls}" style="text-align:center;color:#facc15">リザルト</h2><div style="text-align:center"><canvas id="resTsum" width="90" height="90"></canvas><h1>${fmt(score)}</h1>${newHigh?`<div class="notice" style="border-color:#facc15">ハイスコア更新!!</div>`:""}</div><div class="grid2" style="margin-top:10px"><div class="list-item"><b>獲得コイン</b><br>🪙 ${fmt(coinsEarned)}</div><div class="list-item"><b>最大コンボ</b><br>${maxCombo}</div><div class="list-item"><b>フィーバー</b><br>${stats.fever}回</div><div class="list-item"><b>消去ツム数</b><br>${stats.cleared}</div></div>${bossMode?`<div class="notice" style="margin-top:10px">ボスダメージ：${stats.bossDamage}<br>${stats.bossDamage>=100?"ボス撃破！週間進捗に追加":"あと少し！"}</div>`:""}<button class="btn btn-main" onclick="resultHome()" style="width:100%;margin-top:12px">ホームへ</button><button class="btn btn-blue" onclick="resultRetry()" style="width:100%;margin-top:10px">もう一度</button>`);drawTsum($("resTsum"),t,90,tsumLv(myId));bossMode=false}
function updateMissions(){
 const dm=DAILY_MISSIONS[user.daily.id]||DAILY_MISSIONS[0];const val={score,combo:maxCombo,fever:stats.fever,bomb:stats.bombs,clear:stats.cleared,coins:coinsEarned}[dm.type]||0;if(!user.daily.cleared&&val>=dm.target){user.daily.cleared=true;user.coins+=dm.reward}
 const p=user.weekly.progress;p.score=(p.score||0)+score;p.clear=(p.clear||0)+stats.cleared;p.fever=(p.fever||0)+stats.fever;const wm=WEEKLY_MISSIONS[user.weekly.id]||WEEKLY_MISSIONS[0];if(!user.weekly.cleared&&(p[wm.type]||0)>=wm.target){user.weekly.cleared=true;user.coins+=wm.reward}
 const wk=weekKey();user.weeklyScores=user.weeklyScores||[];const cur=user.weeklyScores.find(x=>x.code===user.friendCode&&x.week===wk);if(cur)cur.score=Math.max(cur.score,score,user.highScore);else user.weeklyScores.push({name:"あなた",code:user.friendCode,score:Math.max(score,user.highScore),week:wk});
}
window.resultHome=()=>{closeModal();$("game").classList.add("hidden");$("home").classList.remove("hidden");renderHome()}
window.resultRetry=()=>{closeModal();$("game").classList.add("hidden");showShop()}



/* V8 UI READABILITY PATCH: 補助ラベル */
function applyReadableUiHints(){
  const labels = [
    ["btnCodex","ツム図鑑を開く"],["btnRanking","週間ランキングとセーブコードを開く"],["btnSettings","設定を開く"],
    ["btnPlay","プレイ前ショップへ進む"],["btnGacha1","ガチャを1回引く"],["btnGacha10","ガチャを10回引く"],
    ["btnEventGacha","イベントBOXを引く"],["btnBoss","ボスミッションを始める"],["btnShopBack","ホームへ戻る"],
    ["btnStart","ゲームを開始する"],["btnPause","一時停止"],["btnShuffle","ツムをシャッフル"],["btnSkill","スキルを発動"]
  ];
  labels.forEach(([id,label])=>{const el=$(id);if(el){el.setAttribute("aria-label",label);el.setAttribute("title",label)}});
}

function bind(){
 let sx=0,sy=0,moved=false;$("app").addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;moved=false},true);$("app").addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>12)moved=true},true);$("app").addEventListener("click",e=>{if(moved&&e.target.closest("button,[data-clickable='true']")){e.preventDefault();e.stopImmediatePropagation()}},true);
 $("btnSettings").onclick=showSettings;$("btnCodex").onclick=showCodex;$("btnRanking").onclick=showRanking;$("btnTsumSelect").onclick=showTsumSelect;$("btnPlay").onclick=()=>{bossMode=false;if(!user.tutorialDone){user.tutorialDone=true;save(false);showModal(`<h2>遊び方</h2><div class="notice">同じツムを3個以上なぞって消します。7個以上つなぐとボムが出ます。フィーバー中はスコア3倍です。</div><button class="btn btn-main" onclick="closeModal();showShop()" style="width:100%;margin-top:12px">はじめる</button>`)}else showShop()};
 window.showShop=showShop;$("btnBoss").onclick=startBoss;$("btnEventGacha").onclick=()=>runGacha(1,true);$("btnGacha1").onclick=()=>runGacha(1,false);$("btnGacha10").onclick=()=>runGacha(10,false);$("btnShopBack").onclick=backHome;$("btnStart").onclick=startGame;$("btnPause").onclick=pause;$("btnShuffle").onclick=shuffle;$("btnSkill").onclick=useSkill;canvas.addEventListener("pointerdown",down);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);document.addEventListener("visibilitychange",()=>{if(document.hidden&&isPlaying&&!isPaused)pause()});}
bind();loadUser();applyReadableUiHints();setInterval(()=>{refreshDailyWeekly();if(recoverHeart())save(false);renderHome()},1000);
})();
</script>
