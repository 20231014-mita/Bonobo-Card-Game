<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ツムツム風パズル - Advanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #0f172a;
        }
        canvas { touch-action: none; }
        .fever-bg {
            animation: discoBg 1s infinite alternate;
        }
        @keyframes discoBg {
            0% { box-shadow: inset 0 0 50px rgba(236, 72, 153, 0.5); }
            100% { box-shadow: inset 0 0 50px rgba(168, 85, 247, 0.8); }
        }
        .combo-pop {
            animation: popText 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popText {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* スクロールバー非表示 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden text-slate-100">

    <!-- アプリコンテナ -->
    <div id="app-container" class="w-full h-full sm:w-[400px] sm:h-[700px] sm:rounded-[40px] sm:border-[8px] border-slate-800 bg-slate-900 relative overflow-hidden shadow-2xl flex flex-col">

            <!-- ハート -->

                <span class="text-rose-500 text-xl">❤️</span>
                <span id="heart-count" class="font-bold text-lg">5/5</span>
                <span id="heart-timer" class="text-xs text-slate-400 font-mono w-8 text-right">0:00</span>
            </div>
            <!-- コイン -->
            <div class="flex items-center space-x-2 bg-slate-700 rounded-full px-3 py-1 border border-slate-600">
                <span class="text-yellow-400 text-xl">🪙</span>
                <span id="coin-count" class="font-bold text-lg tabular-nums">0</span>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 画面1: ホーム画面 -->
        <!-- ========================================== -->
        <div id="view-home" class="flex-grow flex flex-col bg-slate-900 relative z-40 overflow-y-auto pb-6">
            <!-- プレイヤー情報 -->
            <div class="p-4 bg-gradient-to-b from-slate-800 to-slate-900 shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400">今週のハイスコア</p>
                        <p id="home-highscore" class="text-3xl font-black text-yellow-400 drop-shadow">0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-400">フレンドランキング</p>
                        <p class="text-lg font-bold text-slate-200">👑 1位</p>
                    </div>
                </div>
            </div>

            <!-- マイツム＆スタートボタン -->

                    <div class="w-28 h-28 bg-slate-800 rounded-full flex items-center justify-center border-4 border-slate-600 shadow-xl overflow-hidden relative">

            <!-- 日次ミッション -->

            <!-- BOXガチャ -->

                <div class="flex flex-col items-end pointer-events-auto">

        <!-- ========================================== -->
        <!-- オーバーレイ群 -->
        <!-- ========================================== -->

        <!-- マイツム選択モーダル -->
        <div id="modal-tsum-select" class="absolute inset-0 bg-slate-950/90 z-[60] hidden flex-col items-center justify-center p-4">
            <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-2xl">
                <h2 class="text-xl font-bold text-center mb-4">マイツムを選択</h2>
                <div id="tsum-list" class="grid grid-cols-4 gap-4 mb-6 max-h-[300px] overflow-y-auto p-2">
                    <!-- JSで動的生成 -->

                <button onclick="hideTsumSelect()" class="w-full bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 rounded-xl transition-colors">
                    閉じる

        <!-- ガチャ結果モーダル -->
        <div id="modal-gacha" class="absolute inset-0 bg-slate-950/95 z-[70] hidden flex-col items-center justify-center p-4">
            <h2 class="text-2xl font-black text-yellow-400 mb-8 animate-bounce">BOX OPEN!</h2>
            <div class="w-40 h-40 bg-slate-800 rounded-full flex items-center justify-center border-4 border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.5)] relative overflow-hidden">
                <div id="gacha-bg" class="absolute inset-0 opacity-50"></div>
                <span id="gacha-emoji" class="text-7xl z-10 scale-0 transition-transform duration-500 ease-out">❓</span>
            </div>
            <p id="gacha-name" class="mt-6 text-2xl font-bold text-white opacity-0 transition-opacity duration-500">???</p>
            <p id="gacha-msg" class="mt-2 text-sm text-slate-300 opacity-0 transition-opacity duration-500">新しいツムを解放した！</p>
            <button id="btn-gacha-close" class="mt-12 w-48 bg-slate-700 text-white font-bold py-3 rounded-full opacity-0 transition-opacity duration-500 active:scale-95">
                OK
            </button>
        </div>

        <!-- マジカルタイム（プレイ延長）モーダル -->
        <div id="modal-magical-time" class="absolute inset-0 bg-slate-950/90 z-[60] hidden flex-col items-center justify-center p-4">
            <div class="bg-gradient-to-b from-indigo-900 to-slate-900 w-full max-w-sm rounded-3xl p-6 border-2 border-indigo-500 shadow-2xl text-center">
                <h2 class="text-3xl font-black text-yellow-400 mb-2 italic tracking-wider">MAGICAL TIME</h2>
                <p class="text-sm text-indigo-200 mb-6">あと少しでハイスコア！</p>
                
                <div class="text-5xl mb-6">⏱️ +10s</div>
                
                <div class="space-y-3">
                    <button id="btn-extend-coin" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-900 font-bold text-lg py-4 rounded-xl shadow-lg active:scale-95 flex items-center justify-center space-x-2">
                        <span>🪙 300コインで延長</span>
                    </button>
                    <button id="btn-extend-giveup" class="w-full bg-slate-700 text-slate-300 font-bold py-3 rounded-xl active:scale-95">
                        あきらめる
                    </button>
                </div>
            </div>
        </div>

        <!-- リザルト画面 -->
        <div id="modal-result" class="absolute inset-0 bg-slate-950/95 z-[60] hidden flex-col items-center justify-center p-6">
            <h2 class="text-4xl font-black text-white mb-8 tracking-widest drop-shadow-md">RESULT</h2>
            
            <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-600 shadow-xl space-y-6 text-center">
                <div>
                    <p class="text-sm text-slate-400 font-bold">SCORE</p>
                    <p id="result-score" class="text-5xl font-black text-yellow-400">0</p>
                    <p id="result-highscore-label" class="text-xs font-bold text-rose-400 mt-1 hidden">NEW HIGH SCORE!</p>
                </div>
                
                <div class="grid grid-cols-2 gap-4 border-t border-slate-700 pt-6">
                    <div>
                        <p class="text-xs text-slate-400">獲得コイン</p>
                        <p class="text-xl font-bold text-white flex justify-center items-center gap-1">
                            <span class="text-yellow-400">🪙</span> <span id="result-coins">0</span>
                        </p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">最大コンボ</p>
                        <p class="text-xl font-bold text-white" id="result-max-combo">0</p>
                    </div>
                </div>
            </div>

            <button onclick="returnToHome()" class="mt-8 w-48 bg-white text-slate-900 font-black text-xl py-4 rounded-full shadow-lg active:scale-95 transition-transform">
                OK
            </button>
        </div>

    </div>

    <!-- Web Audio API (効果音) -->
    <script>
        class SFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            // ピッチを変えながら鳴らすポップ音
            playPop(chainLen) {
                this.init(); if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const now = this.ctx.currentTime;
                // チェーンが長いほど高い音に
                const pitch = 300 + (chainLen * 50);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.5, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.05);
            }

            // ボム爆発音
            playBomb() {
                this.init(); if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const now = this.ctx.currentTime;
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.2);
            }

            // スキル発動音
            playSkill() {
                this.init(); if(!this.ctx) return;
                const now = this.ctx.currentTime;
                [400, 600, 800].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.1, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                });
            }
        }
        const sfx = new SFX();
    </script>

    <!-- メインロジック -->
    <script>
        // === マスターデータ ===
        const ALL_TSUMS = [
            { id: 0, name: 'ミケネコ', emoji: '🐈', color: '#f59e0b', bg: 'bg-amber-500' },
            { id: 1, name: 'うさぎ', emoji: '🐰', color: '#f472b6', bg: 'bg-pink-400' },
            { id: 2, name: 'くま', emoji: '🐻', color: '#78350f', bg: 'bg-amber-900' },
            { id: 3, name: 'パンダ', emoji: '🐼', color: '#e2e8f0', bg: 'bg-slate-200' },
            { id: 4, name: 'かえる', emoji: '🐸', color: '#22c55e', bg: 'bg-green-500' },
            { id: 5, name: 'キツネ', emoji: '🦊', color: '#ea580c', bg: 'bg-orange-600' },
            { id: 6, name: 'ペンギン', emoji: '🐧', color: '#0ea5e9', bg: 'bg-sky-500' },
            { id: 7, name: 'ライオン', emoji: '🦁', color: '#eab308', bg: 'bg-yellow-500' }
        ];

        // === ユーザーデータ (localStorage) ===
        let user = {
            coins: 1500, // 初期ボーナス
            hearts: 5,
            lastHeartTime: Date.now(),
            myTsumId: 0,
            highScore: 0,
            unlockedTsums: [0, 1, 2, 3, 4] // 初期所持
        };

        function loadUser() {
            const saved = localStorage.getItem('tsum_save_v2');
            if (saved) {
                user = { ...user, ...JSON.parse(saved) };
            }
            updateHomeUI();
        }
        
        function saveUser() {
            localStorage.setItem('tsum_save_v2', JSON.stringify(user));
            updateHomeUI();
        }

        // ハートの回復ロジック (テスト用: 1分で1回復)
        const HEART_MAX = 5;
        const RECOVER_MS = 60 * 1000; 

        setInterval(() => {
            if (user.hearts < HEART_MAX) {
                const now = Date.now();
                const passed = now - user.lastHeartTime;
                if (passed >= RECOVER_MS) {
                    const recoverCount = Math.floor(passed / RECOVER_MS);
                    user.hearts = Math.min(HEART_MAX, user.hearts + recoverCount);
                    user.lastHeartTime += recoverCount * RECOVER_MS;
                    saveUser();
                }
            } else {
                user.lastHeartTime = Date.now(); // MAX時はタイマーリセット
            }
            updateHeartTimer();
        }, 1000);

        function updateHeartTimer() {
            document.getElementById('heart-count').innerText = `${user.hearts}/${HEART_MAX}`;
            const timerEl = document.getElementById('heart-timer');
            if (user.hearts >= HEART_MAX) {
                timerEl.innerText = 'MAX';
            } else {
                const remaining = RECOVER_MS - (Date.now() - user.lastHeartTime);
                const secs = Math.ceil(remaining / 1000);
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                timerEl.innerText = `${m}:${s.toString().padStart(2, '0')}`;
            }
        }

        function updateHomeUI() {
            document.getElementById('coin-count').innerText = user.coins;
            document.getElementById('home-highscore').innerText = user.highScore.toLocaleString();
            
            const myTsum = ALL_TSUMS.find(t => t.id === user.myTsumId);
            document.getElementById('home-mytsum-emoji').innerText = myTsum.emoji;
            document.getElementById('home-mytsum-bg').className = `absolute inset-0 opacity-50 ${myTsum.bg}`;
            document.getElementById('skill-mytsum-emoji').innerText = myTsum.emoji;
        }

        // === 画面遷移とUI制御 ===
        const viewHome = document.getElementById('view-home');
        const viewGame = document.getElementById('view-game');
        
        function showTsumSelect() {
            const list = document.getElementById('tsum-list');
            list.innerHTML = '';
            ALL_TSUMS.forEach(t => {
                const isUnlocked = user.unlockedTsums.includes(t.id);
                const div = document.createElement('div');
                div.className = `w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto cursor-pointer border-4 ${user.myTsumId === t.id ? 'border-yellow-400 bg-slate-700' : 'border-slate-600 bg-slate-800'} ${!isUnlocked && 'opacity-30 grayscale pointer-events-none'}`;
                div.innerText = t.emoji;
                if (isUnlocked) {
                    div.onclick = () => {
                        user.myTsumId = t.id;
                        saveUser();
                        hideTsumSelect();
                    };
                }
                list.appendChild(div);
            });
            document.getElementById('modal-tsum-select').classList.remove('hidden');
            document.getElementById('modal-tsum-select').classList.add('flex');
        }
        function hideTsumSelect() {
            document.getElementById('modal-tsum-select').classList.add('hidden');
            document.getElementById('modal-tsum-select').classList.remove('flex');
        }

        // ガチャ
        document.getElementById('btn-gacha').onclick = () => {
            if (user.coins < 1000) { alert('コインが足りません'); return; }
            const locked = ALL_TSUMS.filter(t => !user.unlockedTsums.includes(t.id));
            if (locked.length === 0) { alert('すべてのツムを所持しています'); return; }

            user.coins -= 1000;
            const target = locked[Math.floor(Math.random() * locked.length)];
            user.unlockedTsums.push(target.id);
            saveUser();

            // ガチャ演出
            const modal = document.getElementById('modal-gacha');
            const emoji = document.getElementById('gacha-emoji');
            const name = document.getElementById('gacha-name');
            const msg = document.getElementById('gacha-msg');
            const btn = document.getElementById('btn-gacha-close');
            const bg = document.getElementById('gacha-bg');
            
            emoji.style.transform = 'scale(0)';
            emoji.innerText = '❓';
            bg.className = `absolute inset-0 opacity-50 bg-slate-800`;
            name.style.opacity = '0';
            msg.style.opacity = '0';
            btn.style.opacity = '0';

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => {
                emoji.innerText = target.emoji;
                bg.className = `absolute inset-0 opacity-50 ${target.bg}`;
                emoji.style.transform = 'scale(1.2) rotate(360deg)';
                setTimeout(() => { emoji.style.transform = 'scale(1)'; }, 300);
                name.innerText = target.name;
                name.style.opacity = '1';
                msg.style.opacity = '1';
                btn.style.opacity = '1';
                sfx.playSkill();
            }, 1000);
        };
        document.getElementById('btn-gacha-close').onclick = () => {
            document.getElementById('modal-gacha').classList.add('hidden');
            document.getElementById('modal-gacha').classList.remove('flex');
        };

        // === ゲーム内物理ロジック (Matter.js) ===
        const CANVAS_W = 400;
        const CANVAS_H = 500; // キャンバス領域のみ
        const TSUM_R = 21;
        
        const canvas = document.getElementById('game-canvas');
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;
        const ctx = canvas.getContext('2d');

        const { Engine, World, Bodies, Body, Composite, Events } = Matter;
        let engine, world;
        
        // 状態変数
        let isPlaying = false;
        let score = 0;
        let coinsEarned = 0;
        let timeLeft = 60;
        let gameTimer = null;
        
        let comboCount = 0;
        let maxCombo = 0;
        let lastClearTime = 0;
        
        let feverGauge = 0;
        let isFever = false;
        let feverTimer = null;
        
        let skillGauge = 0;
        const SKILL_MAX = 40; // マイツムを40個消すとスキル
        
        let currentChain = [];
        let isDragging = false;
        let particles = [];
        let activeTsumTypes = []; // 盤面に出る5種類

        function initPhysics() {
            if (engine) Engine.clear(engine);
            engine = Engine.create({ gravity: { y: 1.5, x: 0 } });
            world = engine.world;
            
            const wallOpt = { isStatic: true, friction: 0.1, render: { visible: false } };
            const floor = Bodies.rectangle(CANVAS_W/2, CANVAS_H + 50, CANVAS_W * 2, 100, wallOpt);
            const lWall = Bodies.rectangle(-50, CANVAS_H/2, 100, CANVAS_H * 2, wallOpt);
            const rWall = Bodies.rectangle(CANVAS_W + 50, CANVAS_H/2, 100, CANVAS_H * 2, wallOpt);
            World.add(world, [floor, lWall, rWall]);

            // 盤面に出る5種類を選ぶ (マイツム + 4種ランダム)
            activeTsumTypes = [ALL_TSUMS.find(t=>t.id === user.myTsumId)];
            const others = ALL_TSUMS.filter(t => t.id !== user.myTsumId);
            others.sort(() => Math.random() - 0.5);
            activeTsumTypes.push(...others.slice(0, 4));
        }

        function spawnTsum(x, y) {
            const type = activeTsumTypes[Math.floor(Math.random() * activeTsumTypes.length)];
            const body = Bodies.circle(x, y, TSUM_R, {
                restitution: 0.2, friction: 0.05, density: 0.001, label: 'tsum'
            });
            body.tsumType = type;
            World.add(world, body);
        }

        function spawnBomb(x, y) {
            const body = Bodies.circle(x, y, TSUM_R * 1.2, {
                restitution: 0.5, friction: 0.1, density: 0.005, label: 'bomb'
            });
            World.add(world, body);
        }

        function refillTsums() {
            const count = world.bodies.filter(b => b.label === 'tsum' || b.label === 'bomb').length;
            const needed = 45 - count;
            for(let i=0; i<needed; i++) {
                spawnTsum(40 + Math.random()*(CANVAS_W-80), -100 - i*25);
            }
        }

        // === 描画ループ ===
        function drawLoop() {
            if (!isPlaying) return;
            Engine.update(engine, 1000/60);
            
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // コンボ切れ判定 (3秒)
            if (!isFever && comboCount > 0 && Date.now() - lastClearTime > 3000) {
                comboCount = 0;
                document.getElementById('combo-display').classList.add('hidden');
            }

            // オブジェクト描画
            const bodies = world.bodies.filter(b => b.label === 'tsum' || b.label === 'bomb');
            bodies.forEach(b => {
                ctx.save();
                ctx.translate(b.position.x, b.position.y);
                ctx.rotate(b.angle);
                
                if (b.label === 'tsum') {
                    // シャドウ
                    ctx.beginPath(); ctx.arc(1, 2, TSUM_R, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
                    // 本体
                    ctx.beginPath(); ctx.arc(0, 0, TSUM_R, 0, Math.PI*2);
                    ctx.fillStyle = b.tsumType.color; ctx.fill();
                    // 絵文字
                    ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(b.tsumType.emoji, 0, 1);
                } else if (b.label === 'bomb') {
                    // ボム
                    ctx.beginPath(); ctx.arc(0, 0, TSUM_R*1.2, 0, Math.PI*2);
                    ctx.fillStyle = '#cbd5e1'; ctx.fill();
                    ctx.lineWidth = 3; ctx.strokeStyle = '#334155'; ctx.stroke();
                    ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', 0, 1);
                }
                ctx.restore();
            });

            // なぞり線描画
            if (currentChain.length > 0) {
                ctx.save();
                ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = currentChain[0].tsumType.color;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(currentChain[0].position.x, currentChain[0].position.y);
                for(let i=1; i<currentChain.length; i++) ctx.lineTo(currentChain[i].position.x, currentChain[i].position.y);
                ctx.stroke();
                ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.globalAlpha = 1; ctx.stroke();
                ctx.restore();
            }

            // パーティクル
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                if(p.alpha <= 0) particles.splice(i, 1);
                else {
                    ctx.save(); ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = p.c; ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(drawLoop);
        }

        // === インタラクション ===
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (CANVAS_W/rect.width), y: (clientY - rect.top) * (CANVAS_H/rect.height) };
        }

        function getBodyAt(pos) {
            return world.bodies.find(b => {
                if (b.label !== 'tsum' && b.label !== 'bomb') return false;
                return Math.hypot(b.position.x - pos.x, b.position.y - pos.y) <= (b.label==='bomb' ? TSUM_R*1.2+5 : TSUM_R+5);
            });
        }

        canvas.addEventListener('pointerdown', e => {
            if(!isPlaying) return;
            const b = getBodyAt(getPos(e));
            if(b) {
                if (b.label === 'bomb') {
                    explodeBomb(b);
                } else {
                    isDragging = true;
                    currentChain = [b];
                    sfx.playPop(1);
                }
            }
        });

        canvas.addEventListener('pointermove', e => {
            if(!isPlaying || !isDragging || currentChain.length===0) return;
            const b = getBodyAt(getPos(e));
            if(b && b.label === 'tsum' && b.tsumType.id === currentChain[0].tsumType.id) {
                const idx = currentChain.indexOf(b);
                if(idx === -1) {
                    const last = currentChain[currentChain.length-1];
                    if(Math.hypot(b.position.x - last.position.x, b.position.y - last.position.y) < TSUM_R*3.5) {
                        currentChain.push(b);
                        sfx.playPop(currentChain.length);
                    }
                } else if (idx === currentChain.length-2) {
                    currentChain.pop();
                    sfx.playPop(currentChain.length);
                }
            }
        });

        canvas.addEventListener('pointerup', () => {
            if(!isPlaying || !isDragging) return;
            isDragging = false;
            if(currentChain.length >= 3) {
                processClear(currentChain);
                // 7以上でボム生成
                if(currentChain.length >= 7) {
                    const last = currentChain[currentChain.length-1];
                    spawnBomb(last.position.x, last.position.y);
                }
            }
            currentChain = [];
        });

        // 消去処理 (スコア計算とフィーバー等)
        function processClear(bodiesArray) {
            const count = bodiesArray.length;
            
            // コンボ更新
            comboCount++;
            if(comboCount > maxCombo) maxCombo = comboCount;
            lastClearTime = Date.now();
            updateComboUI();

            // スコア計算
            let base = count * 100;
            let chainBonus = (count - 3) * 50;
            let comboBonus = comboCount * 10;
            let addedScore = base + chainBonus + comboBonus;
            if (isFever) addedScore *= 3;
            score += addedScore;
            
            // コイン計算 (4個以上から)
            if (count >= 4) {
                coinsEarned += (count - 3) * 2;
            }

            document.getElementById('game-score').innerText = score.toLocaleString();

            // ゲージ増加
            increaseFever(count * 3);
            
            // スキルゲージ (マイツムのみ)
            const myCount = bodiesArray.filter(b => b.tsumType && b.tsumType.id === user.myTsumId).length;
            increaseSkill(myCount);

            // 物理削除とエフェクト
            bodiesArray.forEach(b => {
                for(let i=0;i<5;i++) particles.push({ x: b.position.x, y: b.position.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, r:3+Math.random()*4, c:b.tsumType ? b.tsumType.color : '#fff', alpha:1});
                World.remove(world, b);
            });
            refillTsums();
        }

        // ボム爆発処理
        function explodeBomb(bombBody) {
            sfx.playBomb();
            const radius = 90;
            const toClear = world.bodies.filter(b => b.label === 'tsum' && Math.hypot(b.position.x - bombBody.position.x, b.position.y - bombBody.position.y) < radius);
            
            World.remove(world, bombBody); // 自身を削除
            if(toClear.length > 0) {
                // ボム消去は単一処理としてコンボ加算
                processClear(toClear); 
            }
        }

        // フィーバー管理
        function increaseFever(val) {
            if(isFever) return;
            feverGauge = Math.min(100, feverGauge + val);
            document.getElementById('fever-bar').style.width = feverGauge + '%';
            if(feverGauge >= 100) {
                isFever = true;
                timeLeft += 5; // フィーバーで時間少し延長
                document.getElementById('view-game').classList.add('fever-bg');
                document.getElementById('fever-ui').classList.remove('opacity-80');
                document.getElementById('fever-ui').classList.add('animate-pulse', 'border-rose-500');
                
                // 10秒後に解除
                setTimeout(() => {
                    isFever = false;
                    feverGauge = 0;
                    document.getElementById('fever-bar').style.width = '0%';
                    document.getElementById('view-game').classList.remove('fever-bg');
                    document.getElementById('fever-ui').classList.add('opacity-80');
                    document.getElementById('fever-ui').classList.remove('animate-pulse', 'border-rose-500');
                }, 10000);
            }
        }

        // スキル管理
        const btnSkill = document.getElementById('btn-skill');
        function increaseSkill(val) {
            if(val <= 0 || skillGauge >= SKILL_MAX) return;
            skillGauge = Math.min(SKILL_MAX, skillGauge + val);
            document.getElementById('skill-bar').style.width = (skillGauge / SKILL_MAX * 100) + '%';
            if(skillGauge >= SKILL_MAX) {
                btnSkill.disabled = false;
                btnSkill.classList.replace('bg-slate-800', 'bg-gradient-to-r');
                btnSkill.classList.add('from-indigo-500', 'to-cyan-400', 'text-white', 'animate-bounce');
            }
        }

        btnSkill.onclick = () => {
            if(!isPlaying || skillGauge < SKILL_MAX) return;
            sfx.playSkill();
            skillGauge = 0;
            document.getElementById('skill-bar').style.width = '0%';
            btnSkill.disabled = true;
            btnSkill.className = 'bg-slate-800 text-slate-500 border border-slate-700 rounded-xl font-black text-sm w-20 h-14 shadow-lg transition-all flex flex-col items-center justify-center pointer-events-auto';

            // 画面中央を一掃する効果
            const cx = CANVAS_W/2, cy = CANVAS_H/2 + 20;
            const radius = 120;
            const toClear = world.bodies.filter(b => b.label === 'tsum' && Math.hypot(b.position.x - cx, b.position.y - cy) < radius);
            if(toClear.length > 0) processClear(toClear);
        };

        // シャッフル
        document.getElementById('btn-shuffle').onclick = () => {
            if(!isPlaying) return;
            const tsums = world.bodies.filter(b => b.label === 'tsum' || b.label === 'bomb');
            tsums.forEach(b => Body.applyForce(b, b.position, {x:(Math.random()-0.5)*0.1, y:-0.1-Math.random()*0.1}));
        };

        // UI表示
        function updateComboUI() {
            const el = document.getElementById('combo-display');
            if (comboCount > 1) {
                document.getElementById('combo-count').innerText = comboCount;
                el.classList.remove('hidden');
                // アニメーション再トリガー
                el.classList.remove('combo-pop');
                void el.offsetWidth; 
                el.classList.add('combo-pop');
            }
        }

        // === ゲーム進行管理 ===
        document.getElementById('btn-start').onclick = () => {
            if (user.hearts <= 0) {
                alert('ハートが足りません！回復を待つかコインで補充してください。(未実装)');
                return;
            }
            // ハート消費
            user.hearts--;
            if (user.hearts === HEART_MAX - 1) user.lastHeartTime = Date.now();
            saveUser();

            // 画面切り替え
            viewHome.classList.add('hidden');
            viewGame.classList.remove('hidden');

            // 初期化
            initPhysics();
            score = 0; coinsEarned = 0; timeLeft = 60;
            comboCount = 0; maxCombo = 0; feverGauge = 0; isFever = false; skillGauge = 0;
            document.getElementById('game-score').innerText = '0';
            document.getElementById('game-timer').innerText = '60';
            document.getElementById('fever-bar').style.width = '0%';
            document.getElementById('skill-bar').style.width = '0%';
            document.getElementById('combo-display').classList.add('hidden');
            
            // スキルボタンリセット
            btnSkill.disabled = true;
            btnSkill.className = 'bg-slate-800 text-slate-500 border border-slate-700 rounded-xl font-black text-sm w-20 h-14 shadow-lg transition-all flex flex-col items-center justify-center pointer-events-auto';

            refillTsums();
            
            isPlaying = true;
            sfx.init();
            requestAnimationFrame(drawLoop);

            gameTimer = setInterval(() => {
                if(!isPlaying) return;
                timeLeft--;
                document.getElementById('game-timer').innerText = timeLeft;
                if(timeLeft <= 0) timeUp();
            }, 1000);
        };

        function timeUp() {
            isPlaying = false;
            clearInterval(gameTimer);
            
            // マジカルタイムの判定 (スコアがハイスコアの90%以上 ＆ コインが300以上ある場合)
            if (user.highScore > 1000 && score >= user.highScore * 0.9 && score <= user.highScore && user.coins >= 300) {
                document.getElementById('modal-magical-time').classList.remove('hidden');
                document.getElementById('modal-magical-time').classList.add('flex');
            } else {
                finishGame();
            }
        }

        // マジカルタイム延長
        document.getElementById('btn-extend-coin').onclick = () => {
            user.coins -= 300;
            saveUser();
            document.getElementById('modal-magical-time').classList.add('hidden');
            document.getElementById('modal-magical-time').classList.remove('flex');
            timeLeft = 10;
            document.getElementById('game-timer').innerText = timeLeft;
            isPlaying = true;
            gameTimer = setInterval(() => {
                if(!isPlaying) return;
                timeLeft--;
                document.getElementById('game-timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    isPlaying = false;
                    clearInterval(gameTimer);
                    finishGame();
                }
            }, 1000);
        };

        document.getElementById('btn-extend-giveup').onclick = () => {
            document.getElementById('modal-magical-time').classList.add('hidden');
            document.getElementById('modal-magical-time').classList.remove('flex');
            finishGame();
        };

        function finishGame() {
            // ミッション判定 (フィーバー2回: 今回はモックとして常に達成と仮定するか、実際の実装にするか。簡易化のためプレイ毎に少しバーが伸びる演出にする)
            let pbLabel = document.getElementById('result-highscore-label');
            pbLabel.classList.add('hidden');
            
            if (score > user.highScore) {
                user.highScore = score;
                pbLabel.classList.remove('hidden');
            }
            user.coins += coinsEarned;
            saveUser();

            document.getElementById('result-score').innerText = score.toLocaleString();
            document.getElementById('result-coins').innerText = coinsEarned;
            document.getElementById('result-max-combo').innerText = maxCombo;
            
            document.getElementById('modal-result').classList.remove('hidden');
            document.getElementById('modal-result').classList.add('flex');
        }

        function returnToHome() {
            document.getElementById('modal-result').classList.add('hidden');
            document.getElementById('modal-result').classList.remove('flex');
            viewGame.classList.add('hidden');
            viewHome.classList.remove('hidden');
            Engine.clear(engine);
        }

        // 初期化実行
        loadUser();
    </script>
</body>
</html>
