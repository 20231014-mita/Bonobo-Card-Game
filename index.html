<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BONOBO CARD GAME</title>
  <style>
    :root{
      --bg:#050612;
      --panel:rgba(15,18,38,.82);
      --panel2:rgba(255,255,255,.075);
      --line:rgba(255,255,255,.14);
      --text:#f7fbff;
      --muted:#a8b2d6;
      --cyan:#45eaff;
      --pink:#ff4fd8;
      --purple:#8b65ff;
      --gold:#ffd45f;
      --green:#4cf58e;
      --red:#ff5468;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#app{width:100%;min-height:100%;margin:0}
    body{
      background:
        radial-gradient(circle at 15% 8%,rgba(255,79,216,.22),transparent 28%),
        radial-gradient(circle at 88% 12%,rgba(69,234,255,.18),transparent 30%),
        radial-gradient(circle at 50% 90%,rgba(139,101,255,.18),transparent 35%),
        linear-gradient(180deg,#070817,#03040c 78%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",Meiryo,sans-serif;
      overflow-x:hidden;
    }
    body::before{
      content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(#000 35%,transparent 92%);
    }
    body::after{
      content:"";position:fixed;inset:-100px;z-index:-3;pointer-events:none;
      background:conic-gradient(from 180deg at 50% 50%,rgba(255,79,216,.13),rgba(69,234,255,.1),rgba(139,101,255,.14),rgba(255,79,216,.13));
      filter:blur(75px);animation:slowSpin 24s linear infinite;opacity:.72;
    }
    @keyframes slowSpin{to{transform:rotate(360deg)}}
    button,input{font:inherit}
    button{border:0;color:inherit;cursor:pointer}
    button:disabled{opacity:.45;filter:grayscale(1);cursor:not-allowed}
    .topbar{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(3,4,14,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .brand{font-weight:1000;letter-spacing:.07em;line-height:1}.brand span{font-size:18px;text-shadow:0 0 14px var(--cyan),0 0 30px var(--pink)}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.2em}
    .stats{display:flex;gap:7px;align-items:center;overflow-x:auto;max-width:72vw}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,0,0,.34);border-radius:999px;padding:8px 10px;font-weight:900;white-space:nowrap}.coin{color:var(--gold);text-shadow:0 0 13px rgba(255,212,95,.65)}
    .screen{width:min(1160px,100%);margin:0 auto;padding:16px 12px calc(22px + var(--safe-bottom));min-height:calc(100vh - 64px)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px)}
    .btn{min-height:48px;border-radius:16px;padding:12px 16px;font-weight:1000;letter-spacing:.02em;background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 12px 28px rgba(69,234,255,.18),inset 0 1px 0 rgba(255,255,255,.27);transition:transform .12s,filter .12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}.btn.gold{background:linear-gradient(135deg,#ffd45f,#ff8a2b);color:#180b00}.btn.danger{background:linear-gradient(135deg,#ff5468,#b0153d)}.btn.small{min-height:38px;padding:9px 11px;border-radius:13px;font-size:13px}
    .input{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.44);color:var(--text);border-radius:16px;padding:14px;font-weight:900;outline:0}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(69,234,255,.15)}
    .grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.stats{max-width:54vw}.screen{padding:13px 10px calc(18px + var(--safe-bottom))}}
    .titleHero{min-height:calc(100vh - 72px);display:grid;place-items:center;text-align:center;padding:20px}.titleCard{width:min(560px,100%);padding:30px;position:relative;overflow:hidden}.titleCard::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,79,216,.22),transparent 36%),radial-gradient(circle at 78% 20%,rgba(69,234,255,.18),transparent 32%);animation:pulseGlow 4s ease-in-out infinite}.titleCard>*{position:relative}.logo{font-size:clamp(42px,10vw,96px);font-weight:1000;line-height:.9;letter-spacing:-.06em;margin:0 0 16px;text-shadow:0 0 18px rgba(69,234,255,.9),0 0 52px rgba(255,79,216,.85)}.sub{color:var(--muted);font-weight:800;line-height:1.65}.bigButtons{display:grid;gap:10px;margin-top:16px}.bigButtons .btn{min-height:58px;font-size:17px}@keyframes pulseGlow{50%{transform:scale(1.08);opacity:.85}}
    .sectionTitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}.sectionTitle h1{margin:0;font-size:clamp(26px,5vw,46px);letter-spacing:-.04em}.back{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--muted);font-weight:1000;padding:10px 4px}.back:hover{color:white}
    .homeCard{padding:18px;min-height:148px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;text-align:left}.homeCard::before{content:"";position:absolute;right:-42px;bottom:-78px;width:176px;height:176px;border-radius:50%;background:var(--glow,rgba(69,234,255,.25));filter:blur(16px)}.homeCard>*{position:relative}.homeIcon{font-size:48px;filter:drop-shadow(0 0 18px var(--glow2,rgba(69,234,255,.7)))}.homeCard h2{margin:0 0 6px;font-size:24px}.homeCard p{margin:0;color:var(--muted);font-weight:800;line-height:1.5}
    .cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:14px}.cardBtn{background:transparent;padding:0;text-align:left}.card{height:222px;border-radius:18px;padding:8px;border:2px solid var(--rb);background:linear-gradient(150deg,var(--r1),var(--r2));position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.34);transition:transform .14s,filter .14s;display:flex;flex-direction:column;min-width:0}.cardBtn:hover .card{transform:translateY(-5px);filter:brightness(1.05)}.card::before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 34%);transform:translate(-30%,-30%);opacity:.55}.card.shiny::after{content:"";position:absolute;inset:-80%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.46),transparent 55%);animation:shine 2.45s infinite}.cardTop{position:relative;z-index:1;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:7px}.cardName{font-weight:1000;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardMeta{display:flex;justify-content:space-between;align-items:center;margin-top:3px;color:var(--gold);font-size:12px;font-weight:1000}.cardIcon{position:relative;z-index:1;height:90px;display:grid;place-items:center;font-size:58px;filter:drop-shadow(0 13px 13px rgba(0,0,0,.5))}.cardStats{position:relative;z-index:1;display:flex;gap:5px;justify-content:space-between;margin-top:auto}.stat{flex:1;text-align:center;border-radius:11px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.13);padding:6px 4px;font-size:12px;font-weight:1000}.ownedBadge,.evoBadge{position:absolute;right:7px;bottom:7px;z-index:2;background:#03040c;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:1000}.evoBadge{left:7px;right:auto;color:var(--gold)}@keyframes shine{50%,100%{transform:translateX(70%) rotate(15deg)}}
    .packCard{position:relative;overflow:hidden;padding:18px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between}.packCard::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.29}.packCard>*{position:relative}.packVisual{height:152px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));border:2px solid rgba(255,255,255,.24);box-shadow:0 26px 55px rgba(0,0,0,.36);transform:perspective(700px) rotateY(-10deg) rotateX(7deg);position:relative;overflow:hidden}.packVisual::after{content:"";position:absolute;inset:-50%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.32),transparent 55%);transform:translateX(-60%) rotate(15deg);animation:shine 2.8s infinite}.packEmoji{font-size:72px}.muted{color:var(--muted)}.strong{font-weight:900}.small{font-size:12px}.mb{margin-bottom:12px}.mt{margin-top:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.center{text-align:center}
    .battleWrap{max-width:1160px}.battleHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.arena{position:relative;min-height:310px;padding:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}.arena::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 50% 40%,rgba(69,234,255,.16),transparent 25%),linear-gradient(135deg,rgba(255,79,216,.13),rgba(139,101,255,.12));animation:arenaPulse 5s ease-in-out infinite}.arena>*{position:relative}.hpBox{background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:17px;padding:10px;z-index:2}.hpName{font-size:12px;color:var(--muted);font-weight:1000}.hpNum{font-size:22px;font-weight:1000}.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 16px rgba(255,84,104,.5)}.enemyHp{grid-column:2}.playerHp{grid-column:1;grid-row:2}.avatar{display:grid;place-items:center;min-height:160px;font-size:96px;filter:drop-shadow(0 0 30px rgba(69,234,255,.55));animation:floaty 2.4s ease-in-out infinite}.enemyAvatar{grid-column:2;grid-row:2}.playerAvatar{grid-column:1;grid-row:1}.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:1000;color:white;text-shadow:0 0 22px var(--pink),0 0 36px var(--cyan);z-index:3}.energyBar{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.energyDot{width:15px;height:8px;border-radius:999px;background:rgba(255,255,255,.15)}.energyDot.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.battleControl{padding:14px;margin-top:13px}.logBox{padding:12px;min-height:50px;margin-bottom:12px;color:#eaf7ff;font-weight:900;background:rgba(0,0,0,.35);border-radius:16px;border:1px solid var(--line)}.fanWrap{position:relative;height:250px;overflow:hidden;margin-top:14px}.fanCardBtn{position:absolute;left:50%;bottom:2px;width:142px;transform-origin:50% 110%;background:transparent;padding:0;transition:transform .18s,filter .18s}.fanCardBtn.selected{filter:brightness(1.18);z-index:5}.fanCardBtn.selected .card{outline:3px solid white;box-shadow:0 0 40px rgba(255,255,255,.45)}.moveGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.moveBtn{text-align:left;min-height:76px}.moveBtn b{display:block}.moveCost{float:right;color:var(--gold)}@media(max-width:720px){.arena{grid-template-columns:1fr;min-height:420px}.enemyHp,.playerHp,.enemyAvatar,.playerAvatar{grid-column:auto;grid-row:auto}.vs{top:49%}.moveGrid{grid-template-columns:1fr}.fanWrap{height:235px}.fanCardBtn{width:128px}.fanCardBtn .card{height:195px}}
    @keyframes arenaPulse{50%{transform:scale(1.08);opacity:.86}}@keyframes floaty{50%{transform:translateY(-8px)}}
    .overlay{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px}.modal{width:min(780px,100%);padding:18px;max-height:90vh;overflow:auto}.detailGrid{display:grid;grid-template-columns:170px 1fr;gap:16px}@media(max-width:690px){.detailGrid{grid-template-columns:1fr}.detailGrid .card{width:170px;margin:auto}}
    .toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));z-index:200;transform:translateX(-50%);background:rgba(5,8,22,.92);border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-weight:1000;box-shadow:0 16px 40px rgba(0,0,0,.42)}
    #fx{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}.hitText{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:clamp(34px,8vw,78px);font-weight:1000;color:white;text-shadow:0 0 16px var(--cyan),0 0 42px var(--pink);animation:hitText .78s ease-out forwards}.slash{position:absolute;left:50%;top:48%;width:360px;height:24px;border-radius:999px;background:linear-gradient(90deg,transparent,white,var(--cyan),transparent);box-shadow:0 0 30px var(--cyan);transform:translate(-50%,-50%) rotate(var(--rot));animation:slash .62s ease-out forwards}.fireBall,.waterOrb,.thunder,.poison,.beam,.healRing,.guardWall,.darkBurst,.cosmicRing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.fireBall{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#ffd45f 18%,#ff5a2d 42%,transparent 70%);box-shadow:0 0 55px #ff5a2d;animation:boom .8s ease-out forwards}.waterOrb{width:210px;height:210px;border-radius:45% 55% 50% 50%;border:5px solid #45eaff;box-shadow:0 0 42px #45eaff,inset 0 0 36px #45eaff;animation:water .85s ease-out forwards}.thunder{width:70px;height:260px;background:linear-gradient(#fff,#ffd45f,#45eaff);clip-path:polygon(45% 0,80% 0,60% 36%,100% 36%,35% 100%,52% 52%,0 52%);filter:drop-shadow(0 0 22px #ffd45f);animation:thunder .55s ease-out forwards}.poison{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(76,245,142,.7),rgba(76,245,142,.18) 44%,transparent 68%);box-shadow:0 0 48px #4cf58e;animation:boom .9s ease-out forwards}.beam{height:40px;width:120vw;background:linear-gradient(90deg,transparent,#fff,var(--pink),var(--cyan),transparent);box-shadow:0 0 42px var(--pink);animation:beam .7s ease-out forwards}.healRing{width:230px;height:230px;border-radius:50%;border:7px solid var(--green);box-shadow:0 0 42px var(--green),inset 0 0 30px var(--green);animation:ring .85s ease-out forwards}.guardWall{width:280px;height:170px;border-radius:22px;border:5px solid #a8b2ff;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(69,234,255,.1));box-shadow:0 0 34px #a8b2ff;animation:guard .85s ease-out forwards}.darkBurst{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fff 0 3%,#8b65ff 20%,#17071e 52%,transparent 72%);box-shadow:0 0 52px #8b65ff;animation:boom .85s ease-out forwards}.cosmicRing{width:240px;height:240px;border-radius:50%;border:7px double #fff;background:conic-gradient(from 0deg,var(--pink),var(--cyan),var(--gold),var(--pink));box-shadow:0 0 55px #fff;mix-blend-mode:screen;animation:cosmic .9s ease-out forwards}.particle{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--p);box-shadow:0 0 18px var(--p);left:50%;top:50%;animation:particle .85s ease-out forwards}.screenFlash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 60%);animation:flash .38s ease-out forwards}
    .evoCutin{position:fixed;inset:0;z-index:180;display:grid;place-items:center;background:rgba(0,0,0,.5);animation:cutinOut 1.25s ease-out forwards}.evoCutin div{padding:24px 34px;border-radius:26px;background:linear-gradient(135deg,#ffd45f,#ff4fd8,#45eaff);color:#080812;text-align:center;box-shadow:0 0 60px rgba(255,255,255,.45);transform:skew(-8deg)}.evoCutin h1{font-size:clamp(36px,10vw,88px);margin:0;font-weight:1000}
    @keyframes hitText{to{opacity:0;transform:translate(-50%,-90%) scale(1.22)}}@keyframes slash{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scaleX(.15)}to{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scaleX(1.2)}}@keyframes boom{to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}@keyframes water{to{opacity:0;transform:translate(-50%,-50%) scale(1.55) rotate(120deg)}}@keyframes thunder{to{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}@keyframes beam{to{opacity:0;transform:translate(-50%,-50%) scaleY(1.8)}}@keyframes ring{to{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}@keyframes guard{to{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes cosmic{to{opacity:0;transform:translate(-50%,-50%) scale(1.75) rotate(260deg)}}@keyframes particle{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}@keyframes flash{to{opacity:0}}@keyframes cutinOut{70%{opacity:1}to{opacity:0}}

    .progressShell{width:100%;height:16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
    .progressFill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));box-shadow:0 0 22px rgba(69,234,255,.45)}

  </style>

  let state = {view:'title',detail:null,packResult:null,battle:null};

  function defaultSave(){
    return {
      dataVersion:DATA_VERSION,
      nickname:'BONOBO PLAYER',
      coins:1200,
      gems:200,
      collection:['bb_mini','bb_leaf','bb_fire','bb_water','bb_thunder'],

      evolved:{},
      storyProgress:0,
      claimedMissions:[],
      dailyShop:{date:'',purchased:[]},
      rankingFriends:[],
      online:{lastCode:'',matches:0,wins:0,status:'未接続'},
      cheats:{hpMult:1,atkMult:1,rewardMult:1,oneShot:false,invincible:false,fullEnergy:false,freeMoves:false},
      stats:{packs:0,wins:0,battles:0,bestDamage:0,totalDamage:0,godUses:0,shopBuys:0,adminCodes:0,onlineMatches:0,onlineWins:0},
      settings:{reducedFx:false},
      updatedAt:Date.now()
    };
  }

  function loadSave(){
    const raw = localStorage.getItem(STORAGE_KEY) || LEGACY_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);
    if(!raw) return defaultSave();
    try{return migrateSave(JSON.parse(raw));}
    catch(err){console.warn('Save load failed. Backup will be used if possible.',err);return defaultSave();}
  }

  function migrateSave(data){
    const base = defaultSave();
    const next = {...base,...(data||{})};
    next.dataVersion = DATA_VERSION;
    next.collection = Array.isArray(next.collection) && next.collection.length ? next.collection.filter(id=>cardById(id)) : base.collection;
    next.deck = Array.isArray(next.deck) && next.deck.length ? next.deck.filter(id=>cardById(id)).slice(0,5) : base.deck;
    while(next.deck.length<5) next.deck.push(base.deck[next.deck.length] || 'bb_mini');
    next.evolved = typeof next.evolved==='object' && next.evolved ? next.evolved : {};
    next.stats = {...base.stats,...(next.stats||{})};
    next.settings = {...base.settings,...(next.settings||{})};
    next.cheats = {...base.cheats,...(next.cheats||{})};
    next.rankingFriends = Array.isArray(next.rankingFriends) ? next.rankingFriends.filter(x=>x && typeof x==='object').slice(0,20) : [];
    next.online = {...base.online,...(next.online||{})};
    next.coins = Number.isFinite(Number(next.coins)) ? Number(next.coins) : base.coins;
    next.gems = Number.isFinite(Number(next.gems)) ? Number(next.gems) : base.gems;
    next.claimedMissions = Array.isArray(next.claimedMissions) ? next.claimedMissions : [];
    next.dailyShop = next.dailyShop && typeof next.dailyShop==='object' ? {...base.dailyShop,...next.dailyShop} : base.dailyShop;
    if(!Array.isArray(next.dailyShop.purchased)) next.dailyShop.purchased = [];
    next.storyProgress = Math.max(0,Math.min(BOSSES.length-1,Number(next.storyProgress)||0));
    return next;
  }

  function save(){
    saveData.updatedAt = Date.now();
    const text = JSON.stringify(saveData);
    localStorage.setItem(STORAGE_KEY,text);
    localStorage.setItem(BACKUP_KEY,text);
  }

  function esc(value){
    return String(value ?? '').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }
  function cardById(id){return CARD_DB.find(c=>c.id===id) || CARD_DB[0];}
  function bossById(id){return id==='online_rival' ? ONLINE_RIVAL : (BOSSES.find(b=>b.id===id) || BOSSES[0]);}
  function rarityInfo(card){return RARITIES[card.rarity] || RARITIES.C;}
  function cardLevel(id){return Number(saveData.evolved?.[id] || 0);}
  function poweredCard(id){
    const c = cardById(id); const lv = cardLevel(id); const boost = 1 + lv * .18;
    return {...c,hp:Math.round(c.hp*boost),atk:Math.round(c.atk*boost),level:lv};
  }
  function collectionCounts(){return saveData.collection.reduce((a,id)=>{a[id]=(a[id]||0)+1;return a;},{});}  
  function currentDeck(){return saveData.deck.map(poweredCard);}
  function uniqueOwnedIds(){return [...new Set(saveData.collection.filter(id=>cardById(id)))];}
  function collectionPercent(){return Math.floor(uniqueOwnedIds().length / CARD_DB.length * 100);}
  function countCardsByRarity(minOrder){return uniqueOwnedIds().filter(id=>rarityInfo(cardById(id)).order>=minOrder).length;}
  function todayKey(){return new Date().toISOString().slice(0,10);}
  function seededRandom(seed){let h=2166136261; for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i); h=Math.imul(h,16777619);} return ()=>{h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;};}
  function dailyItems(){
    const day=todayKey(); const rnd=seededRandom(day+'bonobo'); const pool=[...DAILY_SHOP_POOL]; const items=[];
    while(items.length<5 && pool.length){const i=Math.floor(rnd()*pool.length); items.push(pool.splice(i,1)[0]);}
    if(saveData.dailyShop.date!==day){saveData.dailyShop={date:day,purchased:[]}; save();}
    return items;
  }
  function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
  function weightedRandom(cards){
    const total = cards.reduce((sum,c)=>sum+(RARITIES[c.rarity]?.rate||1),0);
    let roll = Math.random()*total;
    for(const c of cards){roll -= (RARITIES[c.rarity]?.rate || 1); if(roll<=0) return c;}
    return cards[cards.length-1];
  }
  function typeMultiplier(attackType,defType){return TYPE_MATCH[attackType]?.[defType] || 1;}
  function typeText(mult){return mult>1.1?'効果ばつぐん！':mult<.95?'少し効きにくい…':'';}

  function createBattle(bossId){
    const boss = bossById(bossId);
    const deck = currentDeck();
    const cheat = saveData.cheats || {};

    saveData.stats.battles += 1;

  function missionProgress(m){
    let value=0;
    if(m.kind==='wins') value=saveData.stats.wins||0;
    if(m.kind==='packs') value=saveData.stats.packs||0;
    if(m.kind==='cardsTotal') value=saveData.collection.length;
    if(m.kind==='bestDamage') value=saveData.stats.bestDamage||0;
    if(m.kind==='totalDamage') value=saveData.stats.totalDamage||0;
    if(m.kind==='rarityURPlus') value=countCardsByRarity(RARITIES.UR.order);
    if(m.kind==='rarityGOD') value=uniqueOwnedIds().filter(id=>cardById(id).rarity==='GOD').length;
    if(m.kind==='dexPercent') value=collectionPercent();
    if(m.kind==='evolvedCount') value=Object.keys(saveData.evolved||{}).filter(id=>saveData.evolved[id]>0).length;
    if(m.kind==='chapter') value=Math.min(BOSSES.length,saveData.storyProgress+1);
    if(m.kind==='godUses') value=saveData.stats.godUses||0;
    return {value,done:value>=m.goal};
  }

  function claimMission(id){
    const m = MISSION_DB.find(x=>x.id===id); if(!m) return;
    const p = missionProgress(m);
    if(!p.done){toast('まだ達成していません。'); return;}
    if(saveData.claimedMissions.includes(id)){toast('受け取り済みです。'); return;}
    grantReward(m.reward);
    saveData.claimedMissions.push(id);
    save(); rareEffect(); toast('ミッション報酬を受け取りました！'); render();
  }

  function grantReward(reward){
    if(reward.coins) saveData.coins += reward.coins;
    if(reward.gems) saveData.gems += reward.gems;
    if(reward.card) saveData.collection.push(reward.card);
  }

  function buyDailyItem(id){
    const item = dailyItems().find(x=>x.id===id); if(!item) return;
    if(saveData.dailyShop.purchased.includes(id)){toast('今日は購入済みです。'); return;}
    if(item.costType==='gems'){
      if(saveData.gems < item.cost){toast('ジェムが足りません。'); return;}
      saveData.gems -= item.cost;
    }else{
      if(saveData.coins < item.cost){toast('コインが足りません。'); return;}
      saveData.coins -= item.cost;
    }
    grantReward(item.reward);
    saveData.dailyShop.purchased.push(id);
    saveData.stats.shopBuys += 1;
    save(); rareEffect(); toast('デイリー商品を購入しました！'); render();
  }

  function openPack(packId){
    const pack = PACKS.find(p=>p.id===packId); if(!pack) return;
    if(saveData.coins < pack.cost){toast('コインが足りません。'); return;}
    saveData.coins -= pack.cost; saveData.stats.packs += 1;
    const pool = pack.limitedOnly ? CARD_DB.filter(c=>c.limited) : CARD_DB.filter(c=>!c.limited || c.rarity!=='GOD');
    const result = [];
    for(let i=0;i<pack.count;i++){
      let card = weightedRandom(pool);
      if(pack.bonus && Math.random()<.18){const bonusPool=pool.filter(c=>pack.bonus.includes(c.rarity)); if(bonusPool.length) card = weightedRandom(bonusPool);}
      result.push(card.id); saveData.collection.push(card.id);
    }
    const bestOrder = Math.max(...result.map(id=>rarityInfo(cardById(id)).order));
    state.packResult = result; save(); rareEffect(bestOrder); render();
  }

  function selectBattleCard(index){
    const b = state.battle; if(!b || b.result) return;
    b.selectedIndex = Number(index); b.phase='use'; b.log.unshift(`${currentDeck()[b.selectedIndex].name} を選択。技を選んでください。`); render();
  }
  function useBattleMove(moveIndex){
    const b = state.battle; if(!b || b.result) return;
    if(b.selectedIndex===null){toast('先にカードを選んでください。'); return;}
    const card = currentDeck()[b.selectedIndex]; const move = card.moves[Number(moveIndex)] || card.moves[0];
    const cheat = saveData.cheats || {};
    const cost = cheat.freeMoves ? 0 : (move.cost||0);
    if(b.energy < cost){toast('エネルギーが足りません。'); return;}
    b.phase='use';
    b.energy = Math.max(0,b.energy-cost);
    if(move.charge) b.energy = Math.min(12,b.energy+move.charge);
    if(move.heal) b.playerHp = Math.min(b.playerMax,b.playerHp+move.heal);
    if(move.guard) b.guard += move.guard;
    let dmg = 0;
    if(card.rarity==='GOD') saveData.stats.godUses += 1;
    if(move.dmg){
      const boss = bossById(b.bossId); const mult = typeMultiplier(move.type||card.element,boss.element);
      dmg = Math.floor((move.dmg + card.atk*.42 + randomInt(0,18))*mult*(cheat.atkMult||1));
      if(cheat.oneShot) dmg = Math.max(dmg, b.enemyHp);
      b.enemyHp = Math.max(0,b.enemyHp-dmg);
      saveData.stats.bestDamage = Math.max(saveData.stats.bestDamage,dmg);
      saveData.stats.totalDamage += dmg;
      b.log.unshift(`${card.name} の ${move.name}！ ${dmg}ダメージ！ ${typeText(mult)}`.trim());
    }else if(move.heal){b.log.unshift(`${card.name} の ${move.name}！ HPを${move.heal}回復！`);} else if(move.guard){b.log.unshift(`${card.name} の ${move.name}！ 防御+${move.guard}！`);} else if(move.charge){b.log.unshift(`${card.name} の ${move.name}！ エネルギー+${move.charge}！`);}    
    const fxType = move.fx||card.element;
    if(card.rarity==='GOD'){
      playGodCutin(card.name,move.name);
      setTimeout(()=>playMoveEffect(fxType,dmg||move.heal||move.guard||60),520);
    }else{
      playMoveEffect(fxType,dmg||move.heal||move.guard||60);
    }
    if(checkBattleResult()) {save(); render(); return;}
    save(); render();
    setTimeout(enemyTurn,card.rarity==='GOD'?900:480);
  }

  function enemyTurn(){
    const b = state.battle; if(!b || b.result) return;
    b.phase='enemy';
    const boss = bossById(b.bossId);
    const cheat = saveData.cheats || {};
    let dmg = cheat.invincible ? 0 : Math.floor(boss.power*(.82+Math.random()*.42));
    if(b.guard>0){const reduced = Math.min(dmg,b.guard); dmg -= reduced; b.guard -= reduced;}
    b.playerHp = Math.max(0,b.playerHp-dmg); b.energy = Math.min(12, cheat.fullEnergy?12:b.energy+4); b.selectedIndex=null; b.turn += 1;
    b.log.unshift(`${boss.name} の攻撃！ ${dmg}ダメージ！ エネルギー+4`);
    playMoveEffect(boss.element==='fire'?'fire':boss.element==='dark'?'dark':'slash',dmg);
    checkBattleResult(); save(); render();
  }
  function checkBattleResult(){
    const b = state.battle; if(!b) return false;
    const boss = bossById(b.bossId);
    if(b.enemyHp<=0){
      b.result='win'; b.phase='result';
      const rewardMult = (saveData.cheats?.rewardMult || 1);
      saveData.coins += Math.floor((boss.reward||0)*rewardMult); saveData.gems += Math.floor((boss.rewardGems||0)*rewardMult); saveData.stats.wins += 1;
      if(b.online){saveData.stats.onlineWins += 1; saveData.stats.onlineMatches += 1; saveData.online.wins = (saveData.online.wins||0)+1; saveData.online.matches=(saveData.online.matches||0)+1;}
      const idx = BOSSES.findIndex(x=>x.id===boss.id); if(!b.online && idx===saveData.storyProgress && saveData.storyProgress<BOSSES.length-1) saveData.storyProgress += 1;
      b.log.unshift('勝利！報酬を獲得しました。'); rareEffect('UR'); return true;
    }
    if(b.playerHp<=0){b.result='lose'; b.phase='result'; if(b.online){saveData.stats.onlineMatches += 1; saveData.online.matches=(saveData.online.matches||0)+1;} b.log.unshift('敗北…。デッキを強化して再挑戦しよう。'); return true;}
    b.phase='select'; return false;
  }

  function evolveCard(id){
    const counts = collectionCounts(); const lv = cardLevel(id);
    if(lv>=3){toast('これ以上進化できません。'); return;}
    if((counts[id]||0)<3){toast('同じカードが3枚必要です。'); return;}
    let removed = 0; saveData.collection = saveData.collection.filter(cid=>{if(cid===id && removed<2){removed++; return false;} return true;});
    saveData.evolved[id] = lv+1; save(); playEvolutionCutin(cardById(id).name,lv+1); render();
  }

  function handleAction(event){
    const target = event.target.closest('[data-action]');
    if(!target) return;
    if(target.closest('[data-stop]') && target.dataset.action!=='closeDetail') event.stopPropagation();
    const action = target.dataset.action;
    if(action!=='noop'){event.preventDefault();}
    const actions = {
      startGame:()=>{const input=document.getElementById('nicknameInput'); saveData.nickname=(input?.value||'BONOBO PLAYER').trim().slice(0,18)||'BONOBO PLAYER'; state.view='home'; save(); render();},
      nav:()=>{state.view=target.dataset.view; state.detail=null; state.packResult=null; render();},
      openSave:()=>{state.view='save'; render();},
      openPack:()=>openPack(target.dataset.pack),
      clearPackResult:()=>{state.packResult=null; render();},
      openDetail:()=>{state.detail=target.dataset.card; render();},
      closeDetail:()=>{state.detail=null; render();},
      evolveCard:()=>evolveCard(target.dataset.card),
      addDeck:()=>{addToDeck(target.dataset.card);},
      removeDeck:()=>{removeFromDeck(target.dataset.card);},
      startBattle:()=>{state.battle=createBattle(target.dataset.boss); state.view='battle'; render();},
      quickBattle:()=>{state.battle=createBattle(BOSSES[saveData.storyProgress].id); state.view='battle'; render();},
      selectBattleCard:()=>selectBattleCard(target.dataset.index),
      useMove:()=>useBattleMove(target.dataset.move),
      autoSelect:()=>autoSelectCard(),
      chargeEnergy:()=>{const b=state.battle;if(b&&!b.result){b.energy=Math.min(12,b.energy+3);b.log.unshift('集中してエネルギーを+3しました。');playMoveEffect('cosmic',30);save();render();}},
      endBattle:()=>{state.battle=null;state.view='battleSelect';render();},
      finishBattle:()=>{state.battle=null;state.view='home';render();},
      claimMission:()=>claimMission(target.dataset.mission),
      buyDailyItem:()=>buyDailyItem(target.dataset.item),
      copySave:()=>copySaveCode(),
      importSave:()=>importSaveCode(),
      resetSave:()=>{if(confirm('本当にリセットしますか？')){saveData=defaultSave();state={view:'title',detail:null,packResult:null,battle:null,onlineStatus:'未接続'};save();render();}},
      addRankFriend:()=>addRankFriend(),
      removeRankFriend:()=>removeRankFriend(target.dataset.index),
      enterOnlineRoom:()=>enterOnlineRoom(),
      leaveOnlineRoom:()=>leaveOnlineRoom(),
      startOnlineDuel:()=>startOnlineDuel(),
      applyAdminCode:()=>applyAdminCode(),
      clearAdminCode:()=>{resetCheats();save();toast('チート効果をリセットしました。');render();},
      toggleFx:()=>{saveData.settings.reducedFx=!saveData.settings.reducedFx;save();render();}
    };
    if(actions[action]) actions[action]();
  }

  document.addEventListener('click',handleAction);


  function resetCheats(){
    saveData.cheats = {hpMult:1,atkMult:1,rewardMult:1,oneShot:false,invincible:false,fullEnergy:false,freeMoves:false};
  }
  function cheatSummary(){
    const c = saveData.cheats || {};
    const list=[];
    if((c.hpMult||1)>1) list.push(`HP${c.hpMult}倍`);
    if((c.atkMult||1)>1) list.push(`攻撃${c.atkMult}倍`);
    if((c.rewardMult||1)>1) list.push(`報酬${c.rewardMult}倍`);
    if(c.oneShot) list.push('ワンパン');
    if(c.invincible) list.push('無敵');
    if(c.fullEnergy) list.push('エネルギーMAX');
    if(c.freeMoves) list.push('技コスト0');
    return list.length ? list.join(' / ') : 'なし';
  }
  function applyAdminCode(){
    const input = document.getElementById('adminCodeInput');
    const code = (input?.value || '').replace(/\D/g,'');
    if(code.length!==7){toast('7桁の数字を入れてください。'); return;}
    const item = ADMIN_CODES[code];
    if(!item){toast('コードが違います。'); return;}
    item.run();
    saveData.stats.adminCodes = (saveData.stats.adminCodes||0)+1;
    save(); rareEffect(); toast(item.label); render();
  }
  function addRankFriend(){
    const name = (document.getElementById('rankName')?.value || '').trim().slice(0,16);
    const score = Math.max(0,Math.floor(Number(document.getElementById('rankScore')?.value || 0)));
    if(!name || !score){toast('名前とスコアを入力してください。'); return;}
    saveData.rankingFriends.push({name,score,detail:'友達記録'});
    saveData.rankingFriends = saveData.rankingFriends.slice(-20);
    save(); toast('ランキングに追加しました。'); render();
  }
  function removeRankFriend(displayIndex){
    const row = rankingRows()[Number(displayIndex)];
    if(!row || row.me) return;
    const idx = saveData.rankingFriends.findIndex(x=>x.name===row.name && Number(x.score)===Number(row.score));
    if(idx>=0){saveData.rankingFriends.splice(idx,1); save(); toast('削除しました。'); render();}
  }
  function enterOnlineRoom(){
    const code = (document.getElementById('onlineCode')?.value || '').replace(/\D/g,'').slice(0,3);
    if(code.length!==3){toast('3桁の数字を入れてください。'); return;}
    leaveOnlineRoom(false);
    saveData.online.lastCode = code;
    saveData.online.status = `コード${code}で待機中`;
    state.onlineStatus = saveData.online.status;
    try{
      onlineChannel = new BroadcastChannel('bonobo_room_'+code);
      onlineChannel.onmessage = ev=>{
        if(!ev.data || ev.data.clientId===CLIENT_ID) return;
        if(ev.data.type==='hello'){
          state.onlineStatus='マッチング成功！対戦開始できます。';
          saveData.online.status=state.onlineStatus; save(); render();
          onlineChannel.postMessage({type:'matched',clientId:CLIENT_ID,name:saveData.nickname});
        }
        if(ev.data.type==='matched'){
          state.onlineStatus='マッチング成功！対戦開始できます。';
          saveData.online.status=state.onlineStatus; save(); render();
        }
      };
      onlineChannel.postMessage({type:'hello',clientId:CLIENT_ID,name:saveData.nickname,at:Date.now()});
      setTimeout(()=>{if(state.onlineStatus && state.onlineStatus.includes('待機中')){state.onlineStatus='待機中：相手が来ない場合は練習対戦できます。'; saveData.online.status=state.onlineStatus; save(); render();}},15000);
    }catch(err){
      state.onlineStatus='このブラウザではルーム通信が使えません。練習対戦はできます。';
      saveData.online.status=state.onlineStatus;
    }
    save(); toast('オンラインルームに入りました。'); render();
  }
  function leaveOnlineRoom(shouldRender=true){
    try{if(onlineChannel){onlineChannel.close();}}catch(err){}
    onlineChannel=null;
    saveData.online.status='未接続';
    state.onlineStatus='未接続';
    save();
    if(shouldRender){toast('ルームを退出しました。'); render();}
  }
  function startOnlineDuel(){
    state.battle=createBattle('online_rival');
    state.view='battle';
    state.onlineStatus='対戦中';
    saveData.online.status='対戦中';
    save(); render();
  }

  function addToDeck(id){
    if(saveData.deck.includes(id)){toast('すでにデッキに入っています。'); return;}
    if(saveData.deck.length>=5){toast('デッキは5枚までです。'); return;}
    saveData.deck.push(id); save(); render();
  }
  function removeFromDeck(id){
    if(saveData.deck.length<=1){toast('最低1枚は必要です。'); return;}
    const idx = saveData.deck.indexOf(id); if(idx>=0) saveData.deck.splice(idx,1); save(); render();
  }
  function autoSelectCard(){
    const b = state.battle; if(!b || b.result) return;
    const deck = currentDeck(); let bestIndex = 0; let bestScore = -1;
    deck.forEach((c,i)=>{const score = c.moves.reduce((m,move)=>Math.max(m,(move.dmg||0)+(move.heal||0)*.5+(move.guard||0)*.35),0)+c.atk; if(score>bestScore){bestScore=score;bestIndex=i;}});
    selectBattleCard(bestIndex);
  }
  function copySaveCode(){
    const ta = document.getElementById('saveCode'); ta.select(); document.execCommand('copy'); toast('セーブコードをコピーしました。');
  }
  function importSaveCode(){
    const ta = document.getElementById('saveCode');
    try{const decoded = decodeURIComponent(escape(atob(ta.value.trim()))); saveData = migrateSave(JSON.parse(decoded)); save(); toast('セーブを読み込みました。'); state.view='home'; render();}
    catch(err){toast('セーブコードを読み込めませんでした。');}
  }

  function toast(text){
    const old = document.querySelector('.toast'); if(old) old.remove();
    const div = document.createElement('div'); div.className='toast'; div.textContent=text; document.body.appendChild(div); setTimeout(()=>div.remove(),1700);
  }

  function playMoveEffect(type,value){
    if(saveData.settings.reducedFx){simpleEffect(value); return;}
    const map = {slash:'slash',normal:'slash',fire:'fireBall',water:'waterOrb',leaf:'poison',light:'thunder',thunder:'thunder',poison:'poison',dark:'darkBurst',beam:'beam',heal:'healRing',guard:'guardWall',cosmic:'cosmicRing'};
    const cls = map[type] || 'slash';
    const flash = document.createElement('div'); flash.className='screenFlash'; fxLayer.appendChild(flash); setTimeout(()=>flash.remove(),420);
    if(cls==='slash'){
      for(let i=0;i<3;i++){const el=document.createElement('div'); el.className='slash'; el.style.setProperty('--rot',`${-24+i*24}deg`); fxLayer.appendChild(el); setTimeout(()=>el.remove(),720);}
    }else{const el=document.createElement('div'); el.className=cls; fxLayer.appendChild(el); setTimeout(()=>el.remove(),950);}
    for(let i=0;i<28;i++){const p=document.createElement('i'); p.className='particle'; p.style.setProperty('--p',particleColor(type)); p.style.setProperty('--x',`${randomInt(-190,190)}px`); p.style.setProperty('--y',`${randomInt(-160,160)}px`); fxLayer.appendChild(p); setTimeout(()=>p.remove(),940);}
    if(value) damageText(value);
    if(navigator.vibrate) navigator.vibrate(22);
  }
  function simpleEffect(value){damageText(value); const el=document.createElement('div'); el.className='screenFlash'; fxLayer.appendChild(el); setTimeout(()=>el.remove(),360);}
  function damageText(value){const d=document.createElement('div'); d.className='hitText'; d.textContent=Number(value)>0?String(value):'HIT'; fxLayer.appendChild(d); setTimeout(()=>d.remove(),850);}
  function particleColor(type){return {fire:'#ff6a2b',water:'#45eaff',leaf:'#4cf58e',light:'#ffd45f',thunder:'#ffd45f',dark:'#8b65ff',heal:'#4cf58e',guard:'#a8b2ff',beam:'#ff4fd8',cosmic:'#ffffff'}[type] || '#45eaff';}
  function rareEffect(){playMoveEffect('cosmic',0);}

  function playGodCutin(cardName,moveName){
    if(saveData.settings.reducedFx) return;
    const old=document.querySelector('.godCutin'); if(old) old.remove();
    const div=document.createElement('div'); div.className='godCutin';
    div.innerHTML=`<div class="godBox"><h1>GOD CUT-IN</h1><p>${esc(cardName)}：${esc(moveName)}</p></div>`;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),1120);
  }
  function playEvolutionCutin(name,level){
    const div=document.createElement('div'); div.className='evoCutin'; div.innerHTML=`<div><h1>EVOLUTION!</h1><p class="strong">${esc(name)} 進化+${level}</p></div>`; document.body.appendChild(div); setTimeout(()=>div.remove(),1300); playMoveEffect('cosmic',0); toast(`${name} が進化しました！`);
  }

  window.addEventListener('error',e=>{console.error(e.error||e.message); toast('エラーを検知しました。データは保持されています。');});
  save(); render();
  </script>
</body>
</html>
